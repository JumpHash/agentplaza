# Builds the Linux CI image (.github/ci/Dockerfile) natively for x86_64 and aarch64 and pushes it to
# ghcr.io/jumphash/agentplaza-ci:<arch>. Runs when the Dockerfile changes, every Monday (a fresh
# stable Rust), and by hand.
name: ci-image

on:
  push:
    branches: [main]
    paths: [".github/ci/**", ".github/workflows/ci-image.yml"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image=ghcr.io/jumphash/agentplaza-ci:${{ matrix.arch }}
          docker build -t "$image" -f .github/ci/Dockerfile .github/ci
          docker push "$image"
