# The nightly safety net: every platform's tests on main, both Linux architectures, Windows and
# macOS. The pull request gate (pr.yml) runs Windows and macOS only for changes it sees as platform
# code and a pull request's tests only for the packages it changes, and main itself no longer tests
# (release.yml), so a shared-crate change that breaks one platform shows up here by the next
# morning. Nothing runs on a night after a day with no code changes (.github/ci/changes.sh against
# main as it was 24 hours earlier).
name: Nightly tests
run-name: "Nightly: every platform"

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    # The light runner (1 vCPU): seconds of git and jq, so they never wait behind a build.
    runs-on: [self-hosted, light]
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: false }
      # A hand run always tests.
      - id: diff
        run: |
          base=""
          if [ "${{ github.event_name }}" = schedule ]; then
            base=$(git rev-list -1 --before="24 hours ago" HEAD)
          fi
          .github/ci/changes.sh "$base" HEAD

  console:
    name: Web console
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/console.yml
  linux:
    name: Linux
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/linux.yml
  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/windows.yml
  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/macos.yml
