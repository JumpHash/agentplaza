name: MCP relay

# The MCP relay container's binary (docs/design/mcp.md): static musl builds for x86_64 and aarch64, saved to
# the Actions cache (no artifact storage) under this commit, for every package that can run container servers.
on:
  workflow_call:

jobs:
  relay:
    name: Build (x86_64 and arm64)
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - name: CI image
        run: .github/ci/image.sh
      - name: Build the relays (static musl, both architectures)
        run: |
          .github/ci/in-image.sh "rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl &&
            cargo build --release --locked --target x86_64-unknown-linux-musl -p mcp-relay &&
            cargo build --release --locked --target aarch64-unknown-linux-musl -p mcp-relay &&
            mkdir -p relay-out &&
            cp \${CARGO_TARGET_DIR:-target}/x86_64-unknown-linux-musl/release/mcp_relay relay-out/mcp_relay-x86_64 &&
            cp \${CARGO_TARGET_DIR:-target}/aarch64-unknown-linux-musl/release/mcp_relay relay-out/mcp_relay-aarch64"
      # The cache restores an entry at the path it was saved from, so the directory is renamed to the
      # path the platform jobs read (relay/) before it is saved.
      - name: Rename for the cache
        run: mv relay-out relay
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with: { path: relay, key: "mcp-relay-x86_64-aarch64-${{ github.sha }}" }
