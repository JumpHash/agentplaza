# Foundry trainer: CPU tests of the single, tight (gloo, 2 processes) and loose (2 islands through a
# local hub) paths, ONNX export and checks. The GPU images are built by hand or at release.
name: Trainer

# Runs on a push to main only: never on pull requests or other branches.
on:
  push:
    branches: [main]
    paths: ["trainer/**", ".github/workflows/trainer.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (CPU)
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: trainer
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
