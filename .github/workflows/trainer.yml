# Foundry trainer: CPU tests of the single, tight (gloo, 2 processes) and loose (2 islands through a
# local hub) paths, ONNX export and checks. The GPU images are built by hand or at release.
name: Trainer

# Runs on a push to main only: never on pull requests or other branches.
on:
  push:
    branches: [main]
    paths: ["trainer/**", ".github/workflows/trainer.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (CPU)
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: trainer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --extra cpu
      - run: uv run --extra cpu pytest -q
