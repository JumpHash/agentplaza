name: Web console

# The web console (apps/web/dist): built once per commit with its wasm engine and the IDE's wasm, tested, and
# saved to the Actions cache (no artifact storage) under this commit, for every package to ship. The build is not
# committed: each platform job restores it from here before it stages.
# pr.yml also runs it to test pull requests that touch the console (`trusted: false` for a fork:
# its own cache directory on the runner).
on:
  workflow_call:
    inputs:
      trusted: { type: boolean, default: true }

jobs:
  console:
    name: Build and test
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - name: CI image
        run: .github/ci/image.sh
      - name: Untrusted build cache
        if: ${{ !inputs.trusted }}
        run: echo "APZ_CI_CACHE=$HOME/.cache/agentplaza-ci-untrusted" >> "$GITHUB_ENV"
      - name: Keep the build directory fresh
        run: python3 .github/ci/build-cache.py mtimes "${APZ_CI_CACHE:-$HOME/.cache/agentplaza-ci}"
      # Type-checked, then built with the wasm engine or the job fails (build.mjs honours APZ_REQUIRE_ENGINE).
      # Each part's output is kept (tee, with pipefail from `shell: bash`) for the Web console comment.
      - name: Install and type-check
        id: typecheck
        shell: bash
        run: .github/ci/in-image.sh 'cd apps/web && npm ci && npm run typecheck' 2>&1 | tee console-typecheck.log
      - name: Build, with the wasm engine
        id: build
        shell: bash
        run: .github/ci/in-image.sh 'cd apps/web && npm run build' 2>&1 | tee console-build.log
        env:
          APZ_REQUIRE_ENGINE: "1"
      # The engine's bundles must stay within their size budgets (apps/web/size-budget.json); a file over budget fails here.
      - name: Size budget
        run: .github/ci/in-image.sh 'node apps/web/scripts/size-budget.mjs apps/web/dist'
      - name: Test
        id: test
        shell: bash
        run: .github/ci/in-image.sh 'cd apps/web && npm test' 2>&1 | tee console-test.log
      # The pull request's Web console comment (check-results.yml) is made from these.
      - name: Results for the pull request
        if: always()
        run: >-
          python3 .github/ci/results.py results console "Web console"
          --part "type-check=${{ steps.typecheck.outcome }}:console-typecheck.log"
          --part "build (with the wasm engine)=${{ steps.build.outcome }}:console-build.log"
          --part "tests=${{ steps.test.outcome }}:console-test.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: results-console, path: results, retention-days: 7 }
      # Only a release ships it; a pull request, queue or nightly run only tests.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with: { path: apps/web/dist, key: "console-${{ github.sha }}", enableCrossOsArchive: true }
