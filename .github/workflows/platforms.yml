# Builds and tests AgentPlaza on every platform it supports:
#   Linux x86_64 and arm64 (Ubuntu, Fedora, Arch; Debian arm64 stands in for Raspberry Pi OS on
#   a Pi 4/5), macOS (Apple Silicon and Intel), Windows (x64 and arm64).
# The hub, the node link, the gateway and the desktop app are built and tested on all of them;
# the guest harness (agent-harness) runs only inside the Linux microVMs, so it is built on Linux
# only. Postgres-backed tests run where a Postgres service is available (Linux x86_64) and skip
# themselves elsewhere (no APZ_TEST_DATABASE_URL).
name: platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86_64 (Ubuntu 24.04)", os: ubuntu-24.04, linux: true, postgres: true }
          - { name: "Linux arm64 (Ubuntu 24.04)", os: ubuntu-24.04-arm, linux: true }
          - { name: "macOS (Apple Silicon)", os: macos-15 }
          - { name: "macOS (Intel)", os: macos-15-intel }
          - { name: "Windows x64", os: windows-2025 }
          - { name: "Windows arm64", os: windows-11-arm }
    services:
      # Only the job that sets `postgres: true` uses it; service containers need Linux.
      postgres:
        image: ${{ matrix.postgres && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: apz
          POSTGRES_PASSWORD: apz
          POSTGRES_DB: apz_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U apz" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Linux build dependencies
        if: matrix.linux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev
      - name: Database for the Postgres-backed tests
        if: matrix.postgres
        shell: bash
        run: echo "APZ_TEST_DATABASE_URL=postgres://apz:apz@127.0.0.1:5434/apz_test" >> "$GITHUB_ENV"
      - name: Build (workspace)
        shell: bash
        run: |
          if [ "${{ matrix.linux }}" = "true" ]; then cargo build --workspace --locked
          else cargo build --workspace --exclude agent-harness --locked; fi
      - name: Test (workspace)
        shell: bash
        run: |
          if [ "${{ matrix.linux }}" = "true" ]; then cargo test --workspace --exclude agentplaza-desktop --locked
          else cargo test --workspace --exclude agent-harness --exclude agentplaza-desktop --locked; fi
      - name: Test (desktop app, pure parts)
        run: cargo test -p agentplaza-desktop --locked

  distros:
    name: Linux ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Fedora (x86_64)", image: "fedora:42", runner: ubuntu-24.04,
              deps: "dnf install -y gcc gcc-c++ make pkgconf-pkg-config libxkbcommon-devel wayland-devel curl git perl" }
          - { name: "Arch (x86_64)", image: "archlinux:base-devel", runner: ubuntu-24.04,
              deps: "pacman -Syu --noconfirm --needed libxkbcommon wayland curl git" }
          - { name: "Debian 12 arm64 (Raspberry Pi OS base)", image: "debian:bookworm", runner: ubuntu-24.04-arm,
              deps: "apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config libxkbcommon-dev libwayland-dev curl ca-certificates git" }
    steps:
      - name: System packages
        run: ${{ matrix.deps }}
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.image }}
      - name: Build (workspace)
        run: cargo build --workspace --locked
      - name: Test (hub, node link, gateway, node daemon)
        run: cargo test --workspace --exclude agentplaza-desktop --locked

  web:
    name: Web console
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm test --if-present
        working-directory: apps/web
