# The pull request gate: every pull request that is ready for review, and every merge-queue entry (the exact commit
# that will land), runs this. A draft runs nothing: its jobs are all skipped, and marking it ready for review starts
# its run. A pull request in a stack (based on the branch of the one below it, not on main)
# runs it too, against its own base, so each layer of the stack is tested on its own. "All checks passed" (job ci-ok) sums it up and is the one check the
# main ruleset requires: a check is named by its job's name, so renaming that job means changing the
# ruleset's required check with it.
#
#   changes     what the change touches (.github/ci/changes.sh): a change with no code in it
#               (Markdown, docs, .gitignore and the like) builds and tests nothing
#   lint        rustfmt, clippy with warnings as errors, cargo deny (advisories, licences, sources)
#   console     the web console's type-check, build and tests (console.yml)
#   linux       the Linux tests (linux.yml): x86_64 and arm64, each on its own runners
#   windows     the Windows tests (windows.yml), when platform code changes
#   macos       the macOS tests (macos.yml), when platform code changes
#   api         the hub API's tests against a scratch hub (api-tests/): Bruno, timings, fuzzing
#   coverage    after the tests passed: the code coverage of each kind of test (coverage.sh), by test
#               type, service, app and crate; pull requests only, commented by check-results.yml
#
# Speed: every build job starts from the runner's warm build directory and rebuilds only the crates
# the change touches (.github/ci/build-cache.py, in-image.sh). A pull request runs only the tests of
# the packages it changes and of every package that depends on them (changes.sh `tests`); the merge
# queue runs them all on the exact commit that lands. Windows and macOS run for every build:
# child modules may inherit cfg from their parent, and portable source still uses OS semantics.
#
# Safety: this is a public repository whose jobs run on the org's self-hosted runners. Workflows of
# outside contributors run only after an owner approves them (repository setting), no job here gets
# a secret, the token is read-only, and a pull request from a fork builds in its own cache
# directory on the runners (`trusted: false`), never in the one releases build from.
# Main itself only builds and packages (release.yml): its commits were tested here, in the queue.
# A nightly full run (nightly.yml) catches what the path filter lets through.
name: Checks
run-name: "${{ github.event_name == 'merge_group' && format('Merge queue: {0}', github.event.merge_group.head_commit.message) || format('#{0} {1}', github.event.pull_request.number, github.event.pull_request.title) }}"

on:
  pull_request:
    # The default three, and a draft marked ready for review (its first run).
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

# A newer push to a pull request cancels the older run; merge-queue runs are never cancelled.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    # A draft pull request runs nothing: every other job needs this one, so they are all skipped with it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # The light runner (1 vCPU): seconds of git and jq, so they never wait behind a build.
    runs-on: [self-hosted, light]
    timeout-minutes: 5
    outputs:
      # The merge queue always executes the gate on its exact candidate tree.
      build: ${{ steps.diff.outputs.build }}
      web: ${{ steps.diff.outputs.web }}
      platform: ${{ steps.diff.outputs.platform }}
      # On a pull request, the packages whose tests run (and their dependents'); the queue runs all.
      only: ${{ github.event_name == 'pull_request' && steps.diff.outputs.tests != 'all' && steps.diff.outputs.tests || '' }}
      trusted: ${{ steps.diff.outputs.trusted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          # A pull request from a fork is untrusted; a branch of this repository and the merge
          # queue (which holds only approved changes) are trusted.
          TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: .github/ci/changes.sh "$BASE" HEAD

  lint:
    name: Lint (rustfmt, clippy, cargo deny)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: CI image
        run: .github/ci/image.sh
      - name: Untrusted build cache
        if: needs.changes.outputs.trusted != 'true'
        run: echo "APZ_CI_CACHE=$HOME/.cache/agentplaza-ci-untrusted" >> "$GITHUB_ENV"
      - name: Keep the build directory fresh
        run: python3 .github/ci/build-cache.py mtimes "${APZ_CI_CACHE:-$HOME/.cache/agentplaza-ci}"
      # Each check's output is kept (tee, with pipefail from `shell: bash`) for the Lint comment.
      - name: rustfmt
        id: fmt
        shell: bash
        run: .github/ci/in-image.sh 'cargo fmt --all -- --check' 2>&1 | tee lint-rustfmt.log
      - name: clippy (warnings fail)
        id: clippy
        shell: bash
        run: .github/ci/in-image.sh 'cargo clippy --workspace --all-targets --locked -- -D warnings' 2>&1 | tee lint-clippy.log
      - name: cargo deny (advisories, licences, sources)
        id: deny
        shell: bash
        run: .github/ci/in-image.sh 'cargo deny --locked check' 2>&1 | tee lint-deny.log
      # The pull request's Lint comment (check-results.yml) is made from these.
      - name: Results for the pull request
        if: always()
        run: >-
          python3 .github/ci/results.py results lint Lint
          --part "rustfmt=${{ steps.fmt.outcome }}:lint-rustfmt.log"
          --part "clippy (warnings fail)=${{ steps.clippy.outcome }}:lint-clippy.log"
          --part "cargo deny (advisories, licences, sources)=${{ steps.deny.outcome }}:lint-deny.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: results-lint, path: results, retention-days: 7 }

  console:
    name: Web console
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/console.yml
    with:
      trusted: ${{ needs.changes.outputs.trusted == 'true' }}

  linux:
    name: Linux
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/linux.yml
    with:
      arches: '["x86_64","aarch64"]'
      # arm64 natively, for the packages whose code differs there; nightly runs its full suite.
      arm64: native
      trusted: ${{ needs.changes.outputs.trusted == 'true' }}
      only: ${{ needs.changes.outputs.only }}

  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/windows.yml
    with:
      trusted: ${{ needs.changes.outputs.trusted == 'true' }}
      only: ${{ needs.changes.outputs.only }}
      # A pull request only compiles what this runner cannot run; the queue builds it in full.
      link: ${{ github.event_name == 'merge_group' }}

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/macos.yml
    with:
      trusted: ${{ needs.changes.outputs.trusted == 'true' }}
      only: ${{ needs.changes.outputs.only }}
      # A pull request only compiles what this runner cannot run; the queue builds it in full.
      link: ${{ github.event_name == 'merge_group' }}

  # The hub API: the Bruno collection (a failure fails the gate), timings, and fuzzing from the spec
  # (reported, not failing yet). The results go to the api-results artifact; api-report.yml builds
  # the report from them and publishes it to Pages.
  api:
    name: Hub API (Bruno, timings, fuzzing)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: CI image
        run: .github/ci/image.sh
      - name: Untrusted build cache
        if: needs.changes.outputs.trusted != 'true'
        run: echo "APZ_CI_CACHE=$HOME/.cache/agentplaza-ci-untrusted" >> "$GITHUB_ENV"
      - name: Keep the build directory fresh
        run: python3 .github/ci/build-cache.py mtimes "${APZ_CI_CACHE:-$HOME/.cache/agentplaza-ci}"
      # Weft too: the hub runs the `weft` beside it as a process, and the build directory persists on the runner, so
      # without this the tests would meet a Weft another job built from other code.
      - name: Build the hub
        run: .github/ci/in-image.sh 'cargo build --release --locked -p apid --bin apid -p weft --bin weft'
      - name: Run the API tests
        id: run
        continue-on-error: true
        run: .github/ci/in-image.sh 'api-tests/run.sh /ci-target/release/apid api-out'
      - name: Keep the results (data only)
        if: always()
        run: |
          mkdir -p api-results/schemathesis
          cp api-out/bruno.json api-out/bench.json api-results/ 2>/dev/null || true
          cp api-out/schemathesis/*.xml api-results/schemathesis/ 2>/dev/null || true
          cp docs/api/openapi.json api-results/openapi.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: api-results, path: api-results, retention-days: 7, if-no-files-found: warn }
      - name: The API tests passed
        if: steps.run.outcome != 'success'
        run: |
          echo "::error::the API tests failed; the report linked on the pull request has the details"
          tail -n 60 api-out/bruno.log || true
          exit 1

  # The code coverage of every kind of test (.github/ci/coverage.sh), once the tests have passed: the Linux
  # tests, the hub API's and the web console's (a change without console code skips that one; its tests run
  # here anyway). Pull requests only: the Coverage comment (check-results.yml) is for the pull request, and the
  # merge queue has no use for it. The tests run again, instrumented, on the same runners and image as `api`.
  # Not in `ci-ok`: the measurement is informational, and a job of up to two hours must not gate every merge.
  coverage:
    name: Coverage (by test type, service, app and crate)
    needs: [changes, linux, api, console]
    if: >-
      always() && github.event_name == 'pull_request' && needs.changes.outputs.build == 'true' &&
      needs.linux.result == 'success' && needs.api.result == 'success' &&
      (needs.console.result == 'success' || needs.console.result == 'skipped')
    runs-on: [self-hosted, Linux, X64, hetzner]
    # A cold instrumented build of the workspace takes most of it; a later run rebuilds only what changed.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: CI image
        run: .github/ci/image.sh
      - name: Untrusted build cache
        if: needs.changes.outputs.trusted != 'true'
        run: echo "APZ_CI_CACHE=$HOME/.cache/agentplaza-ci-untrusted" >> "$GITHUB_ENV"
      - name: Keep the build directory fresh
        run: python3 .github/ci/build-cache.py mtimes "${APZ_CI_CACHE:-$HOME/.cache/agentplaza-ci}"
      # Its output is kept (tee, with pipefail from `shell: bash`) for the Coverage comment.
      - name: Coverage of every test type
        id: measure
        shell: bash
        run: .github/ci/in-image.sh '.github/ci/coverage.sh coverage-out' 2>&1 | tee coverage.log
      - name: The coverage data (coverage.json)
        if: steps.measure.outcome == 'success'
        run: python3 .github/ci/coverage.py coverage-out coverage.json
      # The pull request's Coverage comment (check-results.yml) is made from these.
      - name: Results for the pull request
        if: always()
        run: >-
          python3 .github/ci/results.py results coverage "Coverage"
          --part "measured (every test type)=${{ steps.measure.outcome }}:coverage.log"
          --data coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: results-coverage, path: results, retention-days: 7 }
      - name: Clean up
        if: always()
        run: |
          # The instrumented build is part of the build directory, so the same pruning as the other jobs.
          if [ -f .github/ci/build-cache.py ]; then
            python3 .github/ci/build-cache.py prune "${APZ_CI_CACHE:-$HOME/.cache/agentplaza-ci}/target" --max-gb 40
          fi

  # The one required check. A job skipped because the change does not touch it counts as passed.
  # It runs even when the run is cancelled (`always()`): GitHub counts a skipped required check as
  # passed, so a cancelled run would otherwise look green. It then says which jobs never finished.
  ci-ok:
    name: All checks passed
    needs: [changes, lint, console, linux, windows, macos, api]
    # Not on a draft, which runs nothing (and cannot merge); its run comes when it is marked ready for review.
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # The light runner (1 vCPU): seconds of git and jq, so they never wait behind a build.
    runs-on: [self-hosted, light]
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          # Jobs with the given result, comma-separated.
          with() { echo "$RESULTS" | jq -r --arg r "$1" '[to_entries[] | select(.value.result == $r) | .key] | join(", ")'; }
          failed=$(with failure) cancelled=$(with cancelled)
          if [ -n "$failed" ]; then echo "::error::failed: $failed"; fi
          if [ -n "$cancelled" ]; then
            echo "::error::cancelled before they finished (by hand, or by a newer push): $cancelled. Nothing failed there; re-run them."
          fi
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then exit 1; fi
          # `changes` decides what runs; if it did not succeed, nothing was checked.
          [ "$(echo "$RESULTS" | jq -r .changes.result)" = success ]
