# Raspberry Pi 4/5 (Raspberry Pi OS 64-bit, Debian bookworm arm64): the Pi deb and tarball, made
# from the Linux arm64 build (linux.yml uploads its stage; the binaries and the aarch64 guest are
# the same), with the Pi's node defaults and checks; then installed and run on a fresh bookworm.
# release.yml calls this after linux.yml on every push to main. (Pi code is tested by linux.yml's
# arm64 job.)
name: raspberry-pi

on:
  workflow_call:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }

permissions:
  contents: read
  packages: read

jobs:
  package:
    name: package (Raspberry Pi OS arm64)
    if: inputs.package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    container:
      image: ghcr.io/jumphash/agentplaza-ci:aarch64
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: stage-linux-aarch64 }
      - name: Package
        run: |
          tar -xzf stage-linux-aarch64.tgz
          printf '%s\n' "${{ inputs.version }}" > stage/share/agentplaza/VERSION
          packaging/raspberry-pi/build.sh stage "${{ inputs.version }}" out
      - uses: actions/upload-artifact@v4
        with: { name: pkg-raspberrypi, path: "out/*", if-no-files-found: error }

  verify:
    name: install on a fresh Raspberry Pi OS (bookworm arm64)
    if: inputs.package
    needs: package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    container: debian:bookworm
    steps:
      - uses: actions/download-artifact@v4
        with: { name: pkg-raspberrypi }
      - run: apt-get update && apt-get install -y ./agentplaza_*_arm64-raspberrypi.deb
      - run: |
          for b in apid apz-link agentplaza noded vsockd agentplaza-desktop; do "$b" --version; done
          test -f /etc/default/agentplaza-node
          test -f /usr/share/agentplaza/console/index.html
          test -s /usr/share/agentplaza/guest/aarch64/vmlinux
