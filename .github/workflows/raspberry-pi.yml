# Raspberry Pi 4/5 (Raspberry Pi OS 64-bit, Debian bookworm arm64): the Pi deb and tarball, made
# from the Linux arm64 build (linux.yml leaves its stage in the cache; the binaries and the aarch64
# guest are the same), with the Pi's node defaults and checks; installed and run on a fresh
# bookworm in the same job where the runner can run arm64 (qemu). release.yml calls this after
# linux.yml on every push to main. (The Pi's code is tested by linux.yml's arm64 job.) Runs on the
# org's self-hosted Linux runner, packaging inside the CI image (see linux.yml).
name: Raspberry Pi

on:
  workflow_call:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  package:
    name: Package (Raspberry Pi OS arm64)
    if: inputs.package
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: stage-out, key: "stage-linux-aarch64-${{ github.run_id }}", fail-on-cache-miss: true }
      - name: CI image
        run: .github/ci/image.sh
      # The install check runs the Pi packages' arm64 binaries on this x86_64 runner: the kernel hands them to qemu.
      # This registers qemu's binfmt handler on the runner, from a privileged container; it lasts until it reboots.
      - name: qemu for arm64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - name: Package
        run: |
          tar -xzf stage-out/stage-linux-aarch64.tgz
          printf '%s\n' "$VERSION" > stage/share/agentplaza/VERSION
          .github/ci/in-image.sh 'packaging/raspberry-pi/build.sh stage "$VERSION" out-raspberrypi'
      # Raspberry Pi OS is Debian: the current release (trixie) and the one before it (bookworm), both arm64.
      - name: Install and run on a fresh Raspberry Pi OS (bookworm and trixie, arm64)
        run: |
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "::error::the install check requires the qemu-aarch64 binfmt handler"; exit 1
          fi
          for release in bookworm trixie; do
            echo "== debian:$release"
            docker run --rm --platform linux/arm64 -v "$PWD/out-raspberrypi:/pkgs:ro" "debian:$release" sh -c '
              apt-get update -qq && apt-get install -y -qq /pkgs/agentplaza_*_arm64-raspberrypi.deb &&
              for b in apid apz-link agentplaza noded vsockd agentplaza-desktop; do "$b" --version; done &&
              test -f /etc/default/agentplaza-node &&
              test -f /usr/share/agentplaza/console/index.html &&
              test -s /usr/share/agentplaza/guest/aarch64/vmlinux'
          done
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: out-raspberrypi, key: "pkg-raspberrypi-${{ github.run_id }}" }
