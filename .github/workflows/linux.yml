# Linux (x86_64, arm64): one job per architecture tests and, with `package`, builds the deb
# (Ubuntu, Debian), rpm (Fedora), pacman (Arch, Arch Linux ARM) packages and tarballs from the same
# optimised build; then each package is installed and run in its distribution.
# Pull requests run the tests; release.yml calls this with `package: true` on every push to main.
#
# Speed (the whole release stays within minutes on standard runners): the jobs run in the prebuilt
# CI image (.github/ci/Dockerfile: tools, Rust, nextest, fpm already installed); dependencies come
# from rust-cache (saved from main) and unchanged workspace crates from sccache; tests and packages
# share one release build (no LTO); lld links; nextest runs the tests in parallel and kills a hang.
name: linux

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }
  workflow_call:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }

concurrency:
  group: ${{ github.workflow }}-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTC_WRAPPER: sccache
  # sccache keeps its cache in GitHub's Actions cache; under another runner (a local Forgejo), on disk.
  SCCACHE_GHA_ENABLED: ${{ github.server_url == 'https://github.com' && 'true' || 'false' }}
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
  VERSION: ${{ inputs.version || '0.0.0-ci' }}

jobs:
  build:
    name: ${{ inputs.package && 'test and package' || 'test' }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, triple: x86_64-unknown-linux-gnu, postgres: "postgres:17" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu, postgres: "" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container:
      image: ghcr.io/jumphash/agentplaza-ci:${{ matrix.arch }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env: { POSTGRES_USER: apz, POSTGRES_PASSWORD: apz, POSTGRES_DB: apz_test }
        options: --health-cmd "pg_isready -U apz" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory '*'
      - name: The Postgres-backed tests (x86_64)
        if: matrix.postgres != ''
        run: echo "APZ_TEST_DATABASE_URL=postgres://apz:apz@postgres:5432/apz_test" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo nextest run --workspace --locked --cargo-profile release --profile ci
      - name: Build the binaries
        if: inputs.package
        run: cargo build --release --locked -p apid -p apz-link -p agentplaza-cli -p agentplaza-desktop -p noded -p vsockd -p vmm -p vmctl
      - uses: actions/download-artifact@v4
        if: inputs.package
        id: guest
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        with: { name: "guest-${{ matrix.arch }}", path: "target/guest/${{ matrix.arch }}" }
      - name: Build the guest (a hand-run package, no release job supplied one)
        if: inputs.package && steps.guest.outcome != 'success'
        run: scripts/mk-guest.sh ${{ matrix.arch }}
      - name: Stage and package
        if: inputs.package
        run: |
          packaging/scripts/stage.sh ${{ matrix.triple }} target/release stage "$VERSION"
          packaging/linux/build.sh stage "$VERSION" ${{ matrix.arch }} out
          tar -czf stage-linux-${{ matrix.arch }}.tgz stage
      - uses: actions/upload-artifact@v4
        if: inputs.package
        with: { name: "pkg-linux-${{ matrix.arch }}", path: "out/*", if-no-files-found: error }
      # The Raspberry Pi package is made from the arm64 build (raspberry-pi.yml).
      - uses: actions/upload-artifact@v4
        if: inputs.package && matrix.arch == 'aarch64'
        with: { name: "stage-linux-aarch64", path: "stage-linux-aarch64.tgz", retention-days: 1 }

  verify:
    name: install on ${{ matrix.name }}
    if: inputs.package
    needs: build
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 24.04 (x86_64)", runner: ubuntu-24.04, image: "ubuntu:24.04", arch: x86_64,
              install: "apt-get update && apt-get install -y ./agentplaza_*_amd64.deb" }
          - { name: "Debian 12 (arm64)", runner: ubuntu-24.04-arm, image: "debian:bookworm", arch: aarch64,
              install: "apt-get update && apt-get install -y ./agentplaza_*_arm64.deb" }
          - { name: "Fedora 42 (x86_64)", runner: ubuntu-24.04, image: "fedora:42", arch: x86_64,
              install: "dnf install -y ./agentplaza-*.x86_64.rpm" }
          - { name: "Fedora 42 (aarch64)", runner: ubuntu-24.04-arm, image: "fedora:42", arch: aarch64,
              install: "dnf install -y ./agentplaza-*.aarch64.rpm" }
          - { name: "Arch Linux (x86_64)", runner: ubuntu-24.04, image: "archlinux:latest", arch: x86_64,
              install: "pacman -Sy --noconfirm && pacman -U --noconfirm ./agentplaza-*-x86_64.pkg.tar.zst" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: "pkg-linux-${{ matrix.arch }}" }
      - name: Install
        run: ${{ matrix.install }}
      - name: Run
        run: |
          for b in apid apz-link agentplaza noded vsockd agentplaza-desktop; do "$b" --version; done
          test -f /usr/share/agentplaza/console/index.html
          test -s /usr/share/agentplaza/guest/${{ matrix.arch }}/vmlinux
          test -s /usr/share/agentplaza/guest/${{ matrix.arch }}/initrd.gz
