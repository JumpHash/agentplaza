# Linux (x86_64, arm64): one job per architecture tests and, with `package`, builds the deb
# (Ubuntu, Debian), rpm (Fedora), pacman (Arch, Arch Linux ARM) packages and tarballs from the same
# optimised build, then installs and runs them in Ubuntu, Debian, Fedora and Arch containers.
# Callers: pr.yml tests every pull request and merge-queue entry on both architectures,
# release.yml packages main without testing again (`tests: false`: the queue tested that commit),
# nightly.yml tests both architectures. It also runs by hand.
#
# Where: the org's self-hosted Linux runners, x86_64 and arm64 Ubuntu hosts with Docker. Every
# build runs inside the CI image (.github/ci: Ubuntu 22.04, so glibc 2.35 and the packages run on
# every distribution as new or newer), built on each runner for its own architecture and kept there
# until its Dockerfile changes. A pull request tests arm64 natively on the arm64 runners, for the
# packages whose code differs there (their 20 GB disks do not hold the whole workspace's build);
# nightly tests arm64's full suite cross-compiled on x86_64, under qemu (`arm64`). arm64 packages are
# cross-compiled on x86_64 too, where the AppImage tooling is. Speed: cargo's build directory and
# registry persist on the runner (.github/ci/in-image.sh), and the checkout keeps the mtimes this
# runner last built with (.github/ci/build-cache.py), so only changed crates compile; tests and
# packages use the same release profile on x86_64, the reference platform; arm64 tests with the
# `checked` profile (Cargo.toml: incremental, with debug assertions); nextest runs the tests in parallel
# and kills a hang; a pull request runs only the tests of the packages it changes and of those that
# depend on them (`only`, from changes.sh).
# Nothing goes through artifact storage: the guest comes from the cache guest.yml fills, and the
# packages go to the cache under this run's id for release.yml's publish job.
name: Linux
run-name: "${{ format('Linux by hand: {0}', inputs.package && 'package' || 'test') }}"

on:
  workflow_dispatch:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }
      tests: { type: boolean, default: true }
      trusted: { type: boolean, default: true }
      arches: { type: string, default: '["x86_64","aarch64"]' }
      # Packages (space-separated) whose tests run, with those of every package that depends on
      # them; empty: all.
      only: { type: string, default: "" }
      # arm64's tests: `full`, the whole workspace cross-compiled on x86_64 and run under qemu (its
      # disks hold that build); `native`, the packages whose code differs on arm64 (PACKAGES below),
      # natively on the arm64 runners, whose 20 GB disks hold that and not the whole workspace.
      arm64: { type: string, default: full }
  workflow_call:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }
      tests: { type: boolean, default: true }
      trusted: { type: boolean, default: true }
      arches: { type: string, default: '["x86_64","aarch64"]' }
      # Packages (space-separated) whose tests run, with those of every package that depends on
      # them; empty: all.
      only: { type: string, default: "" }
      # arm64's tests: `full`, the whole workspace cross-compiled on x86_64 and run under qemu (its
      # disks hold that build); `native`, the packages whose code differs on arm64 (PACKAGES below),
      # natively on the arm64 runners, whose 20 GB disks hold that and not the whole workspace.
      arm64: { type: string, default: full }

concurrency:
  group: ${{ github.workflow }}-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || '0.0.0-ci' }}

jobs:
  build:
    name: ${{ inputs.package && (inputs.tests && 'Test and package' || 'Package') || 'Test' }} (${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    # arm64 runs on the arm64 runners when it tests natively; packaging, and the full suite, are
    # cross-compiled on x86_64 (see above).
    runs-on: ${{ fromJSON(matrix.arch == 'aarch64' && !inputs.package && inputs.arm64 == 'native' && '["self-hosted","Linux","ARM64","hetzner"]' || '["self-hosted","Linux","X64","hetzner"]') }}
    # A cold build directory (a new runner, a new Rust or a dependency update) compiles everything
    # once; after that a run rebuilds only what changed. A hung test is killed by nextest after 2
    # minutes.
    timeout-minutes: 90
    env:
      NET: apz-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      # Per architecture: cargo's --target (none on the runner's own architecture, so tests and
      # binaries share one build; aarch64 when x86_64 cross-compiles it) and where the release
      # build lands.
      TRIPLE: ${{ matrix.arch == 'aarch64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
      DEB: ${{ matrix.arch == 'aarch64' && 'arm64' || 'amd64' }}
      TARGET_ARG: ${{ matrix.arch == 'aarch64' && (inputs.package || inputs.arm64 == 'full') && '--target aarch64-unknown-linux-gnu' || '' }}
      OUT: ${{ matrix.arch == 'aarch64' && (inputs.package || inputs.arm64 == 'full') && '/ci-target/aarch64-unknown-linux-gnu/release' || '/ci-target/release' }}
      # What the tests build: the workspace, but natively on arm64 only the packages whose code
      # differs there (cfg(target_arch), or the VM node and its devices): the rest is the same code
      # x86_64 tests, and the full arm64 suite runs nightly (arm64: full). Not agent-harness: no
      # arch-specific code, and its tests assume a non-root user, which rootless Docker's builds are not.
      PACKAGES: ${{ matrix.arch == 'aarch64' && !(matrix.arch == 'aarch64' && (inputs.package || inputs.arm64 == 'full')) && '-p vmm -p vmctl -p noded -p vsockd -p apz-setup -p acpi_tables' || '--workspace' }}
      # The tests' time budgets (APZ_PERF_SLACK): arm64 cross-compiled on x86_64 runs its tests
      # emulated, 15 to 50 times slower (natively it needs no more than x86_64).
      APZ_PERF_SLACK: ${{ matrix.arch == 'aarch64' && (inputs.package || inputs.arm64 == 'full') && '25' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: CI image
        run: .github/ci/image.sh
      # Arm64 code run on this x86_64 runner (the qemu test run, the packages' install checks) needs the kernel to hand
      # an arm64 binary to qemu, also for the binaries the tests start themselves (weft, apid). This registers qemu's
      # binfmt handler on the runner, from a privileged container; it lasts until the runner reboots.
      - name: qemu for arm64
        if: matrix.arch == 'aarch64' && (inputs.package || inputs.arm64 == 'full')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      # A pull request from a fork builds in its own cache directory, never in the one releases use.
      - name: Untrusted build cache
        if: ${{ !inputs.trusted }}
        run: echo "APZ_CI_CACHE=$HOME/.cache/agentplaza-ci-untrusted" >> "$GITHUB_ENV"
      # Fresh clone, old mtimes: unchanged crates stay built (.github/ci/build-cache.py).
      - name: Keep the build directory fresh
        run: python3 .github/ci/build-cache.py mtimes "${APZ_CI_CACHE:-$HOME/.cache/agentplaza-ci}"
      - name: Which tests
        if: inputs.tests && inputs.only != ''
        env: { ONLY: "${{ inputs.only }}" }
        run: |
          filter=""
          for p in $ONLY; do filter="${filter:+$filter | }rdeps(=$p)"; done
          echo "the tests of $ONLY and of what depends on them: $filter"
          echo "NEXTEST_FILTER=-E '$filter' --no-tests=warn" >> "$GITHUB_ENV"
      - name: Postgres for the tests
        if: inputs.tests
        run: |
          docker network create "$NET"
          docker run -d --rm --name "$NET-pg" --network "$NET" \
            -e POSTGRES_USER=apz -e POSTGRES_PASSWORD=apz -e POSTGRES_DB=apz_test postgres:17
          for _ in $(seq 60); do docker exec "$NET-pg" pg_isready -U apz -q && break; sleep 1; done
          echo "APZ_CI_NETWORK=$NET" >> "$GITHUB_ENV"
          # The tests' Postgres is a container on this job's own network: sslmode=disable says the unencrypted
          # connection is meant (the hub refuses one to a host off its machine otherwise).
          echo "APZ_TEST_DATABASE_URL=postgres://apz:apz@$NET-pg:5432/apz_test?sslmode=disable" >> "$GITHUB_ENV"
      # A report from an earlier run must not pass for this one's.
      - name: Clear the last test report
        if: inputs.tests
        run: rm -f target/nextest/ci/junit.xml
      - name: Test
        id: test
        if: inputs.tests
        run: .github/ci/in-image.sh "cargo nextest run ${{ env.PACKAGES }} --locked --cargo-profile ${{ matrix.arch == 'x86_64' && 'release' || 'checked' }} --profile ci ${{ env.TARGET_ARG }} ${NEXTEST_FILTER:-}"
      # The pull request's Tests comment (check-results.yml) is made from these.
      - name: Results for the pull request
        if: always() && inputs.tests
        env:
          ARCH_NAME: "${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }}"
          TEST_OUTCOME: "${{ steps.test.outcome }}"
        run: >-
          python3 .github/ci/results.py results tests "Linux $ARCH_NAME"
          --junit target/nextest/ci/junit.xml --part "tests=$TEST_OUTCOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.tests
        with: { name: "results-linux-${{ matrix.arch }}", path: results, retention-days: 7 }
      # The AppImage runs where WebKitGTK is not installed, so its desktop app is built without the webview (its HTML
      # artifacts show the still card); the packages depend on WebKitGTK and get the full one. arm64 has no webview.
      - name: Build the AppImage's desktop app (no webview)
        if: inputs.package && matrix.arch == 'x86_64'
        run: >-
          .github/ci/in-image.sh "CARGO_PROFILE_RELEASE_STRIP=symbols cargo build --release --locked ${{ env.TARGET_ARG }} -p agentplaza-desktop --no-default-features &&
          cp ${{ env.OUT }}/agentplaza-desktop ${{ env.OUT }}/agentplaza-desktop-portable"
      # Packaged binaries leave out their symbol tables (about half of apid's size); the test builds above keep
      # theirs. Release builds carry no debug info to split off, and a panic still names its file and line.
      - name: Build the binaries
        if: inputs.package
        run: >-
          .github/ci/in-image.sh "CARGO_PROFILE_RELEASE_STRIP=symbols cargo build --release --locked ${{ env.TARGET_ARG }}
          -p apid -p apz-link -p agentplaza-cli -p agentplaza-desktop -p noded -p vsockd -p vmm -p vmctl"
      - name: The guest (cached by guest.yml)
        if: inputs.package
        id: guest
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/guest/${{ matrix.arch }}
          key: "guest-${{ matrix.arch }}-${{ hashFiles('scripts/mk-guest.sh','scripts/mk-guest-kernel.sh','scripts/mk-initrd.sh','scripts/guest/**','crates/**','Cargo.toml','Cargo.lock','.cargo/**','.github/ci/Dockerfile') }}"
          enableCrossOsArchive: true
      - name: "Build the guest (not cached: a hand run, or guest.yml did not run)"
        if: inputs.package && steps.guest.outputs.cache-hit != 'true'
        env: { APZ_CI_TARGET: workspace, ARCH: "${{ matrix.arch }}" }
        run: .github/ci/in-image.sh "APZ_BUSYBOX=\$( [ $ARCH = aarch64 ] && echo \$APZ_BUSYBOX_AARCH64 ) scripts/mk-guest.sh $ARCH"
      - name: The relay binaries (both architectures, from the relay job)
        if: inputs.package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: relay, key: "mcp-relay-x86_64-aarch64-${{ github.sha }}", fail-on-cache-miss: true }
      - name: The web console (from the console job)
        if: inputs.package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: apps/web/dist, key: "console-${{ github.sha }}", fail-on-cache-miss: true, enableCrossOsArchive: true }
      - name: Stage and package
        if: inputs.package
        env:
          ARCH: "${{ matrix.arch }}"
          APPIMAGE_DESKTOP: "${{ matrix.arch == 'x86_64' && format('{0}/agentplaza-desktop-portable', env.OUT) || '' }}"
        run: |
          .github/ci/in-image.sh "APZ_RELAY_DIR=relay packaging/scripts/stage.sh $TRIPLE $OUT stage \"\$VERSION\" &&
            APZ_APPIMAGE_DESKTOP=$APPIMAGE_DESKTOP packaging/linux/build.sh stage \"\$VERSION\" $ARCH out-linux-$ARCH"
          mkdir -p stage-out && tar -czf stage-out/stage-linux-$ARCH.tgz stage
      - name: Install and run on Ubuntu 24.04, Debian 12, Fedora 42, Arch; the AppImage on Ubuntu 22.04
        if: inputs.package
        env:
          ARCH: "${{ matrix.arch }}"
        run: |
          # arm64 packages run under qemu: only where the runner has it registered (binfmt_misc).
          if [ "$ARCH" = aarch64 ] && [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "::error::arm64 install checks require the qemu-aarch64 binfmt handler"; exit 1
          fi
          out=$PWD/out-linux-$ARCH
          plat=$([ "$ARCH" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          check='for b in apid apz-link agentplaza noded vsockd agentplaza-desktop; do "$b" --version; done; test -f /usr/share/agentplaza/console/index.html; test -s /usr/share/agentplaza/guest/'"$ARCH"'/vmlinux; test -s /usr/share/agentplaza/guest/'"$ARCH"'/initrd.gz'
          # run IMAGE SCRIPT NAME [CHECK]: SCRIPT, then the installed-package checks unless CHECK is "none".
          run() {
            if [ "${4:-}" = none ]; then script=$2; else script="$2 && $check"; fi
            docker run --rm --platform "$plat" -v "$out:/pkgs:ro" "$1" sh -c "$script" > "install-$3.log" 2>&1 \
              && echo "ok   $3" || { echo "FAIL $3"; tail -30 "install-$3.log"; return 1; }
          }
          run ubuntu:24.04 "apt-get update -qq && apt-get install -y -qq /pkgs/agentplaza_*_$DEB.deb" ubuntu & a=$!
          run debian:bookworm "apt-get update -qq && apt-get install -y -qq /pkgs/agentplaza_*_$DEB.deb" debian & b=$!
          run fedora:42 "dnf install -y -q /pkgs/agentplaza-*.$ARCH.rpm" fedora & c=$!
          # The AppImage on the oldest glibc it supports, without FUSE (unpacked to run): the desktop
          # app by default, the command line tool through a link named agentplaza.
          run ubuntu:22.04 "cd /tmp && cp /pkgs/AgentPlaza-*-linux-$ARCH.AppImage app.AppImage && ln -s app.AppImage agentplaza && export APPIMAGE_EXTRACT_AND_RUN=1 && ./app.AppImage --version && ./agentplaza --version && ./app.AppImage --cli --version" appimage none & d=$!
          pids="$a $b $c $d"
          if [ "$ARCH" = x86_64 ]; then
            run archlinux:latest "pacman -Sy --noconfirm >/dev/null && pacman -U --noconfirm /pkgs/agentplaza-*-x86_64.pkg.tar.zst" arch & pids="$pids $!"
          fi
          status=0; for p in $pids; do wait $p || status=1; done; exit $status
      # Handed to release.yml's publish job (and, for arm64, raspberry-pi.yml) through the cache.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.package
        with: { path: "out-linux-${{ matrix.arch }}", key: "pkg-linux-${{ matrix.arch }}-${{ github.run_id }}" }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.package && matrix.arch == 'aarch64'
        with: { path: stage-out, key: "stage-linux-aarch64-${{ github.run_id }}" }
      - name: Clean up
        if: always()
        run: |
          docker rm -f "$NET-pg" >/dev/null 2>&1 || true
          docker network rm "$NET" >/dev/null 2>&1 || true
          # Units no build has used for days go first; the directory is emptied only if the disk is short.
          # (Not when the job ended before its checkout.)
          # 40 GB: the runner fleet's storage guard wipes ~/.cache, and every Docker image, when the
          # host's disk passes its limit, so the build directory stays well inside it.
          if [ -f .github/ci/build-cache.py ]; then
            python3 .github/ci/build-cache.py prune "${APZ_CI_CACHE:-$HOME/.cache/agentplaza-ci}/target" --max-gb 40
          fi
