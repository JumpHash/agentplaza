# The guest VM images (kernel + initrd per architecture, scripts/mk-guest.sh) the agents run in,
# kept in the Actions cache until their sources change. `check` looks the cache up (seconds); on a
# miss, `build-<arch>` makes them natively on Ubuntu 22.04 (the packages' glibc) and saves them.
# The package jobs restore them from the cache (no artifact storage). release.yml calls this once
# per release, before the platform workflows; it also runs by hand.
name: guest

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: cached guests
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      x86_64: ${{ steps.x86_64.outputs.cache-hit }}
      aarch64: ${{ steps.aarch64.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
      - id: x86_64
        uses: actions/cache/restore@v4
        with:
          path: target/guest/x86_64
          key: "guest-x86_64-${{ hashFiles('scripts/mk-guest.sh','scripts/mk-guest-kernel.sh','scripts/mk-initrd.sh','scripts/guest/**','crates/agent-harness/**','Cargo.lock') }}"
          enableCrossOsArchive: true
          lookup-only: true
      - id: aarch64
        uses: actions/cache/restore@v4
        with:
          path: target/guest/aarch64
          key: "guest-aarch64-${{ hashFiles('scripts/mk-guest.sh','scripts/mk-guest-kernel.sh','scripts/mk-initrd.sh','scripts/guest/**','crates/agent-harness/**','Cargo.lock') }}"
          enableCrossOsArchive: true
          lookup-only: true

  build-x86_64:
    name: build the guest (x86_64)
    needs: check
    if: needs.check.outputs.x86_64 != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          sudo=$(command -v sudo || true)
          $sudo apt-get update -qq
          $sudo apt-get install -y -qq --no-install-recommends flex bison bc libelf-dev libssl-dev cpio busybox-static file
          scripts/mk-guest.sh x86_64
      - uses: actions/cache/save@v4
        with:
          path: target/guest/x86_64
          key: "guest-x86_64-${{ hashFiles('scripts/mk-guest.sh','scripts/mk-guest-kernel.sh','scripts/mk-initrd.sh','scripts/guest/**','crates/agent-harness/**','Cargo.lock') }}"
          enableCrossOsArchive: true

  build-aarch64:
    name: build the guest (aarch64)
    needs: check
    if: needs.check.outputs.aarch64 != 'true'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          sudo=$(command -v sudo || true)
          $sudo apt-get update -qq
          $sudo apt-get install -y -qq --no-install-recommends flex bison bc libelf-dev libssl-dev cpio busybox-static file
          scripts/mk-guest.sh aarch64
      - uses: actions/cache/save@v4
        with:
          path: target/guest/aarch64
          key: "guest-aarch64-${{ hashFiles('scripts/mk-guest.sh','scripts/mk-guest-kernel.sh','scripts/mk-initrd.sh','scripts/guest/**','crates/agent-harness/**','Cargo.lock') }}"
          enableCrossOsArchive: true
