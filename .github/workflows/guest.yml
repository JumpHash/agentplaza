# The guest VM images (kernel + initrd per architecture, scripts/mk-guest.sh) the agents run in,
# kept in the Actions cache until their sources change. `check` looks the cache up (seconds); on a
# miss, `build` makes the missing ones in the CI image on the org's self-hosted Linux runner (arm64
# cross-compiled, with an arm64 busybox) and saves them.
# The package jobs restore them from the cache (no artifact storage). release.yml calls this once
# per release, before the platform workflows; it also runs by hand.
name: Agent guest

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Find cached guests
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 3
    outputs:
      x86_64: ${{ steps.x86_64.outputs.cache-hit }}
      aarch64: ${{ steps.aarch64.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The keys come from git's content ids of the guest's inputs (.github/ci/guest-key.sh): the same on every OS.
      - name: The guests' cache keys
        id: keys
        run: |
          echo "x86_64=$(sh .github/ci/guest-key.sh x86_64)" >> "$GITHUB_OUTPUT"
          echo "aarch64=$(sh .github/ci/guest-key.sh aarch64)" >> "$GITHUB_OUTPUT"
      - id: x86_64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/guest/x86_64
          key: ${{ steps.keys.outputs.x86_64 }}
          enableCrossOsArchive: true
          lookup-only: true
      - id: aarch64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/guest/aarch64
          key: ${{ steps.keys.outputs.aarch64 }}
          enableCrossOsArchive: true
          lookup-only: true

  build:
    name: Build the guest (${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }})
    needs: check
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    if: needs.check.outputs.x86_64 != 'true' || needs.check.outputs.aarch64 != 'true'
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 30
    env:
      # mk-initrd.sh builds the harness into the workspace's target/.
      APZ_CI_TARGET: workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
        if: needs.check.outputs[matrix.arch] != 'true'
      - name: CI image
        if: needs.check.outputs[matrix.arch] != 'true'
        run: .github/ci/image.sh
      - name: Build
        if: needs.check.outputs[matrix.arch] != 'true'
        run: .github/ci/in-image.sh 'APZ_BUSYBOX=$( [ ${{ matrix.arch }} = aarch64 ] && echo $APZ_BUSYBOX_AARCH64 ) scripts/mk-guest.sh ${{ matrix.arch }}'
      - name: The guest's cache key
        id: guest-key
        if: needs.check.outputs[matrix.arch] != 'true'
        env: { ARCH: "${{ matrix.arch }}" }
        run: echo "key=$(sh .github/ci/guest-key.sh "$ARCH")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.check.outputs[matrix.arch] != 'true'
        with:
          path: target/guest/${{ matrix.arch }}
          key: ${{ steps.guest-key.outputs.key }}
          enableCrossOsArchive: true
