# Windows (x64, arm64): tests, and with `package` an MSI and a zip per architecture.
# Pull requests run the tests; release.yml calls this with `package: true` on every push to main.
name: windows

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }

concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  FAST_DEPS: --config profile.dev.package."*".opt-level=0 --config profile.dev.package.agentplaza-desktop.opt-level=0
  # LLVM's linker instead of link.exe: much faster on large binaries.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: rust-lld

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2025 }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    env:
      APZ_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with: { cache-targets: "false" }
      - name: Test (workspace; the guest harness runs only inside Linux VMs)
        run: cargo test --workspace --exclude agent-harness --locked $FAST_DEPS

  package:
    name: package (${{ matrix.arch }})
    if: inputs.package
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2025, triple: x86_64-pc-windows-msvc }
          - { arch: arm64, runner: windows-11-arm, triple: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    env:
      APZ_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Build (release: hub, desktop, node link)"
        run: cargo build --release --locked -p apid -p apz-link -p agentplaza-cli -p agentplaza-desktop
      - name: Stage
        run: packaging/scripts/stage.sh ${{ matrix.triple }} target/release stage "$APZ_VERSION"
      - name: Package
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: packaging/windows/build.ps1 -Stage stage -Version $env:APZ_VERSION -Arch ${{ matrix.arch }} -Out out
      - name: Verify
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'msi.log'
          $msi = (Get-ChildItem out -Filter *.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', "`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "msiexec exited $($p.ExitCode)" }
          $bin = Join-Path $env:ProgramFiles 'AgentPlaza\bin'
          foreach ($b in 'apid', 'apz-link', 'agentplaza', 'agentplaza-desktop') { & (Join-Path $bin "$b.exe") --version; if ($LASTEXITCODE) { throw "$b failed" } }
          if (-not (Test-Path (Join-Path $env:ProgramFiles 'AgentPlaza\share\agentplaza\console\index.html'))) { throw 'console missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
