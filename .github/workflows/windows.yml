# Windows (x64, arm64): one job per architecture tests and, with `package`, builds an MSI and a zip
# from the same optimised build, then installs the MSI and runs what it installed. The x64 package
# carries the VM node (the Windows Hypervisor Platform backend) and the x86_64 guest.
# CI runs on main only: release.yml calls this with `package: true` on every push to main (no pull
# request builds); it also runs by hand.
# Where: the org's self-hosted Windows runner (x64). arm64 is cross-compiled there: its tests are
# built, not run, and its MSI is not installed. That needs LLVM (ring builds its arm64 code with
# clang) and Visual Studio's "MSVC v143 ARM64 build tools" on the runner, so the arm64 leg runs
# only when the repository variable APZ_WINDOWS_ARM64 is `on`; without it a release ships x64. Speed: cargo's build directory persists on the
# runner (only changed crates compile), one release build for tests and packages, rust-lld, nextest.
name: windows

on:
  workflow_dispatch:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }
  workflow_call:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }

concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  # LLVM's linker instead of link.exe: much faster on large binaries.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: rust-lld
  VERSION: ${{ inputs.version || '0.0.0-ci' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ inputs.package && 'test and package' || 'test' }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(vars.APZ_WINDOWS_ARM64 == 'on' && '["x64","arm64"]' || '["x64"]') }}
    # Per architecture: the target, the guest (x64 carries the VM node and the x86_64 guest),
    # whether its tests can run here, and the binaries it ships.
    env:
      TRIPLE: ${{ matrix.arch == 'x64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}
      GARCH: ${{ matrix.arch == 'x64' && 'x86_64' || '' }}
      BINS: >-
        -p apid -p apz-link -p agentplaza-cli -p agentplaza-desktop
        ${{ matrix.arch == 'x64' && '-p noded -p vsockd -p vmctl' || '' }}
    runs-on: [self-hosted, Windows, X64, hetzner]
    # A cold build directory compiles everything once on the runner's 4 cores; after that a run
    # rebuilds only what changed. A hung test is killed by nextest after 2 minutes.
    timeout-minutes: 90
    steps:
      # Check out with LF line endings, as on Linux: hashFiles() then gives the guest the same
      # cache key guest.yml saved it under, and the shell scripts run as written.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      # zstd on PATH: the Actions cache keys an entry by its compression too, and the Linux jobs
      # save theirs (the guest) with zstd; without it here they are not found, and what this job
      # saves is not found on Linux. Kept in the runner user's profile.
      - name: zstd
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE '.cache\agentplaza-ci\zstd-1.5.7'
          if (-not (Test-Path (Join-Path $dir 'zstd.exe'))) {
            $zip = Join-Path $env:RUNNER_TEMP 'zstd.zip'
            Invoke-WebRequest https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip -OutFile $zip
            $tmp = Join-Path $env:RUNNER_TEMP 'zstd'
            Expand-Archive $zip -DestinationPath $tmp -Force
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item (Join-Path $tmp 'zstd-v1.5.7-win64\zstd.exe') $dir
          }
          Add-Content $env:GITHUB_PATH $dir
          & (Join-Path $dir 'zstd.exe') --version
      # The runner's user is not an administrator: everything lives in its profile, the build
      # directory (kept between runs) and .NET (for WiX) included.
      - name: The runner's build directory and .NET
        run: |
          home=$(cygpath -m "$USERPROFILE")
          echo "CARGO_TARGET_DIR=$home/.cache/agentplaza-ci/target" >> "$GITHUB_ENV"
          echo "DOTNET_INSTALL_DIR=$home/.dotnet" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ env.TRIPLE }}" }
      - uses: taiki-e/install-action@v2
        with: { tool: nextest }
      - name: Test (the guest harness runs only inside Linux VMs)
        if: matrix.arch == 'x64'
        run: cargo nextest run --workspace --exclude agent-harness --locked --cargo-profile release --profile ci --target ${{ env.TRIPLE }}
      - name: Build the tests (arm64 cannot run here)
        if: matrix.arch != 'x64'
        # cargo test, not nextest: nextest lists the tests by running the binaries, which x64 cannot.
        run: cargo test --workspace --exclude agent-harness --locked --profile release --target ${{ env.TRIPLE }} --no-run
      - name: Build the binaries
        if: inputs.package
        run: cargo build --release --locked --target ${{ env.TRIPLE }} ${{ env.BINS }}
      - name: The guest (cached by guest.yml; built on Linux)
        if: inputs.package && env.GARCH != ''
        uses: actions/cache/restore@v4
        with:
          path: target/guest/${{ env.GARCH }}
          key: "guest-${{ env.GARCH }}-${{ hashFiles('scripts/mk-guest.sh','scripts/mk-guest-kernel.sh','scripts/mk-initrd.sh','scripts/guest/**','crates/agent-harness/**','Cargo.lock') }}"
          enableCrossOsArchive: true
      - name: Stage
        if: inputs.package
        env:
          # A hand-run package (no release job built the guest) may go without it.
          APZ_ALLOW_NO_GUEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: packaging/scripts/stage.sh ${{ env.TRIPLE }} "$CARGO_TARGET_DIR/${{ env.TRIPLE }}/release" stage "$VERSION"
      - uses: actions/setup-dotnet@v4
        if: inputs.package
        with: { dotnet-version: 8.0.x }
      - name: Package
        if: inputs.package
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: packaging/windows/build.ps1 -Stage stage -Version $env:VERSION -Arch ${{ matrix.arch }} -Out out-windows-${{ matrix.arch }}
      # The runner's account cannot reach the Windows Installer service (no install, not even an
      # administrative one), so: the zip (the same staged files as the MSI) is unpacked and what it
      # holds must run, and the MSI's own File table (read in-process, no service) must list them.
      - name: Verify the zip and the MSI (x64)
        if: inputs.package && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $out = 'out-windows-${{ matrix.arch }}'
          $dir = Join-Path $env:RUNNER_TEMP 'zip-unpacked'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          Expand-Archive (Get-ChildItem $out -Filter *.zip).FullName -DestinationPath $dir
          $bins = 'apid', 'apz-link', 'agentplaza', 'agentplaza-desktop', 'noded', 'vsockd', 'vmctl'
          foreach ($b in $bins) {
            & (Join-Path $dir "bin\$b.exe") --version; if ($LASTEXITCODE) { throw "$b failed" }
          }
          $want = @('share\agentplaza\console\index.html')
          if ('${{ github.event_name }}' -ne 'workflow_dispatch') {
            $want += 'share\agentplaza\guest\x86_64\vmlinux', 'share\agentplaza\guest\x86_64\initrd.gz'
          }
          foreach ($f in $want) { if (-not (Test-Path (Join-Path $dir $f))) { throw "the zip has no $f" } }

          $msi = (Get-ChildItem $out -Filter *.msi).FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @('SELECT `FileName` FROM `File`'))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $names = @()
          while ($rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)) {
            # FileName is "short|long" when a short name exists.
            $names += ($rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, 1) -split '\|')[-1]
          }
          "the MSI carries $($names.Count) files"
          $need = ($bins | ForEach-Object { "$_.exe" }) + 'index.html'
          if ('${{ github.event_name }}' -ne 'workflow_dispatch') { $need += 'vmlinux', 'initrd.gz' }
          foreach ($n in $need) { if ($names -notcontains $n) { throw "the MSI has no $n" } }
      # Handed to release.yml's publish job through the cache (no artifact storage).
      - uses: actions/cache/save@v4
        if: inputs.package
        with: { path: "out-windows-${{ matrix.arch }}", key: "pkg-windows-${{ matrix.arch }}-${{ github.run_id }}", enableCrossOsArchive: true }
