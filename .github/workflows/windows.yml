# Windows (x64, arm64): one job per architecture tests and, with `package`, builds an MSI and a zip
# from the same optimised build, then installs the MSI and runs what it installed. The x64 package
# carries the VM node (the Windows Hypervisor Platform backend) and the x86_64 guest.
# Callers: pr.yml tests pull requests and merge-queue entries that touch platform code,
# release.yml packages main without testing again (`tests: false`: the queue tested that commit),
# nightly.yml tests. It also runs by hand.
# Where: the org's self-hosted Windows runner (x64). arm64 is cross-compiled there: its tests are
# built, not run, and its MSI is not installed. That needs LLVM (ring builds its arm64 code with
# clang) and Visual Studio's "MSVC v143 ARM64 build tools" on the runner, so the arm64 leg runs
# only when the repository variable APZ_WINDOWS_ARM64 is `on`; without it a release ships x64. Speed: cargo's build directory persists on the
# runner (only changed crates compile), one release build for tests and packages, nextest; the checkout keeps the mtimes
# this runner last built with (.github/ci/build-cache.py) and a pull request tests only what it changes (`only`).
name: Windows
run-name: "${{ format('Windows by hand: {0}', inputs.package && 'package' || 'test') }}"

on:
  workflow_dispatch:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }
      tests: { type: boolean, default: true }
      trusted: { type: boolean, default: true }
      # Packages (space-separated) whose tests run, with those of every package that depends on
      # them; empty: all.
      only: { type: string, default: "" }
      # Build and link the tests of the architecture this runner cannot run; false only checks that
      # they compile (cargo check: no code generated, nothing linked). pr.yml passes false for a
      # pull request; the merge queue, nightly and releases build them in full.
      link: { type: boolean, default: true }
  workflow_call:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }
      tests: { type: boolean, default: true }
      trusted: { type: boolean, default: true }
      # Packages (space-separated) whose tests run, with those of every package that depends on
      # them; empty: all.
      only: { type: string, default: "" }
      # Build and link the tests of the architecture this runner cannot run; false only checks that
      # they compile (cargo check: no code generated, nothing linked). pr.yml passes false for a
      # pull request; the merge queue, nightly and releases build them in full.
      link: { type: boolean, default: true }
    # Read by the Package step; the callers pass them by name (release.yml).
    secrets:
      WINDOWS_CERT_PFX_BASE64: { required: false }
      WINDOWS_CERT_PASSWORD: { required: false }

concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Not incremental: the packages' release build. The tests' `checked` profile is (Cargo.toml), so
  # their steps set 1.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  # Not the runner fleet's sccache (its RUSTC_WRAPPER): its server died mid-build ("compiling locally
  # instead"), and the build directory kept on the runner already keeps unchanged crates built.
  RUSTC_WRAPPER: ""
  # Visual Studio's link.exe, not rust-lld: binaries linked by rust-lld crash with an access violation
  # in wasmtime as soon as Weft loads a tree-sitter language pack (zed-industries/zed#38460).
  VERSION: ${{ inputs.version || '0.0.0-ci' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ inputs.package && (inputs.tests && 'Test and package' || 'Package') || 'Test' }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(vars.APZ_WINDOWS_ARM64 == 'on' && '["x64","arm64"]' || '["x64"]') }}
    # Per architecture: the target, the guest (x64 carries the VM node and the x86_64 guest),
    # whether its tests can run here, and the binaries it ships.
    env:
      TRIPLE: ${{ matrix.arch == 'x64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}
      GARCH: ${{ matrix.arch == 'x64' && 'x86_64' || '' }}
      BINS: >-
        -p apid -p apz-link -p agentplaza-cli -p agentplaza-desktop
        ${{ matrix.arch == 'x64' && '-p noded -p vsockd -p vmctl' || '' }}
    runs-on: [self-hosted, Windows, X64, hetzner]
    # A cold build directory compiles everything once on the runner's 4 cores; after that a run
    # rebuilds only what changed. A hung test is killed by nextest after 2 minutes.
    timeout-minutes: 90
    steps:
      # Check out with LF line endings, as on Linux: hashFiles() then gives the guest the same
      # cache key guest.yml saved it under, and the shell scripts run as written.
      # The fleet may set its wrapper for the job (GITHUB_ENV, which outranks env above): unset it here too.
      - name: No fleet sccache
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      # cmake on PATH: tree-sitter's wasm runtime (wasmtime's C API, weft's language packs) builds with it.
      # The runner's own if there, else Kitware's release, checked and kept in the runner's cache.
      - name: cmake
        run: .github/ci/cmake.sh
      # zstd on PATH: the Actions cache keys an entry by its compression too, and the Linux jobs
      # save theirs (the guest) with zstd; without it here they are not found, and what this job
      # saves is not found on Linux. Kept in the runner user's profile.
      - name: zstd
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE '.cache\agentplaza-ci\zstd-1.5.7'
          if (-not (Test-Path (Join-Path $dir 'zstd.exe'))) {
            $zip = Join-Path $env:RUNNER_TEMP 'zstd.zip'
            Invoke-WebRequest https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip -OutFile $zip
            $tmp = Join-Path $env:RUNNER_TEMP 'zstd'
            Expand-Archive $zip -DestinationPath $tmp -Force
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item (Join-Path $tmp 'zstd-v1.5.7-win64\zstd.exe') $dir
          }
          Add-Content $env:GITHUB_PATH $dir
          & (Join-Path $dir 'zstd.exe') --version
      # The runner's user is not an administrator: everything lives in its profile, the build
      # directory (kept between runs) and .NET (for WiX) included.
      # A pull request from a fork builds in its own directory, never in the one releases use.
      - name: The runner's build directory and .NET
        run: |
          home=$(cygpath -m "$USERPROFILE")
          echo "CARGO_TARGET_DIR=$home/.cache/${{ inputs.trusted && 'agentplaza-ci' || 'agentplaza-ci-untrusted' }}/target" >> "$GITHUB_ENV"
          echo "DOTNET_INSTALL_DIR=$home/.dotnet" >> "$GITHUB_ENV"
      # Pinned like the Linux image's (.github/ci/Dockerfile RUST_VERSION): a new Rust is a deliberate
      # change, not a full rebuild on the day it ships.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: "1.99.0", components: clippy, targets: "${{ env.TRIPLE }}" }
      # Fresh clone, old mtimes: unchanged crates stay built (.github/ci/build-cache.py).
      - name: Keep the build directory fresh
        run: |
          py=python3; $py -c '' 2>/dev/null || py=python
          $py .github/ci/build-cache.py mtimes "$(dirname "$CARGO_TARGET_DIR")"
      - name: Clippy for the shipped target
        if: inputs.tests
        run: cargo clippy --workspace --exclude agent-harness --all-targets --locked --target ${{ env.TRIPLE }} -- -D warnings
      - name: Which tests
        if: inputs.tests && inputs.only != ''
        env: { ONLY: "${{ inputs.only }}" }
        run: |
          filter=""
          for p in $ONLY; do filter="${filter:+$filter | }rdeps(=$p)"; done
          echo "the tests of $ONLY and of what depends on them: $filter"
          echo "NEXTEST_FILTER=$filter" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        if: inputs.tests
        with: { tool: nextest }
      # A report from an earlier run must not pass for this one's.
      - name: Clear the last test report
        if: inputs.tests
        run: rm -f target/nextest/ci/junit.xml
      - name: Test (the guest harness runs only inside Linux VMs)
        id: test
        if: matrix.arch == 'x64' && inputs.tests
        run: CARGO_INCREMENTAL=1 bash .github/ci/incremental-retry.sh ${{ env.TRIPLE }} cargo nextest run --workspace --exclude agent-harness --locked --cargo-profile checked --profile ci --target ${{ env.TRIPLE }} ${NEXTEST_FILTER:+-E "$NEXTEST_FILTER" --no-tests=warn}
      - name: Build the tests (arm64 cannot run here)
        id: build_tests
        if: matrix.arch != 'x64' && inputs.tests
        # cargo test, not nextest: nextest lists the tests by running the binaries, which x64 cannot.
        run: |
          if [ "${{ inputs.link }}" = true ]; then
            CARGO_INCREMENTAL=1 bash .github/ci/incremental-retry.sh ${{ env.TRIPLE }} cargo test --workspace --exclude agent-harness --locked --profile checked --target ${{ env.TRIPLE }} --no-run
          else
            CARGO_INCREMENTAL=1 bash .github/ci/incremental-retry.sh ${{ env.TRIPLE }} cargo check --workspace --exclude agent-harness --locked --profile checked --target ${{ env.TRIPLE }} --all-targets
          fi
      # The pull request's Tests comment (check-results.yml) is made from these.
      - name: Results for the pull request
        if: always() && inputs.tests
        env:
          ARCH: "${{ matrix.arch }}"
          TEST_OUTCOME: "${{ steps.test.outcome }}"
          BUILD_OUTCOME: "${{ steps.build_tests.outcome }}"
        run: |
          py=python3; $py -c '' 2>/dev/null || py=python
          if [ "$ARCH" = x64 ]; then
            $py .github/ci/results.py results tests "Windows x64" --junit target/nextest/ci/junit.xml --part "tests=$TEST_OUTCOME"
          else
            $py .github/ci/results.py results tests "Windows arm64" --part "Windows arm64: build only (cannot run here)=$BUILD_OUTCOME"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && inputs.tests
        with: { name: "results-windows-${{ matrix.arch }}", path: results, retention-days: 7 }
      - name: Build the binaries
        if: inputs.package
        run: cargo build --release --locked --target ${{ env.TRIPLE }} ${{ env.BINS }}
      - name: The guest (cached by guest.yml; built on Linux)
        if: inputs.package && env.GARCH != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/guest/${{ env.GARCH }}
          key: "guest-${{ env.GARCH }}-${{ hashFiles('scripts/mk-guest.sh','scripts/mk-guest-kernel.sh','scripts/mk-initrd.sh','scripts/guest/**','crates/**','Cargo.toml','Cargo.lock','.cargo/**','.github/ci/Dockerfile') }}"
          enableCrossOsArchive: true
      - name: The relay binaries (both architectures, from the relay job)
        if: inputs.package
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with: { path: relay, key: "mcp-relay-x86_64-aarch64-${{ github.sha }}", fail-on-cache-miss: true, enableCrossOsArchive: true }
      - name: The web console (from the console job)
        if: inputs.package
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with: { path: apps/web/dist, key: "console-${{ github.sha }}", fail-on-cache-miss: true, enableCrossOsArchive: true }
      - name: Stage
        if: inputs.package
        env:
          APZ_RELAY_DIR: relay
          # A hand-run package (no release job built the guest) may go without it.
          APZ_ALLOW_NO_GUEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: packaging/scripts/stage.sh ${{ env.TRIPLE }} "$CARGO_TARGET_DIR/${{ env.TRIPLE }}/release" stage "$VERSION"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: inputs.package
        with: { dotnet-version: 8.0.x }
      - name: Package
        if: inputs.package
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: packaging/windows/build.ps1 -Stage stage -Version $env:VERSION -Arch $env:ARCH -Out "out-windows-$env:ARCH"
      # The runner's account cannot reach the Windows Installer service (no install, not even an
      # administrative one), so: the zip (the same staged files as the MSI) is unpacked and what it
      # holds must run, and the MSI's own File table (read in-process, no service) must list them.
      - name: Verify the zip and the MSI (x64)
        if: inputs.package && matrix.arch == 'x64'
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $out = "out-windows-$env:ARCH"
          $dir = Join-Path $env:RUNNER_TEMP 'zip-unpacked'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          Expand-Archive (Get-ChildItem $out -Filter *.zip).FullName -DestinationPath $dir
          $bins = 'apid', 'apz-link', 'agentplaza', 'agentplaza-desktop', 'noded', 'vsockd', 'vmctl'
          foreach ($b in $bins) {
            & (Join-Path $dir "bin\$b.exe") --version; if ($LASTEXITCODE) { throw "$b failed" }
          }
          $want = @('share\agentplaza\console\index.html')
          if ($env:EVENT_NAME -ne 'workflow_dispatch') {
            $want += 'share\agentplaza\guest\x86_64\vmlinux', 'share\agentplaza\guest\x86_64\initrd.gz'
          }
          foreach ($f in $want) { if (-not (Test-Path (Join-Path $dir $f))) { throw "the zip has no $f" } }

          $msi = (Get-ChildItem $out -Filter *.msi).FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @('SELECT `FileName` FROM `File`'))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $names = @()
          while ($rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)) {
            # FileName is "short|long" when a short name exists.
            $names += ($rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, 1) -split '\|')[-1]
          }
          "the MSI carries $($names.Count) files"
          $need = ($bins | ForEach-Object { "$_.exe" }) + 'index.html'
          if ($env:EVENT_NAME -ne 'workflow_dispatch') { $need += 'vmlinux', 'initrd.gz' }
          foreach ($n in $need) { if ($names -notcontains $n) { throw "the MSI has no $n" } }
      # Handed to release.yml's publish job through the cache (no artifact storage).
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: inputs.package
        with: { path: "out-windows-${{ matrix.arch }}", key: "pkg-windows-${{ matrix.arch }}-${{ github.run_id }}", enableCrossOsArchive: true }
      # Units no build has used for days go first; the directory is emptied only if the disk is short.
      - name: Prune the build directory
        if: always()
        run: |
          [ -f .github/ci/build-cache.py ] || exit 0  # the job ended before its checkout
          py=python3; $py -c '' 2>/dev/null || py=python
          $py .github/ci/build-cache.py prune "$CARGO_TARGET_DIR"
