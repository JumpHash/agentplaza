# macOS: one job on the org's self-hosted Mac (Intel) tests the Intel build natively, builds the
# Apple Silicon one alongside it (cross-compiled; its tests are built, not run) and, with `package`,
# makes a DMG for each: AgentPlaza-<v>-macos-x86_64.dmg and AgentPlaza-<v>-macos-arm64.dmg.
# Callers: pr.yml tests pull requests and merge-queue entries that touch platform code,
# release.yml packages main without testing again (`tests: false`: the queue tested that commit),
# nightly.yml tests. It also runs by hand.
#
# The VM node (vmm, vsockd, noded) is tested on Apple Silicon by two more jobs at the end: a hosted arm64 Mac, where the
# hypervisor tests skip, and the self-hosted Apple Silicon runner MACOS_ARM_RUNNER names, where they run.
# The runner's labels come from the repository variable MACOS_RUNNER (a JSON list; default
# ["self-hosted","macOS","X64"]); APZ_MACOS=off skips macOS, and a release then ships without it.
# Speed: cargo's build directory persists on the runner (only changed crates compile), one release
# build per architecture for tests and packages, nextest; the checkout keeps the mtimes this runner
# last built with (.github/ci/build-cache.py) and a pull request tests only what it changes (`only`).
name: macOS
run-name: "${{ format('macOS by hand: {0}', inputs.package && 'package' || 'test') }}"

on:
  workflow_dispatch:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }
      tests: { type: boolean, default: true }
      trusted: { type: boolean, default: true }
      # Packages (space-separated) whose tests run, with those of every package that depends on
      # them; empty: all.
      only: { type: string, default: "" }
      # Build and link the tests of the architecture this runner cannot run; false only checks that
      # they compile (cargo check: no code generated, nothing linked). pr.yml passes false for a
      # pull request; the merge queue, nightly and releases build them in full.
      link: { type: boolean, default: true }
  workflow_call:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }
      tests: { type: boolean, default: true }
      trusted: { type: boolean, default: true }
      # Packages (space-separated) whose tests run, with those of every package that depends on
      # them; empty: all.
      only: { type: string, default: "" }
      # Build and link the tests of the architecture this runner cannot run; false only checks that
      # they compile (cargo check: no code generated, nothing linked). pr.yml passes false for a
      # pull request; the merge queue, nightly and releases build them in full.
      link: { type: boolean, default: true }
    # Read by the Stage and package step; the callers pass them by name (release.yml).
    secrets:
      APPLE_SIGNING_IDENTITY: { required: false }
      APPLE_NOTARY_PROFILE: { required: false }

concurrency:
  group: ${{ github.workflow }}-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Not incremental, for the tests either (their `checked` profile is in Cargo.toml): on the Intel Mac an incremental
  # optimised build of apid fails to link (undefined `….llvm.<n>` symbols), even from an empty incremental cache.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  # Not the runner fleet's sccache (its RUSTC_WRAPPER): its server died mid-build ("compiling locally
  # instead"), and the build directory kept on the runner already keeps unchanged crates built.
  RUSTC_WRAPPER: ""
  # The oldest macOS the app supports (Info.plist's LSMinimumSystemVersion): C code and Rust agree.
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  VERSION: ${{ inputs.version || '0.0.0-ci' }}
  # Apple Silicon carries the VM node (Hypervisor.framework) and the aarch64 guest; Intel Macs run
  # the hub and the desktop app and use nodes elsewhere.
  ARM_BINS: "-p apid -p apz-link -p agentplaza-cli -p agentplaza-desktop -p noded -p vsockd -p vmm -p vmctl"
  X86_BINS: "-p apid -p apz-link -p agentplaza-cli -p agentplaza-desktop"

jobs:
  build:
    name: ${{ inputs.package && (inputs.tests && 'Test and package' || 'Package') || 'Test' }}
    if: vars.APZ_MACOS != 'off'
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","macOS","X64"]') }}
    # A cold build directory compiles everything once; after that a run rebuilds only what changed.
    # A hung test is killed by nextest after 2 minutes.
    timeout-minutes: 90
    steps:
      # The fleet may set its wrapper for the job (GITHUB_ENV, which outranks env above): unset it here too.
      - name: No fleet sccache
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # cmake on PATH: tree-sitter's wasm runtime (wasmtime's C API, weft's language packs) builds with it.
      # The runner's own if there, else Kitware's release, checked and kept in the runner's cache.
      - name: cmake
        run: .github/ci/cmake.sh
      # zstd on PATH: the Actions cache keys an entry by its compression too, and the Linux jobs
      # save theirs (the aarch64 guest) with zstd; without it here they are not found, and what
      # this job saves is not found on Linux. Homebrew's if there, else built once into the cache.
      - name: zstd
        run: |
          if ! command -v zstd >/dev/null; then
            dir=$HOME/.cache/agentplaza-ci/zstd-1.5.7
            if [ ! -x "$dir/zstd" ]; then
              tmp=$(mktemp -d)
              curl -fsSL https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz | tar -xz -C "$tmp"
              make -s -C "$tmp/zstd-1.5.7/programs" zstd -j"$(sysctl -n hw.ncpu)"
              mkdir -p "$dir" && cp "$tmp/zstd-1.5.7/programs/zstd" "$dir/"
              rm -rf "$tmp"
            fi
            # The cache packs with `tar --use-compress-program zstdmt` and unpacks with `unzstd`:
            # zstd answers to both names.
            ln -sf zstd "$dir/unzstd"
            ln -sf zstd "$dir/zstdmt"
            echo "$dir" >> "$GITHUB_PATH"
            "$dir/zstd" --version
          else
            zstd --version
          fi
      # A pull request from a fork builds in its own directory, never in the one releases use.
      - name: The runner's build directory
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/${{ inputs.trusted && 'agentplaza-ci' || 'agentplaza-ci-untrusted' }}/target" >> "$GITHUB_ENV"
      # Pinned like the Linux image's (.github/ci/Dockerfile RUST_VERSION): a new Rust is a deliberate
      # change, not a full rebuild on the day it ships.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: "1.99.0", components: clippy, targets: "x86_64-apple-darwin,aarch64-apple-darwin" }
      # Fresh clone, old mtimes: unchanged crates stay built (.github/ci/build-cache.py).
      - name: Keep the build directory fresh
        run: |
          py=python3; $py -c '' 2>/dev/null || py=python
          $py .github/ci/build-cache.py mtimes "$(dirname "$CARGO_TARGET_DIR")"
      - name: Clippy for both shipped targets
        if: inputs.tests
        run: |
          cargo clippy --workspace --exclude agent-harness --all-targets --locked --target x86_64-apple-darwin -- -D warnings
          cargo clippy --workspace --exclude agent-harness --all-targets --locked --target aarch64-apple-darwin -- -D warnings
      - name: Which tests
        if: inputs.tests && inputs.only != ''
        env: { ONLY: "${{ inputs.only }}" }
        run: |
          filter=""
          for p in $ONLY; do filter="${filter:+$filter | }rdeps(=$p)"; done
          echo "the tests of $ONLY and of what depends on them: $filter"
          echo "NEXTEST_FILTER=$filter" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        if: inputs.tests
        with: { tool: nextest }
      # A report from an earlier run must not pass for this one's.
      - name: Clear the last test report
        if: inputs.tests
        run: rm -f target/nextest/ci/junit.xml
      - name: Test (Intel; the guest harness runs only inside Linux VMs)
        id: test
        if: inputs.tests
        run: cargo nextest run --workspace --exclude agent-harness --locked --cargo-profile checked --profile ci --target x86_64-apple-darwin ${NEXTEST_FILTER:+-E "$NEXTEST_FILTER" --no-tests=warn}
      - name: Build the tests (Apple Silicon cannot run here)
        id: build_tests
        if: inputs.tests
        # cargo test, not nextest: nextest lists the tests by running the binaries, which an Intel Mac cannot.
        run: |
          if [ "${{ inputs.link }}" = true ]; then
            cargo test --workspace --exclude agent-harness --locked --profile checked --target aarch64-apple-darwin --no-run
          else
            cargo check --workspace --exclude agent-harness --locked --profile checked --target aarch64-apple-darwin --all-targets
          fi
      # The pull request's Tests comment (check-results.yml) is made from these.
      - name: Results for the pull request
        if: always() && inputs.tests
        run: |
          py=python3; $py -c '' 2>/dev/null || py=python
          $py .github/ci/results.py results tests "macOS Intel" --junit target/nextest/ci/junit.xml \
            --part "tests=${{ steps.test.outcome }}" \
            --part "macOS Apple Silicon: build only (cannot run here)=${{ steps.build_tests.outcome }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.tests
        with: { name: results-macos, path: results, retention-days: 7 }
      # Packaged binaries leave out their symbol tables; the test builds keep theirs.
      - name: Build the binaries
        if: inputs.package
        env: { CARGO_PROFILE_RELEASE_STRIP: symbols }
        run: |
          cargo build --release --locked --target x86_64-apple-darwin $X86_BINS
          cargo build --release --locked --target aarch64-apple-darwin $ARM_BINS
      # The key guest.yml saved it under (.github/ci/guest-key.sh): git's content ids, which a build does not change.
      - name: The aarch64 guest's cache key
        if: inputs.package
        id: guest-key
        run: echo "key=$(sh .github/ci/guest-key.sh aarch64)" >> "$GITHUB_OUTPUT"
      - name: The aarch64 guest (cached by guest.yml; built on Linux)
        if: inputs.package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/guest/aarch64
          key: ${{ steps.guest-key.outputs.key }}
          enableCrossOsArchive: true
      - name: The web console (from the console job)
        if: inputs.package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: apps/web/dist, key: "console-${{ github.sha }}", fail-on-cache-miss: true, enableCrossOsArchive: true }
      - name: Stage and package
        if: inputs.package
        env:
          # A hand run (guest.yml did not fill the cache) may go without the guest.
          APZ_ALLOW_NO_GUEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: |
          rm -rf stage-* out-macos
          packaging/scripts/stage.sh x86_64-apple-darwin "$CARGO_TARGET_DIR/x86_64-apple-darwin/release" stage-x86_64 "$VERSION"
          packaging/scripts/stage.sh aarch64-apple-darwin "$CARGO_TARGET_DIR/aarch64-apple-darwin/release" stage-arm64 "$VERSION"
          packaging/macos/build-dmg.sh stage-x86_64 x86_64 "$VERSION" out-macos
          packaging/macos/build-dmg.sh stage-arm64 arm64 "$VERSION" out-macos
      - name: Verify the DMGs
        if: inputs.package
        run: |
          for arch in x86_64 arm64; do
            mnt=$(mktemp -d)
            hdiutil attach "out-macos/AgentPlaza-$VERSION-macos-$arch.dmg" -mountpoint "$mnt" -nobrowse
            app=$mnt/AgentPlaza.app/Contents
            test "$(lipo -archs "$app/MacOS/agentplaza-desktop")" = "$arch"
            test -f "$app/Resources/share/agentplaza/console/index.html"
            if [ $arch = x86_64 ]; then
              for b in apid apz-link agentplaza agentplaza-desktop; do "$app/MacOS/$b" --version; done
            else
              codesign -d --entitlements - "$app/MacOS/apz-vmm"
              if [ "${{ github.event_name }}" != workflow_dispatch ]; then
                test -s "$app/Resources/share/agentplaza/guest/aarch64/vmlinux"
                test -s "$app/Resources/share/agentplaza/guest/aarch64/initrd.gz"
              fi
            fi
            hdiutil detach "$mnt"
          done
      # Handed to release.yml's publish job through the cache.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.package
        with: { path: out-macos, key: "pkg-macos-${{ github.run_id }}" }
      # Units no build has used for days go first; the directory is emptied only if the disk is short.
      - name: Prune the build directory
        if: always()
        run: |
          [ -f .github/ci/build-cache.py ] || exit 0  # the job ended before its checkout
          py=python3; $py -c '' 2>/dev/null || py=python
          $py .github/ci/build-cache.py prune "$CARGO_TARGET_DIR"

  # The VM node on Apple Silicon: the vmm (Hypervisor.framework), vsockd and noded tests. The hosted
  # arm64 Mac runs all of them, and the hypervisor tests skip there with the reason: GitHub's hosted
  # macOS runners have no nested virtualization, so no VM starts on them. The self-hosted Apple
  # Silicon runner (the repository variable MACOS_ARM_RUNNER, a JSON label list) runs the same tests
  # under the hypervisor runner: scripts/hvf-run.sh signs each test binary ad hoc with the hypervisor
  # entitlement, and the guest (target/guest/aarch64, cached by guest.yml) boots in them. Without that
  # variable the self-hosted job is not queued.
  node-hosted:
    name: "VM node (Apple Silicon, hosted: the hypervisor tests skip)"
    if: vars.APZ_MACOS != 'off' && inputs.tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: "1.99.0" }
      - name: "Test the VM node (no runner: the hypervisor tests say why and pass)"
        run: cargo test -p vmm -p vsockd -p noded --locked

  node-self-hosted:
    name: "VM node (Apple Silicon, self-hosted: the hypervisor tests run)"
    if: vars.APZ_MACOS != 'off' && inputs.tests && vars.MACOS_ARM_RUNNER != ''
    runs-on: ${{ fromJSON(vars.MACOS_ARM_RUNNER) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: The runner's build directory
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/agentplaza-ci-arm/target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: "1.99.0" }
      - name: The aarch64 guest's cache key
        id: guest-key
        run: echo "key=$(sh .github/ci/guest-key.sh aarch64)" >> "$GITHUB_OUTPUT"
      - name: "The aarch64 guest (cached by guest.yml; the guest tests skip without it)"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/guest/aarch64
          key: ${{ steps.guest-key.outputs.key }}
          enableCrossOsArchive: true
      - name: Test the VM node under the hypervisor runner
        env:
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER: ${{ github.workspace }}/scripts/hvf-run.sh
        run: cargo test -p vmm -p vsockd -p noded --locked
