# macOS (Apple Silicon, Intel): tests, and with `package` one universal DMG (arm64 + x86_64).
# Pull requests run the tests; release.yml calls this with `package: true` on every push to main.
name: macos

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version: { type: string, default: "" }
      package: { type: boolean, default: false }

concurrency:
  group: ${{ github.workflow }}-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  FAST_DEPS: --config profile.dev.package."*".opt-level=0 --config profile.dev.package.agentplaza-desktop.opt-level=0
  # The oldest macOS the app supports (Info.plist's LSMinimumSystemVersion): C code and Rust agree.
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Apple Silicon, runner: macos-15 }
          - { name: Intel, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    env:
      APZ_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with: { cache-targets: "false" }
      - name: Test (workspace; the guest harness runs only inside Linux VMs)
        run: cargo test --workspace --exclude agent-harness --locked $FAST_DEPS

  package:
    name: package (universal DMG)
    if: inputs.package
    needs: test
    runs-on: macos-15
    env:
      APZ_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Build (release, Apple Silicon: hub, desktop and the VM node)"
        run: cargo build --release --locked --target aarch64-apple-darwin -p apid -p apz-link -p agentplaza-cli -p agentplaza-desktop -p noded -p vsockd -p vmm -p vmctl
      - name: "Build (release, Intel: hub and desktop)"
        run: cargo build --release --locked --target x86_64-apple-darwin -p apid -p apz-link -p agentplaza-cli -p agentplaza-desktop
      - uses: actions/download-artifact@v4
        with: { pattern: "guest-*", path: target/guest, merge-multiple: false }
      - name: Stage and package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: |
          for d in target/guest/guest-*; do mv "$d" "target/guest/${d##*guest-}"; done
          packaging/scripts/stage.sh aarch64-apple-darwin target/aarch64-apple-darwin/release stage-arm64 "$APZ_VERSION"
          packaging/scripts/stage.sh x86_64-apple-darwin target/x86_64-apple-darwin/release stage-x86_64 "$APZ_VERSION"
          packaging/macos/build-dmg.sh stage-arm64 stage-x86_64 "$APZ_VERSION" out
      - name: Verify the bundle
        run: |
          hdiutil attach out/*.dmg -mountpoint /tmp/apz -nobrowse
          for b in apid apz-link agentplaza agentplaza-desktop noded; do /tmp/apz/AgentPlaza.app/Contents/MacOS/$b --version; done
          lipo -archs /tmp/apz/AgentPlaza.app/Contents/MacOS/agentplaza-desktop
          codesign -d --entitlements - /tmp/apz/AgentPlaza.app/Contents/MacOS/apz-vmm
          test -s /tmp/apz/AgentPlaza.app/Contents/Resources/share/agentplaza/guest/aarch64/vmlinux
          test -s /tmp/apz/AgentPlaza.app/Contents/Resources/share/agentplaza/guest/aarch64/initrd.gz
          hdiutil detach /tmp/apz
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: out/*.dmg
          if-no-files-found: error
