# The release pipeline: every push to main is a release. It picks the next semantic version
# (packaging/scripts/next-version.sh), runs the four platform workflows with packaging on (their
# tests gate everything), and publishes GitHub Release v<version> — the tag, the changelog and
# every deliverable (packaging/README.md lists them) with SHA256SUMS.
name: release

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto: from the commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time, in push order; a newer push waits rather than cancelling a release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# The release's critical path: guest (seconds on a cache hit) → the platform jobs (test and
# package in one build each, in parallel) → publish.
jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: next
        env:
          FORCE_BUMP: ${{ (inputs.bump && inputs.bump != 'auto') && inputs.bump || '' }}
        run: packaging/scripts/next-version.sh

  guest:
    uses: ./.github/workflows/guest.yml
  linux:
    needs: [version, guest]
    uses: ./.github/workflows/linux.yml
    with: { version: "${{ needs.version.outputs.version }}", package: true }
    secrets: inherit
  macos:
    needs: [version, guest]
    uses: ./.github/workflows/macos.yml
    with: { version: "${{ needs.version.outputs.version }}", package: true }
    secrets: inherit
  windows:
    needs: [version, guest]
    uses: ./.github/workflows/windows.yml
    with: { version: "${{ needs.version.outputs.version }}", package: true }
    secrets: inherit
  # Made from the Linux arm64 build.
  raspberry-pi:
    needs: [version, linux]
    uses: ./.github/workflows/raspberry-pi.yml
    with: { version: "${{ needs.version.outputs.version }}", package: true }
    secrets: inherit

  web:
    name: web console
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci && npm run build && npm test
        working-directory: apps/web

  publish:
    needs: [version, linux, macos, windows, raspberry-pi, web]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # The platform jobs leave their packages in the cache under this run's id (no artifact storage).
      - uses: actions/cache/restore@v4
        with: { path: out-linux-x86_64, key: "pkg-linux-x86_64-${{ github.run_id }}", fail-on-cache-miss: true }
      - uses: actions/cache/restore@v4
        with: { path: out-linux-aarch64, key: "pkg-linux-aarch64-${{ github.run_id }}", fail-on-cache-miss: true }
      - uses: actions/cache/restore@v4
        with: { path: out-raspberrypi, key: "pkg-raspberrypi-${{ github.run_id }}", fail-on-cache-miss: true }
      - uses: actions/cache/restore@v4
        with: { path: out-macos, key: "pkg-macos-${{ github.run_id }}", fail-on-cache-miss: true }
      - uses: actions/cache/restore@v4
        with: { path: out-windows-x64, key: "pkg-windows-x64-${{ github.run_id }}", fail-on-cache-miss: true, enableCrossOsArchive: true }
      - uses: actions/cache/restore@v4
        with: { path: out-windows-arm64, key: "pkg-windows-arm64-${{ github.run_id }}", fail-on-cache-miss: true, enableCrossOsArchive: true }
      - name: Gather and checksum
        run: |
          mkdir dist
          cp out-*/* dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Changelog
        run: packaging/scripts/changelog.sh "$VERSION" "$PREVIOUS" "$GITHUB_REPOSITORY" > notes.md && cat notes.md
      - name: Publish v${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "AgentPlaza $VERSION" \
            --notes-file notes.md \
            --latest
      - name: Drop this run's handoff caches
        if: always()
        run: |
          for key in $(gh cache list --limit 100 --json key --jq '.[].key' | grep -E -- "-${{ github.run_id }}$"); do
            gh cache delete "$key" || true
          done
