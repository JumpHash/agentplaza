# The release pipeline: every push to main is a release. It picks the next version
# (packaging/scripts/next-version.sh: automatic, 0.0.9 → 0.1.0 … 0.9.9 → 1.0.0, unless a merged
# change raised the VERSION file or a manual run names one), runs the four platform workflows with
# packaging on (their tests gate everything), publishes GitHub Release v<version> — the tag, the
# changelog and every deliverable (packaging/README.md lists them) with SHA256SUMS — and writes the
# version back to main's VERSION file.
name: release

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version (x.y.z, above the last release); empty: the automatic one"
        type: string
        default: ""

# One release at a time, in push order; a newer push waits rather than cancelling a release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# The release's critical path: guest (seconds on a cache hit) → the platform jobs (test and
# package in one build each, in parallel across the org's self-hosted Linux, Windows and Mac
# runners) → publish. macOS may be switched off (APZ_MACOS=off), and Windows arm64 is on only with
# APZ_WINDOWS_ARM64=on (its runner needs LLVM and the VS ARM64 tools): a release ships without them.
jobs:
  version:
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 3
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
      source: ${{ steps.next.outputs.source }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: next
        env:
          OVERRIDE: ${{ inputs.version }}
        run: packaging/scripts/next-version.sh

  guest:
    uses: ./.github/workflows/guest.yml
  linux:
    needs: [version, guest]
    uses: ./.github/workflows/linux.yml
    with: { version: "${{ needs.version.outputs.version }}", package: true }
    secrets: inherit
  macos:
    needs: [version, guest]
    uses: ./.github/workflows/macos.yml
    with: { version: "${{ needs.version.outputs.version }}", package: true }
    secrets: inherit
  windows:
    needs: [version, guest]
    uses: ./.github/workflows/windows.yml
    with: { version: "${{ needs.version.outputs.version }}", package: true }
    secrets: inherit
  # Made from the Linux arm64 build.
  raspberry-pi:
    needs: [version, linux]
    uses: ./.github/workflows/raspberry-pi.yml
    with: { version: "${{ needs.version.outputs.version }}", package: true }
    secrets: inherit

  web:
    name: web console
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: CI image
        run: .github/ci/image.sh
      - run: .github/ci/in-image.sh 'cd apps/web && npm ci && npm run build && npm test'

  publish:
    needs: [version, linux, macos, windows, raspberry-pi, web]
    # Every platform passed; macOS may also have been switched off.
    if: >-
      !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' &&
      needs.raspberry-pi.result == 'success' && needs.web.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      SOURCE: ${{ needs.version.outputs.source }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # The platform jobs leave their packages in the cache under this run's id (no artifact storage).
      - uses: actions/cache/restore@v4
        with: { path: out-linux-x86_64, key: "pkg-linux-x86_64-${{ github.run_id }}", fail-on-cache-miss: true }
      - uses: actions/cache/restore@v4
        with: { path: out-linux-aarch64, key: "pkg-linux-aarch64-${{ github.run_id }}", fail-on-cache-miss: true }
      - uses: actions/cache/restore@v4
        with: { path: out-raspberrypi, key: "pkg-raspberrypi-${{ github.run_id }}", fail-on-cache-miss: true }
      - uses: actions/cache/restore@v4
        if: needs.macos.result == 'success'
        with: { path: out-macos, key: "pkg-macos-${{ github.run_id }}", fail-on-cache-miss: true }
      - uses: actions/cache/restore@v4
        with: { path: out-windows-x64, key: "pkg-windows-x64-${{ github.run_id }}", fail-on-cache-miss: true, enableCrossOsArchive: true }
      - uses: actions/cache/restore@v4
        if: vars.APZ_WINDOWS_ARM64 == 'on'
        with: { path: out-windows-arm64, key: "pkg-windows-arm64-${{ github.run_id }}", fail-on-cache-miss: true, enableCrossOsArchive: true }
      - name: CI image
        run: .github/ci/image.sh
      - name: Gather and checksum
        run: |
          rm -rf dist && mkdir dist
          cp -- out-*/* dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Changelog
        # Download rows whose files this release does not have (macOS switched off) are dropped.
        run: |
          packaging/scripts/changelog.sh "$VERSION" "$PREVIOUS" "$GITHUB_REPOSITORY" "$SOURCE" | awk -v dir=dist '{
            keep = 1; s = $0
            while (match(s, /\/releases\/download\/v[^\/]*\/[^)]*\)/)) {
              f = substr(s, RSTART, RLENGTH - 1); sub(/.*\//, "", f)
              if (system("test -e \"" dir "/" f "\"") != 0) keep = 0
              s = substr(s, RSTART + RLENGTH)
            }
            if (keep) print
          }' > notes.md
          cat notes.md
      - name: Publish v${{ needs.version.outputs.version }}
        run: |
          .github/ci/in-image.sh 'gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "AgentPlaza $VERSION" \
            --notes-file notes.md \
            --latest'
      # The released version becomes main's VERSION (unless a later change already raised it), so
      # the next automatic release counts on from it. GITHUB_TOKEN's push starts no workflow.
      - name: Write v${{ needs.version.outputs.version }} back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B version origin/main
            current=$(tr -d '[:space:]' < VERSION 2>/dev/null || true)
            if [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" != "$VERSION" ] || [ "$current" = "$VERSION" ]; then
              echo "main's VERSION is $current: nothing to write"; break
            fi
            echo "$VERSION" > VERSION
            git commit -q -m "release: v$VERSION [skip ci]" -- VERSION
            git push -q origin HEAD:main && { echo "main's VERSION is now $VERSION"; break; }
            echo "main moved; trying again ($attempt)"; sleep 5
          done
      - name: Drop this run's handoff caches
        if: always()
        run: |
          .github/ci/in-image.sh 'for key in $(gh cache list --limit 100 --json key --jq ".[].key" | grep -E -- "-${{ github.run_id }}$"); do
            gh cache delete "$key" || true
          done'
