[package]
name = "agentplaza-desktop"
description = "AgentPlaza console: the native desktop app (iced + wgpu), at parity with the web console"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
apz-prompt = { path = "../../crates/apz-prompt" }
apz-skill = { path = "../../crates/apz-skill" }
# The IDE's shared model (workspaces, entries, buffers, the diff parser, path rules, the state reducer); the web runs it too.
apz-ide = { path = "../../crates/apz-ide" }
# The Metrics view model (the panels the hub composes) and the metrics core types, shared with the hub.
apz-metrics.workspace = true
apz-metrics-view = { path = "../../crates/apz-metrics-view" }
# The wgpu renderer is the WebGPU-compatible backend; tiny-skia is the software
# fallback the renderer stack drops to when wgpu cannot get a device.
# `smol` (not `thread-pool`) is the executor: it provides `time::every` for the
# 2 s poll and pulls no tokio.
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    # The widget operations the snapshot harness uses (APZ_SNAPSHOT_SCROLL).
    "advanced",
    "tiny-skia",
    "smol",
    "crisp",
    "web-colors",
    "x11",
    "wayland",
    "canvas",
    # The IDE's editor: syntax highlighting in `text_editor` (iced_highlighter, syntect).
    "highlighter",
    # The console's icons (the web console's lucide set) and agent portraits.
    "svg",
    "image",
    # The graphics adapter in use, so a software fallback is visible, not just slow.
    "sysinfo",
] }
# The Floor's 3D world, drawn with our own wgpu pipelines inside iced's shader widget
# (`console/floor3d`): matrices, vertex data, and its painted textures and plaques.
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
# The hub client: plain HTTP on loopback, pinned TLS to a remote hub.
apz-engine = { path = "../../crates/apz-engine" }
apz-http = { path = "../../crates/apz-http" }
# The IDE terminal's emulator (the VT screen over vte; no UI, so it stays testable here).
apz-vt = { path = "../../crates/apz-vt" }
apz-plaza = { path = "../../crates/apz-plaza" }
# The rich-content classifier: which references in agent text become chips and hover cards (console/rich.rs).
apz-rich = { path = "../../crates/apz-rich" }
apz-os = { path = "../../crates/apz-os" }
apz-setup = { path = "../../crates/apz-setup" }
apz-workstation = { path = "../../crates/apz-workstation" }
apz-trust = { path = "../../crates/apz-trust" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
# The Lab's times are the owner's local time, as the web's (`clock` reads the zone on every platform).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The Lab's upload picks its JSONL file with the native file dialog, as the web's file input does.
rfd = "0.17"

[dev-dependencies]
# iced's headless harness: it drives the same widgets and application the
# binary runs, so the UI is verified on a host with no display to look at.
iced_test = "0.14"

[lib]
name = "agentplaza_desktop"
path = "src/lib.rs"

[[bin]]
name = "agentplaza-desktop"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true
