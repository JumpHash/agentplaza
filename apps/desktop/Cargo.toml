[package]
name = "agentplaza-desktop"
description = "AgentPlaza fleet dashboard: an iced + wgpu desktop client for the node daemon's API"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# This app is deliberately its own workspace: it builds with its own Cargo.lock
# and the root workspace (`members = ["crates/*"]`) never picks it up.
[workspace]

[dependencies]
# The wgpu renderer is the WebGPU-compatible backend; tiny-skia is the software
# fallback the renderer stack drops to when wgpu cannot get a device.
# `smol` (not `thread-pool`) is the executor: it provides `time::every` for the
# 2 s poll and pulls no tokio.
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "smol",
    "crisp",
    "web-colors",
    "x11",
    "wayland",
    # The fleet map is drawn with iced's own canvas (`iced::widget::canvas`).
    "canvas",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# iced's headless harness: it drives the same widgets and application the
# binary runs, so the UI is verified on a host with no display to look at.
iced_test = "0.14"

[lib]
name = "agentplaza_desktop"
path = "src/lib.rs"

[[bin]]
name = "agentplaza-desktop"
path = "src/main.rs"
