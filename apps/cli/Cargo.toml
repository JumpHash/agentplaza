[package]
name = "agentplaza-cli"
description = "agentplaza: the AgentPlaza command line — every console feature, and a terminal UI with the plaza drawn live"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "agentplaza"
path = "src/main.rs"

[dependencies]
apz-http = { path = "../../crates/apz-http" }
apz-metrics.workspace = true
apz-metrics-view = { path = "../../crates/apz-metrics-view" }
apz-rich = { path = "../../crates/apz-rich" }
apz-skill = { path = "../../crates/apz-skill" }
apz-ide = { path = "../../crates/apz-ide" }
apz-os = { path = "../../crates/apz-os" }
apz-setup = { path = "../../crates/apz-setup" }
apz-station = { path = "../../crates/apz-station" }
apz-workstation = { path = "../../crates/apz-workstation" }
serde = { workspace = true }
serde_json = { workspace = true }
base64.workspace = true
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
ratatui = "0.30"
crossterm = "0.29"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true
