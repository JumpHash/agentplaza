# cargo-nextest (CI runs the tests with it: one process per test, in parallel).
# A test that runs longer than 30 s is reported; one still running after 2 minutes is killed and
# fails, so a hang (like a socket read with no timeout) costs two minutes, not the job.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false

[profile.ci]
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false
failure-output = "immediate-final"

# The results the pull request's Tests comment shows (.github/ci/results.py, check-results.yml):
# target/nextest/ci/junit.xml in the workspace (nextest keeps its reports there, whatever the build
# directory), with each failure's output.
[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

# arm64 Linux tests run natively on the arm64 runners, but under qemu-user when x86_64 tests and packages arm64 in
# one run (.github/ci/Dockerfile), 15 to 50 times slower: a test there is killed after 10 minutes rather than 2,
# so the long layout and world tests can finish.
[[profile.ci.overrides]]
platform = "aarch64-unknown-linux-gnu"
slow-timeout = { period = "60s", terminate-after = 10 }

# The timing budgets run alone: they measure wall-clock time, and the job's other tests would share
# their cores (they failed on a loaded runner, one at four times its budget). Each budget file is named here
# whole, so a budget added to it runs alone too.
[[profile.ci.overrides]]
filter = 'binary_id(apz-engine::machines_budget) | binary_id(apz-metrics::budget)'
threads-required = "num-test-threads"

# The hub's integration tests (crates/apid/tests) each start a hub, Weft and fake daemons and play several
# agents through a whole flow: on a runner busy with every other test they starved, one past the 2-minute kill.
# Each takes two test slots, so fewer run at once, and has 4 minutes. Last: the first override that sets a value
# wins, so the timing budgets above still run alone.
[[profile.ci.overrides]]
filter = 'package(apid) & kind(test)'
threads-required = 2
slow-timeout = { period = "30s", terminate-after = 8 }
