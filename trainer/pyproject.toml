[project]
name = "apz-train"
version = "0.1.0"
description = "Foundry trainer runtime: single, tight (torchrun) and loose (DiLoCo) training with ONNX export"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5",
  "numpy>=1.26",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]

[project.optional-dependencies]
search = ["optuna>=3.6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
