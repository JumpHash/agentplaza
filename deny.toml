# cargo deny (the pull request gate's lint job runs `cargo deny --locked check`): known
# vulnerabilities, licences, banned crates and where dependencies come from.

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerable, unmaintained, unsound, yanked) fails, unless listed here
# with the reason it does not affect AgentPlaza.
ignore = []
# Unmaintained crates count only when the workspace depends on them directly; a transitive one
# is its parent's to replace.
unmaintained = "workspace"

[licenses]
# Permissive licences only (AgentPlaza is Apache-2.0). A dual-licensed crate passes when one of
# its licences is here.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "BlueOak-1.0.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
