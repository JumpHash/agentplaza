[package]
name = "apz-ops"
description = "AgentPlaza workspace operations: confined file reads and writes, searches, bounded runs and PTY terminals, shared by the agent harness and the workstation daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
apz-ide = { path = "../apz-ide" }
apz-proto.workspace = true
base64.workspace = true
globset = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
