[package]
name = "apz-prompt"
description = "AgentPlaza's prompt library core: best-practice checks and scores for system prompts and AGENTS.md, line diffs, template variables"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
# The hub's store derives its tables on the kinds, severities and findings. Off by default: the desktop runs the
# checks without SQLite (apid enables the feature, as it does for apz-station).
apz-store = { path = "../apz-store", optional = true }

[features]
store = ["dep:apz-store"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
