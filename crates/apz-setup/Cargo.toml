[package]
name = "apz-setup"
description = "First-run setup of a plaza: the requirements of its mode checked (services, ports, and the optional hypervisor), with what the user must do for each. The setup installs nothing: no Docker, no database, no object store. Shared by the desktop app and the CLI; no GUI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
apz-os = { path = "../apz-os" }
serde_json = { workspace = true }

