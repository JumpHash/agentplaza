[package]
name = "apz-acp"
description = "AgentPlaza's Agent Client Protocol support: ACP types, blocking line-delimited JSON-RPC, the plaza mapping layer, a fake agent and a fake client for tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Types only: the schema crate. Framing, ids and the peer are ours (see the plan's section 2).
agent-client-protocol-schema = { version = "=1.10.2", features = ["unstable_protocol_v2"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
