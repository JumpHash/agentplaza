[package]
name = "apz-station"
description = "AgentPlaza workstation link: the hub<->workstation protocol (frames, operations, events, facts and settings)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The hub's store derives its tables on the facts and settings. Off by default: a daemon does not link SQLite.
apz-store = { path = "../apz-store", optional = true }

[features]
store = ["dep:apz-store"]

[lints]
workspace = true
