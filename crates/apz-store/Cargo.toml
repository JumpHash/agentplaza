[package]
name = "apz-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The hub's SQLite store: a writer thread and a reader pool per file, embedded migrations, the schema lint, backups, and typed tables for structs (derive Table)."
publish = false

[dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "backup", "cache", "fallible_uint"] }
apz-store-derive = { path = "../apz-store-derive" }
sha2 = { workspace = true }
serde_json = { workspace = true, optional = true }

[features]
# `Content` for serde_json::Value: a field that holds content as written (a tool's input) stored as its text.
json = ["dep:serde_json"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "store"
harness = false
