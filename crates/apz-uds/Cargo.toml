[package]
name = "apz-uds"
description = "Unix-domain stream sockets on every platform: std's on Unix, WinSock AF_UNIX on Windows 10 1803+"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"] }
