[package]
name = "dispatchd"
description = "AgentPlaza fleet dispatcher: claims the ledger's open roled tasks for connected agents, drives them by script, and finishes them with the artifacts their workspace now holds"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apz-http = { path = "../apz-http" }
serde.workspace = true
serde_json.workspace = true

[lib]
name = "dispatchd"
path = "src/lib.rs"

[[bin]]
name = "dispatchd"
path = "src/main.rs"
