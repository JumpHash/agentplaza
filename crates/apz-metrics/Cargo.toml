[package]
name = "apz-metrics"
description = "AgentPlaza's metrics core: series keys, atomic counters and log-bucket histograms, compressed chunks, rollups, queries, the node batch wire format, alert rules, forecasts, traces and the metric catalog. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The typed tables the hub keeps these values in (derive Column on the enums, Table on the alert rules).
apz-store = { path = "../apz-store" }

[dev-dependencies]
base64.workspace = true
flate2 = "1.1"

[lints]
workspace = true
