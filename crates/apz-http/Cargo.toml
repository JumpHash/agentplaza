[package]
name = "apz-http"
description = "AgentPlaza's one tiny HTTP/1.1 server, client and SSE implementation, with the loopback Host guard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
apz-trust = { path = "../apz-trust" }
# ETags over responses as sent (Response::revalidated).
apz-cache = { path = "../apz-cache" }
sha1 = "0.10"
base64 = "0.22"
# The routes' documentation (RouteDoc) carries their bodies' JSON Schemas, for the OpenAPI spec.
schemars = "1"

[dev-dependencies]
rcgen = "0.13"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "http"
harness = false

[lints]
workspace = true
