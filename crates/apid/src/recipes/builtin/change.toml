# The change recipe (PLAN 21.1, 8.2): a builder's step, then the adversarial chain. Two sceptic reviewers review the
# sealed change on models other than the builder's, in parallel (a third on a large or risky change: `risk`). A verifier,
# on a model no other seat of the task used where one exists, proves each finding or drops it. A confirmed finding
# sends the builder back with it, and the chain re-reviews what changed, at most twice more (three rounds in all).
id = "change"
name = "Change"
version = 2
inputs = ["task"]
outputs = ["change"]
triggers = ["task.ready"]

[[steps]]
id = "build"
seat = "builder"
role = "builder"
model = "any"
output = "change"

[[steps]]
id = "review"
seat = "reviewer"
role = "reviewer"
model = "differ"
fan_out = 2
gate = ["passed"]

[steps.risk]
lines = 400
paths = ["crates/apid/src/vault/**", "crates/apz-trust/**", "crates/weft/src/keys.rs"]
extra = 1

[[steps]]
id = "verify"
seat = "verifier"
role = "verifier"
model = "differ"
gate = ["passed", "no findings"]

[[edges]]
from = "build"
to = "review"
when = "passed"

[[edges]]
from = "review"
to = "verify"
when = "passed"

[[edges]]
from = "verify"
to = "build"
when = "findings>0"
max = 2
