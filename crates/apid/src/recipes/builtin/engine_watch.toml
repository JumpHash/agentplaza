# The engine-watch recipe (PLAN 21.1, 12.6). Stub: it needs the engine-watch phase (12.6); none runs yet. The engines a
# project uses are watched; a newer version is checked, and a proposal to change the engine is made.
id = "engine-watch"
name = "Engine watch"
description = "Stub until the engine-watch phase (12.6): declares its steps, none runs yet."
version = 1
inputs = ["engines"]
outputs = ["proposal"]
triggers = ["schedule"]

[[steps]]
id = "watch"
engine = "engine-watch"
gate = ["passed"]

[[steps]]
id = "propose"
engine = "engine-watch"
gate = ["passed"]
output = "proposal"

[[edges]]
from = "watch"
to = "propose"
when = "findings>0"
