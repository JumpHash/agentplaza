# The plan recipe (PLAN 21.1, 21.2). Stub: it needs the planning phase (21.2); none runs yet. Its steps are the spec and
# the split of the spec into tasks, with their links, seats and budgets.
id = "plan"
name = "Plan"
description = "Stub until the planning phase (21.2): declares its steps, none runs yet."
version = 1
inputs = ["spec"]
