[package]
name = "apid"
description = "AgentPlaza's control plane: agents, models, tasks, transcripts and the operator API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
apz-prompt = { path = "../apz-prompt" }
apz-skill = { path = "../apz-skill" }
jhrl = { path = "../jhrl" }
apz-acp = { path = "../apz-acp" }
apz-proto.workspace = true
apz-http = { path = "../apz-http" }
apz-metrics.workspace = true
apz-gateway = { path = "../apz-gateway" }
apz-plaza = { path = "../apz-plaza" }
apz-ide = { path = "../apz-ide" }
# The workstation link protocol (docs/design/workstations.md; crates/apz-station): frames, operations, facts, settings.
apz-station = { path = "../apz-station" }
apz-rich = { path = "../apz-rich" }
# The metrics core and the Metrics view model (docs/architecture.md, "Metrics").
apz-metrics-view = { path = "../apz-metrics-view" }
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
sha2.workspace = true
blake2.workspace = true
apz-trust = { path = "../apz-trust" }
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
apz-os = { path = "../apz-os" }
# The vault's crypto (docs/design/vault.md): XChaCha20-Poly1305, Argon2id, HKDF, HMAC.
chacha20poly1305.workspace = true
argon2.workspace = true
hkdf.workspace = true
hmac.workspace = true
zeroize.workspace = true
secrecy.workspace = true
base64.workspace = true
flate2 = "1.1"
# The egress CA and its leaf certificates (egress_inject.rs). Already in the lock as apz-http's dev-dependency.
rcgen = "0.13"
# Model agents' ONNX inference: pure Rust, no native deps. The default `transformers` feature
# (attention ops) is off: model cards describe plain feed-forward nets.
tract-onnx = { version = "0.23.8", default-features = false }
# The WordPiece / BPE tokenizers of Hugging Face text models (tokenizer.json, read offline). Pure Rust:
# the default onig (C) and esaxx (C++) features are off; fancy-regex does the pre-tokenizer regexes.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
# Free disk space on every platform the hub runs on (already in the lock at this version).
sysinfo = "0.33"

[target.'cfg(target_os = "linux")'.dependencies]
# prctl(PR_SET_DUMPABLE) so a crash leaves no core with the vault's keys in it (vault/process.rs).
libc.workspace = true

[build-dependencies]
serde_json.workspace = true
