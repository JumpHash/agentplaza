[package]
name = "apid"
description = "AgentPlaza's control plane: agents, models, tasks, transcripts and the operator API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
apz-link = { path = "../apz-link" }
# The hub's store (SQLite, typed tables) and its caches (PLAN 30.3, 30.4).
apz-store = { path = "../apz-store", features = ["json"] }
# The object store (apz-blobs, storage.rs): the bytes of the Library, the artifacts, the skills and the stations.
apz-blobs = { path = "../apz-blobs" }
# Node-to-node transfers (transfer.rs): the grants the hub signs and the manifests the nodes offer.
apz-transfer = { path = "../apz-transfer" }
apz-cache = { path = "../apz-cache" }
apz-prompt = { path = "../apz-prompt", features = ["store"] }
apz-skill = { path = "../apz-skill", features = ["store"] }
jhrl = { path = "../jhrl" }
apz-acp = { path = "../apz-acp" }
# The W40 languages and their servers (PLAN 15.2): a base's recipe starts them (base_recipe.rs).
apz-lsp = { path = "../apz-lsp" }
apz-proto = { workspace = true, features = ["store"] }
apz-http = { path = "../apz-http" }
weft = { path = "../weft" }
apz-metrics.workspace = true
apz-uds = { path = "../apz-uds" }
apz-gateway = { path = "../apz-gateway" }
apz-plaza = { path = "../apz-plaza" }
# The iOS simulator's command lines (simctl) and the Mac-side permission checks (user_test/simulator.rs).
apz-desktop-macos = { path = "../apz-desktop-macos" }
apz-android = { path = "../apz-android" }
# Test selection (PLAN 15.4): the coverage maps, the build graph and the selection (test_select.rs).
apz-testsel = { path = "../apz-testsel" }
apz-ide = { path = "../apz-ide" }
# The terminal target's grid (user_test/tui.rs): a program's screen as text and as pixels.
apz-vt = { path = "../apz-vt" }
# The workstation link protocol (docs/design/workstations.md; crates/apz-station): frames, operations, facts, settings.
apz-station = { path = "../apz-station", features = ["store"] }
apz-rich = { path = "../apz-rich" }
# The metrics core and the Metrics view model (docs/architecture.md, "Metrics").
apz-metrics-view = { path = "../apz-metrics-view" }
apz-theme = { path = "../apz-theme", features = ["store"] }
apz-view = { path = "../apz-view", features = ["raster"] }
apz-artifact = { path = "../apz-artifact" }
serde.workspace = true
serde_json.workspace = true
# The API's OpenAPI spec (openapi.rs): the routes' request and response schemas.
schemars = "1"
toml = "1"
# The glue tier (PLAN 14.4; glue.rs): connector components run under wasmtime's component model, compiled by
# cranelift. Already in the lock (48.0.7, through tree-sitter). No WASI and no HTTP: the hub mediates both.
wasmtime = { version = "48", default-features = false, features = ["runtime", "component-model", "cranelift"] }
ureq.workspace = true
sha2.workspace = true
# The checksum files of a Maven publish (9.5: releases/registries/wire.rs): the .md5 and .sha1 next to each file.
md-5 = "0.10"
sha1 = "0.10"
blake2.workspace = true
apz-trust = { path = "../apz-trust" }
apz-os = { path = "../apz-os" }
apz-egress-rules = { path = "../apz-egress-rules" }
# The test topologies (PLAN 22.6): the typed file, the guest plan and the runner (topology.rs).
apz-topology = { path = "../apz-topology" }
apz-secrets = { path = "../apz-secrets" }
# The vault's crypto (docs/design/vault.md): XChaCha20-Poly1305, Argon2id, HKDF, HMAC.
chacha20poly1305.workspace = true
argon2.workspace = true
hkdf.workspace = true
hmac.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
zeroize.workspace = true
secrecy.workspace = true
base64.workspace = true
# The relay client's socket to agentplaza.io (shares/relay.rs): TLS through rustls, with apz-http's client
# configuration and its Mozilla roots (`__rustls-tls` is rustls without tungstenite's own root store).
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "__rustls-tls"] }
# The relay's signatures (shares/relay.rs), matching crates/apz-trust.
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = "1.1"
# The stand-in target's screenshots (user_test/target.rs): PNG encoding; the crate is already in Cargo.lock.
png = "0.18"
# The stdio servers' OS sandbox (crates/apz-sandbox) and the archives of the runtimes and binary packages.
apz-sandbox = { path = "../apz-sandbox" }
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
# The egress CA and its leaf certificates (egress_inject.rs). Already in the lock as apz-http's dev-dependency.
rcgen = "0.13"
# RS256 for the GitHub App's JWT (already in the tree through rcgen and rustls).
ring = "0.17"
# Model agents' ONNX inference: pure Rust, no native deps. The default `transformers` feature
# (attention ops) is off: model cards describe plain feed-forward nets.
tract-onnx = { version = "0.23.8", default-features = false }
# The WordPiece / BPE tokenizers of Hugging Face text models (tokenizer.json, read offline). Pure Rust:
# the default onig (C) and esaxx (C++) features are off; fancy-regex does the pre-tokenizer regexes.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
# Free disk space on every platform the hub runs on (already in the lock at this version).
sysinfo = "0.33"

[target.'cfg(unix)'.dependencies]
# prctl(PR_SET_DUMPABLE) so a crash leaves no core with the vault's keys in it (vault/process.rs).
libc.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
# The desktop agent of a Linux desktop target, served on a loopback port by the fork tests (desktop_test.rs).
apz-gui-agent = { path = "../apz-gui-agent" }
# The glue tests build their components from WAT text (glue.rs).
wat = "1"
