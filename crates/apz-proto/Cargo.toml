[package]
name = "apz-proto"
description = "AgentPlaza wire types: the guest<->hub line protocol and the provider-neutral chat model"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The hub's store derives its tables on the work types. Off by default: the wasm consumers must not link SQLite.
apz-store = { path = "../apz-store", optional = true }

[features]
store = ["dep:apz-store"]

# `HostFacts::now` reads the OS CSPRNG; the wasm consumers (the web engine and IDE) never call it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
apz-os = { path = "../apz-os" }

[target.'cfg(windows)'.dependencies]
apz-uds.workspace = true

[lints]
workspace = true
