[package]
name = "noded"
publish = false
description = "AgentPlaza node daemon v0: run lifecycle and VM control over localhost HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apz-http.workspace = true
apz-link = { path = "../apz-link" }
apz-topology = { path = "../apz-topology" }
# What the node records for the hub (metrics.rs), the batch it sends (apz_metrics::wire), and its Prometheus
# metrics and timing lines (apz_metrics::prom).
apz-metrics.workspace = true
apz-os = { path = "../apz-os" }
# The OS sandbox a trainer job runs in (`train`): Seatbelt, Landlock or an AppContainer.
apz-sandbox = { path = "../apz-sandbox" }
apz-station = { path = "../apz-station" }
apz-uds = { path = "../apz-uds" }
# Node-to-node transfers (transfer.rs): the blob store, the grants and the chunks a node lacks.
apz-blobs = { path = "../apz-blobs" }
apz-transfer = { path = "../apz-transfer" }
# Transfers carry their chunks as base64 in JSON (`migrate`).
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
# Warm templates are keyed by the SHA-256 of their images and shape (`templates`).
sha2.workspace = true
vmm = { path = "../vmm" }
# The destinations a project's proxy refuses, and the name each project's party is known by (`mac_sandbox`).
apz-egress-rules = { path = "../apz-egress-rules" }
# The egress proxy a Mac project account's sessions reach the internet through (`mac_sandbox::ProjectProxy`).
vsockd = { path = "../vsockd" }
# Volume sizes everywhere; on hosts other than Linux, the host stats too (Linux reads `/proc`).
sysinfo = "0.33"

[dev-dependencies]
# The loopback policy for the proxy's tests: their stand-in internet is a local server.
vsockd = { path = "../vsockd", features = ["test-support"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
tempfile = "3"

[lib]
name = "noded"
path = "src/lib.rs"

[[bin]]
name = "noded"
path = "src/main.rs"

[lints]
workspace = true
