[package]
name = "apz-engine"
description = "AgentPlaza's one 3D engine: the Floor's wgpu renderer and scenes, platform-agnostic (no window, no iced). The host hands it a wgpu Device, Queue and target view."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The same wgpu as iced 0.14 uses (27.0.1 in Cargo.lock), so iced's Device, Queue and TextureView are ours.
wgpu = "27.0.1"
glam = { version = "0.30", features = ["bytemuck"] }
# The machine model kit: glTF models and KTX2 textures (pure Rust, so the wasm build takes them too).
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras"] }
ktx2 = "0.5"
ruzstd = "0.9"
bytemuck = { version = "1", features = ["derive"] }
# Half floats for the packed vertex and instance formats (render.rs's Vertex and Row).
half = "2"
serde.workspace = true
serde_json.workspace = true
apz-theme = { path = "../apz-theme" }

ab_glyph = "0.2"
# The GPU match rules' regexes: regex-lite keeps the web engine small (no lookaround; the rules need none).
regex-lite = "0.1"
tiny-skia = "0.11"
# `Instant` for the frame clock: std on native, performance.now() in the browser.
web-time = "1"
bevy_ecs = { version = "0.18.1", default-features = false, features = ["std"] }

# The browser: WebGPU, with WebGL2 as the fallback (the engine's two backends on wasm32).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "27.0.1", features = ["webgpu", "webgl"] }

# The WebGL2 shader test (tests/webgl2_shaders.rs) parses and writes GLSL ES with the same naga wgpu 27 uses.
[dev-dependencies]
naga = { version = "27", features = ["wgsl-in", "glsl-out"] }
# The timing tests ask `apz_os::runner::emulated` whether their budgets mean anything on this run.
apz-os = { path = "../apz-os" }



[features]
# The machine model kit (kit.rs's KIT_FILES) is compiled into the crate. The web build turns this off and hands the
# files over at runtime (kit::provide), so its wasm carries none of them.
default = ["embedded-kit"]
embedded-kit = []

[lints]
workspace = true
