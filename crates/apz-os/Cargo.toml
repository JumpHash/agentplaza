[package]
name = "apz-os"
description = "What differs between Linux, macOS and Windows for AgentPlaza: where state lives, private files, OS randomness, detached processes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
getrandom = "0.3"

# The Windows machine identifier is read from the registry (`machine::id`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Registry"] }
