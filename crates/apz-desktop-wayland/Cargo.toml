[package]
name = "apz-desktop-wayland"
description = "AgentPlaza workstation desktop backend for Linux Wayland: the owner's screen and input through the XDG desktop portals (ScreenCast and RemoteDesktop) and PipeWire"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The portals, PipeWire and the session bus exist on Linux only; elsewhere the crate compiles to nothing.
[target.'cfg(target_os = "linux")'.dependencies]
apz-desktop = { path = "../apz-desktop" }
apz-station = { path = "../apz-station" }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
pipewire = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
