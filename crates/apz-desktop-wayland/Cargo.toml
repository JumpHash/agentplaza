[package]
name = "apz-desktop-wayland"
description = "AgentPlaza workstation desktop backend for Linux Wayland: the owner's screen and input through the XDG desktop portals (ScreenCast and RemoteDesktop) and PipeWire"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# PipeWire is opt-in: building it needs the PipeWire development headers and libclang (for bindgen). Without the
# feature the screen's frames are refused as unsupported, and everything else (the portals, input) still works.
[features]
default = []
pipewire = ["dep:pipewire"]

# The portals and the session bus exist on Linux only; elsewhere the crate compiles to nothing.
[target.'cfg(target_os = "linux")'.dependencies]
apz-desktop = { path = "../apz-desktop" }
apz-station = { path = "../apz-station" }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
pipewire = { version = "0.10", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }

[lints]
workspace = true
