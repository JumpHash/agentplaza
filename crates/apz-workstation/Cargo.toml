[package]
name = "apz-workstation"
description = "AgentPlaza workstation daemon: joins a hub, dials its station link, and serves files, terminals, runs, screens, input and STOP ALL in the work folder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "apz-workstation"
path = "src/main.rs"

[dependencies]
apz-desktop = { path = "../apz-desktop" }
apz-http = { path = "../apz-http" }
apz-ops = { path = "../apz-ops" }
apz-os = { path = "../apz-os" }
apz-station = { path = "../apz-station" }
apz-trust = { path = "../apz-trust" }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# The platform desktop backends are always built for their own platform: Linux has the X11, Wayland and AT-SPI
# backends, macOS its backend, Windows its backend. Which one serves a run is chosen at run time (`backend`).
# libc is here for AF_VSOCK, a workstation VM's way to its hub (vsock.rs); the lock already has it.
[target.'cfg(target_os = "linux")'.dependencies]
apz-desktop-atspi = { path = "../apz-desktop-atspi" }
apz-desktop-wayland = { path = "../apz-desktop-wayland" }
apz-desktop-x11 = { path = "../apz-desktop-x11" }
libc.workspace = true
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
apz-desktop-macos = { path = "../apz-desktop-macos" }

[target.'cfg(windows)'.dependencies]
apz-desktop-windows = { path = "../apz-desktop-windows" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

# PipeWire screen capture for the Wayland backend. Building it needs the PipeWire headers and libclang.
[features]
default = []
pipewire = ["apz-desktop-wayland/pipewire"]
