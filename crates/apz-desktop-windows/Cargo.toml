[package]
name = "apz-desktop-windows"
description = "The Windows backend of the workstation's desktop control interface: DXGI desktop duplication, SendInput, UI Automation, and the app catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
apz-desktop = { path = "../apz-desktop" }
apz-station = { path = "../apz-station" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
