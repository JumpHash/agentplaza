[package]
name = "vsockd"
publish = false
description = "AgentPlaza orchestrator stand-in: the host end of the vsock orchestration loop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apz-egress-rules = { path = "../apz-egress-rules" }
apz-http.workspace = true
apz-metrics.workspace = true
apz-os = { path = "../apz-os" }
apz-proto.workspace = true
apz-uds.workspace = true
libc.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.13"

[features]
# The loopback policy the node's tests use for their stand-in internet (`egress::Policy::allow_loopback`).
test-support = []

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lib]
name = "vsockd"
path = "src/lib.rs"

[[bin]]
name = "vsockd"
path = "src/main.rs"

[[bin]]
name = "mcp-bridge"
path = "src/bin/mcp_bridge.rs"

[lints]
workspace = true
