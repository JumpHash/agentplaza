[package]
name = "apz-engine-web"
description = "The browser shell of AgentPlaza's 3D engine: a wasm-bindgen crate that puts apz-engine on a canvas (WebGPU, with WebGL2 as the fallback)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "apz_engine_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Without the embedded kit (apz-engine's `embedded-kit` is the default): the page hands the kit's files over (kit_file, kit_ready).
apz-engine = { path = "../apz-engine", default-features = false }
# The same wgpu as apz-engine (27.0.1 in Cargo.lock), so the surface and the device are the engine's.
wgpu = "27.0.1"
# `Instant` for the frame clock: std on native, performance.now() in the browser.
web-time = "1"

# The browser only: the crate is empty on the native target (see src/lib.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
serde_json.workspace = true
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "KeyboardEvent",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "ResizeObserver",
    "Window",
    "WheelEvent",
    "console",
] }
# The WebGPU and WebGL2 backends of wgpu, as apz-engine enables them for the browser.
wgpu = { version = "27.0.1", features = ["webgpu", "webgl"] }

[lints]
workspace = true
