[package]
name = "apz-link"
description = "AgentPlaza node link: joins a hub with a join code, then carries the hub's commands to this machine's noded and vsockd and the agents' traffic to the hub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
apz-http = { path = "../apz-http" }
apz-os = { path = "../apz-os" }
apz-trust = { path = "../apz-trust" }
base64.workspace = true
flate2 = "1.1"
serde.workspace = true
serde_json.workspace = true
weft = { path = "../weft", default-features = false }

[dev-dependencies]
rcgen = "0.13"

[lints]
workspace = true
