[package]
name = "vmm"
description = "Multi-microVM monitor for AgentPlaza's node daemon: derived from Firecracker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apz-os = { path = "../apz-os" }
# Host-side Unix-domain sockets of the vsock muxer (std on Unix, AF_UNIX on Windows).
apz-uds.workspace = true
libc.workspace = true
# VM snapshots: the saved vCPU, VM and device state (`vstate::snapshot`).
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
vm-memory.workspace = true
acpi_tables.workspace = true
zerocopy.workspace = true

[target.'cfg(unix)'.dependencies]
# rawfd (vm-memory's default, enabled here so unix builds are unchanged) is
# not supported on Windows; linux-loader enables vm-memory's defaults itself,
# so it is unix-only too.
vm-memory = { workspace = true, features = ["rawfd"] }
linux-loader.workspace = true
# vmm-sys-util 0.15 does not build for non-x86_64 Windows (its timer falls back
# to libc::clock_gettime), so the device crates are unix-only for now.
vm-superio.workspace = true
vmm-sys-util.workspace = true

[target.'cfg(windows)'.dependencies]
# The WHP backend (loaded at run time: only the types and constants come from
# here), guest memory (VirtualAlloc) and the WinSock event shim in `pal`.
vm-superio.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Hypervisor",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# `serde` derives the snapshot state of the KVM structures the vCPU and VM state carry.
kvm-bindings = { workspace = true, features = ["serde"] }
kvm-ioctls.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
vm-fdt.workspace = true

[lib]
name = "vmm"

[lints]
workspace = true
