[package]
name = "apz-topology"
description = "Test topologies (PLAN 22.6): the typed topology file, its guest plan (containers, bridge, egress proxy), the guest's name service and the process runner that stands in for its container runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = "1"
serde_yaml_ng = "0.10"
# The collector's relay to the hub's receiver (collector.rs): the workspace's HTTP client.
ureq.workspace = true
# The hub's secret shapes (the hooks' detector): the security stages scan a release's tree with it.
apz-secrets = { path = "../apz-secrets" }

[[bin]]
# The guest's topology runner: builds the bridge (--net) and runs the containers' artifacts on it.
name = "apz-topo-run"
path = "src/bin/apz-topo-run.rs"

[[bin]]
# The lab VM's collector (PLAN 22.7): serves OTLP for the services, ships their logs and relays to the hub.
name = "apz-topo-collect"
path = "src/bin/apz-topo-collect.rs"

[[bin]]
# The load generator (PLAN 22.8): runs a traffic profile against a URL, prints its summary and records it at the run.
name = "apz-load"
path = "src/bin/apz-load.rs"

[[bin]]
# The lab VM's fault injector (PLAN 22.8): the fault proxies in front of the dependencies, and the topology's resilience
# scenarios run against them, with their measurements posted at the run.
name = "apz-fault"
path = "src/bin/apz-fault.rs"

# The security stages (PLAN 22.8): the audits, the image scan, the secrets scan, the DAST scan and the fuzzers.
[[bin]]
name = "apz-security"
path = "src/bin/apz-security.rs"

[[bin]]
# A stand-in service for the topology tests: echoes, or relays to another service by name.
name = "apz-topo-echo"
path = "src/bin/apz-topo-echo.rs"

[dev-dependencies]
tempfile = "3"
# The seeded SQLite database of the DAST scan's tests (the workspace's own build of it).
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

[lints]
workspace = true
