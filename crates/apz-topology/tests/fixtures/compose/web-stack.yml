# A web stack in Compose: two built services, a database and a cache, with depends_on, environment, ports, a named volume,
# a healthcheck and two replicas. Every key here converts.
name: web-stack
services:
  web:
    build: ./web
    ports:
      - "8080:80"
    environment:
      API_URL: http://api:8081
    depends_on:
      - api
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8081"
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD:-app}@db:5432/app
      CACHE_URL: redis://cache:6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    deploy:
      replicas: 2
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=app
      - POSTGRES_DB=app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 5
    expose:
      - "5432"
  cache:
    image: redis:7
volumes:
  db_data: {}
