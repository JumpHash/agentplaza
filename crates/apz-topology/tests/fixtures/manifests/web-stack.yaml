# The rendered output of a Helm chart (helm template): several documents, a List, a Job, a Service that selects nothing.
---
# Source: web-stack/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-stack-config
data:
  CACHE_URL: "redis://cache:6379"
  LOG_LEVEL: "info"
---
# Source: web-stack/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stack-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: "registry.example.com/api:1.4.2"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: web-stack-config
          env:
            - name: DATABASE_URL
              value: "postgres://app@db/app"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
          resources:
            limits:
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stack-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: app
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stack-cache
spec:
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: redis
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: cache
spec:
  selector:
    app: cache
  ports:
    - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: cache-ext
spec:
  type: LoadBalancer
  selector:
    app: nothing
  ports:
    - port: 6380
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec: {}
