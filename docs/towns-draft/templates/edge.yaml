# Template: an edge town. Watches and controls physical devices on edge machines (S-016).
template: edge
purpose: Keep the town's devices within their safe envelopes and report what they sense.
mayor: {rung: mid, report_every: daily}
budget: {monthly_credits: 30000, task_default_credits: 300, council_move_pct: 10, alert_at_pct: 80}
roster:
  - {role: edge-operator, max: 2}
  - {role: builder, max: 1}
placement: {require_labels: [gpio], dedicated: true}
egress: {host_groups: []}
tools: {scopes: [telegram:notify]}
confidentiality: sensitive
quiet_hours: {from: "22:00", to: "07:00", tz: "Europe/Vienna"}
