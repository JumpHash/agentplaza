id: shop
name: Shop
template: software
purpose: Build and run the online shop's site and payment integration from the shop spec.
mayor: {rung: mid, report_every: weekly}
budget: {monthly_credits: 400000, task_default_credits: 2000}
roster:
  - {role: planner, max: 1}
  - {role: architect, max: 1}
  - {role: builder, max: 4}
  - {role: reviewer, max: 2}
  - {role: qa, max: 1}
  - {role: security-reviewer, max: 1}
  - {role: release, max: 1}
  - {role: researcher, max: 1}
placement: {prefer_machines: [hw-box-1]}
egress: {host_groups: [package-registries, hub-git, advisories], extra_hosts: [api.stripe.com]}
tools: {scopes: [github:read, github:write, ci:run, cloudflare:deploy]}
confidentiality: normal
bylaws: [B-shop-001, B-shop-002]
