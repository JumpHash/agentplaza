// Control stream: session lifecycle, heartbeats, transcript reconciliation, tool authorisation, owner input.
syntax = "proto3";
package agentplaza.v1;

import "agentplaza/v1/common.proto";
import "agentplaza/v1/tool.proto";

message Hello {
  string proto_version = 1;     // "1.<minor>"
  string harness_version = 2;
  bytes boot_id = 3;            // random per boot; unchanged in a restored snapshot (that's how restore is detected)
  bool restored = 4;            // set by the harness when the daemon signals a restore (0029)
  Seq last_seq = 5;             // highest transcript seq the harness has applied (0 on first boot)
  string snapshot_id = 6;       // the snapshot it was restored from, if any
  Capabilities capabilities = 7;  // 0116
}

message HelloAck {
  string session_token = 1;     // per boot; bound to node + VM + boot; invalidates any previous token (0044)
  string agent_id = 2;          // ULID (Sigil, 0076); the private key never leaves the hub
  string agent_name = 3;
  AgentConfig config = 4;
  repeated TranscriptEvent resume = 5;  // events after Hello.last_seq the harness doesn't have (0084)
  Capabilities capabilities = 6;        // what the orchestrator supports; use the intersection (0116)
  uint32 token_epoch = 7;
  int64 token_expires_unix_ms = 8;      // rotated before expiry (TokenRotate)
}

message AgentConfig {
  string task_id = 1;
  string model_rung = 2;        // "cheap" | "mid" | "frontier" (0055); the gateway picks the model
  repeated ToolSpec tools = 3;  // tools the harness may expose to the model
  Limits limits = 4;
  string codex_hash = 5;        // laws in force (0049)
  repeated LawDigest laws = 6;  // statement + rationale for the agent's context (0048)
}

message Limits {
  uint32 bash_timeout_s = 1;
  uint64 output_cap_bytes = 2;
  uint64 fetch_cap_bytes = 3;
  uint32 snapshot_coalesce_s = 4;   // 0043
}

message LawDigest {
  string law_id = 1;
  string statement = 2;
  string rationale = 3;
}

// One entry of the authoritative transcript. Persisted by the hub before it's acknowledged.
message TranscriptEvent {
  Seq seq = 1;
  oneof event {
    UserTurn user = 2;                 // task text or owner message
    AssistantTurnRef assistant = 3;    // recorded model turn (body may be a blob)
    ToolDecision tool_decision = 4;
    ToolResult tool_result = 5;
    Note note = 6;                     // system notes, e.g. "tool call may have been re-executed"
  }
}

message UserTurn { Payload text = 1; Taint taint = 2; }
message AssistantTurnRef { string request_id = 1; Payload turn = 2; }
message Note { string text = 1; }

// Heartbeats (0114): harness ↔ orchestrator every 5 s on the control stream. No heartbeat for 30 s
// trips the "harness heartbeat loss" tripwire (0072). Machine heartbeats are in node.proto.
message Heartbeat {
  uint64 monotonic_ms = 1;
  int64 wall_unix_ms = 2;           // lets the harness resync its clock after a restore (0029)
  Seq last_seq_applied = 3;         // harness → orchestrator: how far it has applied the transcript
  uint64 harness_rss_bytes = 4;
  uint32 tools_running = 5;
}

// Harness → hub on the control stream.
message ControlUp {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    ToolRequest tool_request = 3;      // ask before executing a tool call
    ToolResult tool_result = 4;        // report after executing
    TaskClaim claim = 5;               // "done" claim; verified, not trusted (0040, 0061)
  }
}

// Hub → harness on the control stream.
message ControlDown {
  oneof msg {
    HelloAck hello_ack = 1;
    Heartbeat heartbeat = 2;
    ToolDecision tool_decision = 3;
    UserTurn owner_message = 4;
    Cancel cancel = 5;
    Ack ack = 6;                       // seq assigned to an upstream event
    TokenRotate token_rotate = 7;      // new session token (0116)
  }
}

// Session tokens rotate every hour and on every restore. New streams must present the new token;
// the previous epoch stays valid for 30 s so in-flight stream setups don't fail (0116).
message TokenRotate {
  string session_token = 1;
  uint32 token_epoch = 2;
  int64 expires_unix_ms = 3;
  uint32 previous_valid_ms = 4;     // grace for the previous epoch (default 30000)
}

message TaskClaim { string summary = 1; Payload evidence = 2; }
message Cancel { string reason = 1; }
message Ack { Seq seq = 1; EntrySeal seal = 2; }   // seal: 0135
