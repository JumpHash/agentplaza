// FS stream (M3): FUSE operations for /plaza (0022; design/shared-data.md, design/protocol.md § FS).
// The harness's FUSE server forwards every operation; the orchestrator enforces ACLs per path and per
// agent, records provenance and taint, and pushes cache invalidations. Proposed in 0114.
//
// Namespace (fixed top level, read-only except where noted):
//   /plaza/artifacts/by-hash/<blake3>/...   immutable artifacts this agent may read
//   /plaza/artifacts/by-name/<name>@<ver>/  aliases to by-hash
//   /plaza/groups/<group>/...               live shared dirs (read-write per group ACL)
//   /plaza/groups/<group>/.history/...      past versions (read-only)
//   /plaza/groups/<group>/.claims           claims board, rendered (read-only; change via BUS)
//   /plaza/inbox/                           artifacts handed to this agent (read-only)
//   /plaza/self/                            identity card, grants, laws in force (read-only)
//
// Consistency: immutable content is cached forever by hash. Live files follow close-to-open semantics:
// writes are buffered in the harness and sent before Release returns; a new version is recorded on each
// Release that wrote data. Concurrent writers: last Release wins (0021); the losing version is kept in
// .history and its writer gets FsReleased.superseded = true.
syntax = "proto3";
package agentplaza.v1;

import "agentplaza/v1/common.proto";

message FsRequest {
  uint64 op_id = 1;                 // matches the response; unique per stream
  string idempotency_key = 23;      // required for mutating ops (create, write, release, mkdir, rmdir, unlink,
                                    // rename, setattr, publish, send): a retry after reconnect is applied once (0116)
  oneof op {
    FsLookup lookup = 2;
    FsGetAttr getattr = 3;
    FsSetAttr setattr = 4;          // truncate and mtime only; no chmod/chown
    FsReadDir readdir = 5;
    FsOpen open = 6;
    FsCreate create = 7;
    FsRead read = 8;
    FsWrite write = 9;
    FsFlush flush = 10;             // send buffered writes now (also done on Release)
    FsRelease release = 11;
    FsMkdir mkdir = 12;
    FsRmdir rmdir = 13;
    FsUnlink unlink = 14;
    FsRename rename = 15;           // within one group only
    FsStatFs statfs = 16;           // reports the group's quota
    FsGetXattr getxattr = 17;       // user.plaza.taint, user.plaza.provenance, user.plaza.version, user.plaza.hash
    FsListXattr listxattr = 18;
    FsLock lock = 19;               // flock(2) and `plaza lock` → orchestrator lease
    FsRenewLease renew = 20;
    FsUnlock unlock = 21;
    PlazaCommand plaza = 22;        // non-file operations from the in-guest `plaza` CLI
  }
}

message FsLookup { string path = 1; }
message FsGetAttr { string path = 1; }
message FsSetAttr { string path = 1; optional uint64 size = 2; optional int64 mtime_unix_ms = 3; }
message FsReadDir { string path = 1; string cursor = 2; uint32 max_entries = 3; }
message FsOpen { string path = 1; bool write = 2; bool truncate = 3; bool append = 4; }
message FsCreate { string path = 1; bool exclusive = 2; }
message FsRead { uint64 handle = 1; uint64 offset = 2; uint32 len = 3; }       // len ≤ 1 MiB
message FsWrite { uint64 handle = 1; uint64 offset = 2; bytes data = 3; }     // data ≤ 1 MiB
message FsFlush { uint64 handle = 1; }
message FsRelease { uint64 handle = 1; }
message FsMkdir { string path = 1; }
message FsRmdir { string path = 1; }
message FsUnlink { string path = 1; }
message FsRename { string from = 1; string to = 2; bool no_replace = 3; }
message FsStatFs { string path = 1; }
message FsGetXattr { string path = 1; string name = 2; }
message FsListXattr { string path = 1; }
message FsLock { string path = 1; uint32 ttl_s = 2; bool exclusive = 3; bool wait = 4; }
message FsRenewLease { string lease_id = 1; uint32 ttl_s = 2; }
message FsUnlock { string lease_id = 1; }

// `plaza` CLI operations that aren't file I/O (design/shared-data.md § Operations).
message PlazaCommand {
  oneof cmd {
    PlazaPublish publish = 1;       // turn a path into an immutable artifact
    PlazaSend send = 2;             // hand an artifact to another agent's inbox (also a BUS message)
  }
}
message PlazaPublish { string path = 1; string name = 2; }   // path may be under /workspace or /plaza/groups
message PlazaSend { string agent = 1; BlobRef artifact = 2; string note = 3; }

message FsAttr {
  uint64 size = 1;
  bool is_dir = 2;
  bool read_only = 3;
  int64 mtime_unix_ms = 4;
  BlobRef content = 5;              // immutable files: cache key, shared across VMs on a machine
  Taint taint = 6;                  // reading a tainted file taints the reader's task
  uint64 version = 7;               // live files: increases on each Release that wrote data
  uint32 ttl_ms = 8;                // how long the harness may cache this attr without asking again
}

message FsDirEntry { string name = 1; FsAttr attr = 2; }
message FsDirPage { repeated FsDirEntry entries = 1; string next_cursor = 2; }
message FsLease { string lease_id = 1; int64 expires_unix_ms = 2; }
message FsStat { uint64 quota_bytes = 1; uint64 used_bytes = 2; uint64 quota_files = 3; uint64 used_files = 4; }
message FsReleased { uint64 new_version = 1; bool superseded = 2; }  // superseded: another writer's version won
message FsXattrs { repeated string names = 1; }

message FsResponse {
  uint64 op_id = 1;
  FsErrno errno = 2;                // OK = success
  Error error = 3;                  // detail: DENIED carries law_id
  oneof result {
    FsAttr attr = 4;
    FsDirPage dir = 5;
    uint64 handle = 6;              // open/create
    bytes data = 7;                 // read
    uint32 written = 8;
    FsLease lease = 9;
    FsStat stat = 10;
    FsReleased released = 11;
    bytes xattr = 12;
    FsXattrs xattrs = 13;
    BlobRef artifact = 14;          // plaza publish
  }
}

// errno mapping the harness returns to the guest kernel.
enum FsErrno {
  FS_OK = 0;
  FS_ENOENT = 1;
  FS_EACCES = 2;                    // ACL or Cedar denial
  FS_EROFS = 3;                     // write to artifacts, inbox, self, .history, .claims
  FS_EEXIST = 4;
  FS_ENOTEMPTY = 5;
  FS_EDQUOT = 6;                    // group quota (bytes or files) exceeded
  FS_EBUSY = 7;                     // exclusive lease held by another agent
  FS_ESTALE = 8;                    // handle invalid after restore or revocation
  FS_EXDEV = 9;                     // rename across groups
  FS_EFBIG = 10;                    // file over the per-file limit
  FS_EIO = 11;                      // orchestrator unreachable; retried by the harness first
  FS_EINVAL = 12;
}

// Pushed by the orchestrator on the same stream, unsolicited.
message FsPush {
  oneof push {
    FsInvalidate invalidate = 1;    // drop cached attrs/data for a path (another agent changed it)
    FsLeaseRevoked lease_revoked = 2; // lease expired or revoked (e.g. agent quarantined)
    FsAclChanged acl_changed = 3;   // group membership changed; re-list /plaza/groups
  }
}
message FsInvalidate { string path = 1; uint64 version = 2; }
message FsLeaseRevoked { string lease_id = 1; string reason = 2; }
message FsAclChanged { string group = 1; }

message FsDown { oneof msg { FsResponse response = 1; FsPush push = 2; } }
