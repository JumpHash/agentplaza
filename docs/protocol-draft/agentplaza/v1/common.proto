// AgentPlaza protocol v1: shared types. Draft (decision 0083).
// Evolution rules: never renumber or reuse field numbers; mark removed fields `reserved`;
// new fields must be optional-in-meaning (peers ignore unknown fields). See docs/design/protocol.md (not in the repo).
syntax = "proto3";
package agentplaza.v1;

// Hub-assigned position in an agent's authoritative transcript (0084).
message Seq { uint64 value = 1; }

// The orchestrator's seal on a committed transcript entry (0135): a signature by an orchestrator key
// (held by the vault) over run, seq, session epoch, the previous entry's hash and this entry's hash.
// Harnesses and machine journals keep seals, so a restored orchestrator can accept newer work back.
message EntrySeal {
  string run_id = 1;
  uint64 seq = 2;
  uint32 session_epoch = 3;
  bytes prev_hash = 4;          // BLAKE3 of the previous sealed entry: the chain
  bytes entry_hash = 5;         // BLAKE3 of this entry's canonical encoding
  bytes signature = 6;          // Ed25519
}

// Content-addressed blob in the hub store (BLAKE3, 0021/0026). Used for large payloads.
message BlobRef {
  bytes blake3 = 1;     // 32 bytes
  uint64 size = 2;
  string media_type = 3;
}

// Either inline bytes (small) or a blob reference (large).
message Payload {
  oneof body {
    bytes inline = 1;
    BlobRef blob = 2;
  }
}

enum Taint {
  TAINT_UNSPECIFIED = 0;
  TAINT_CLEAN = 1;
  TAINT_UNTRUSTED = 2;   // derived from fetched pages, tainted messages or files (0028)
}

message Error {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_DENIED = 1;            // policy (Cedar) said no
    CODE_NEEDS_APPROVAL = 2;    // human gate required (C-004)
    CODE_BUDGET_EXCEEDED = 3;
    CODE_RATE_LIMITED = 4;
    CODE_UPSTREAM = 5;          // provider or remote host failed
    CODE_INVALID = 6;
    CODE_SESSION_EXPIRED = 7;   // e.g. after snapshot restore: re-Hello
    CODE_INTERNAL = 8;
  }
  Code code = 1;
  string message = 2;
  bool retryable = 3;
  string law_id = 4;            // set when a Codex law caused a denial, e.g. "C-004"
}

// Distributed tracing (0116): W3C trace-context compatible, so traces can be exported to standard tools.
// Created by whoever starts the work (owner client, scheduler, harness) and carried on every stream and request.
message TraceContext {
  bytes trace_id = 1;               // 16 bytes
  bytes span_id = 2;                // 8 bytes: the caller's span
  bool sampled = 3;
}

// Capability negotiation (0116): peers announce the protocol minor they speak and the optional features
// they support; each side uses only the intersection. Unknown feature names are ignored.
message Capabilities {
  string proto_version = 1;         // "1.<minor>"
  repeated string features = 2;     // e.g. "fs.v1", "bus.v1", "blob.resume", "model.images", "token.rotate"
  string software = 3;              // component and build, e.g. "harness/0.4.1+abc123"
}

// Passkey step-up. One WebAuthn ceremony: the passkey signs the challenge from Settings.BeginStepUp (owner.proto),
// bound to one RPC and the digest of its arguments, so an assertion can't be reused for anything else.
message StepUp {
  bytes nonce = 1;                 // the challenge; single use, expires within minutes (0116)
  bytes assertion = 2;             // WebAuthn assertion: credential id, authenticatorData, clientDataJSON, signature
}

