// Stream setup. Every vsock connection from the harness, and every QUIC stream from a node
// to the hub, starts with exactly one StreamOpen frame (0085). Frames: 4-byte big-endian length + message.
syntax = "proto3";
package agentplaza.v1;

import "agentplaza/v1/common.proto";

enum StreamKind {
  STREAM_KIND_UNSPECIFIED = 0;
  STREAM_KIND_CONTROL = 1;   // one per boot: session, heartbeats, tool authorisation, transcript events
  STREAM_KIND_MODEL = 2;     // one per model call
  STREAM_KIND_EGRESS = 3;    // one per outbound connection; raw bytes after EgressAccept
  STREAM_KIND_FS = 4;        // /plaza FUSE operations (M3, 0022)
  STREAM_KIND_BUS = 5;       // agent messages (M3, 0023)
  STREAM_KIND_BLOB = 6;      // upload/download of large payloads by BlobRef
  STREAM_KIND_NODE = 7;      // machine ↔ orchestrator control, opened by the machine itself (node.proto)
}

message StreamOpen {
  StreamKind kind = 1;
  string session_token = 2;  // per-boot token from HelloAck; empty only on the first CONTROL stream
  uint64 stream_id = 3;      // chosen by opener, unique per session; for logs and correlation
  Priority priority = 4;     // scheduling class (0116); default from kind
  uint32 deadline_ms = 5;    // give up after this long (0 = per-kind default, see protocol.md § Timeouts)
  TraceContext trace = 6;    // 0116
  uint32 token_epoch = 7;    // which rotation of the session token is presented (0116)
}

// Scheduling classes, highest first. Machines and the orchestrator serve streams in this order when
// bandwidth or CPU is short; QUIC stream priorities are set from it (0116).
enum Priority {
  PRIORITY_UNSPECIFIED = 0;  // use the default for the stream kind
  PRIORITY_CONTROL = 1;      // CONTROL, NODE: heartbeats, tool decisions, fencing
  PRIORITY_INTERACTIVE = 2;  // MODEL streams, approvals, owner messages
  PRIORITY_FILES = 3;        // FS, BUS
  PRIORITY_BULK = 4;         // EGRESS, BLOB, snapshot uploads
}

// Added by the node daemon when it relays a VM stream to the hub (never by the harness).
// The hub checks session_token ↔ vm_id ↔ node identity (from mTLS) before accepting.
message RelayHeader {
  string vm_id = 1;
  string node_id = 2;
  StreamOpen open = 3;
}

message StreamAccept {
  Error error = 1;           // unset = accepted
}
