// Machine ↔ orchestrator control (0019, 0101–0104; design/orchestrator.md (not in the repo)). Accepted in 0114 (with metrics, logs, evidence and per-VM caps).
// Carried on a NODE stream that the machine's daemon opens itself over its mTLS QUIC connection
// (no RelayHeader: the machine is the principal, identified by its certificate).
syntax = "proto3";
package agentplaza.v1;

import "agentplaza/v1/common.proto";

// ---- Enrollment (once) and hello (every connection) ----
message NodeEnroll {
  string enrollment_code = 1;       // one-time code created by the owner (0047)
  bytes public_key = 2;             // Ed25519; the orchestrator returns a certificate for it
  NodeFacts facts = 3;
}
message NodeEnrolled { string node_id = 1; bytes certificate = 2; bytes orchestrator_ca = 3; }

message NodeHello {
  string node_id = 1;
  string daemon_version = 2;
  string proto_version = 3;
  NodeFacts facts = 4;
  repeated VmStatus vms = 5;        // VMs it still runs after a reconnect: the orchestrator fences stale ones
  Capabilities capabilities = 6;    // 0116
  repeated JournalTail tails = 7;   // after an orchestrator restore: sealed entries newer than it may have (0135)
}

// What the machine daemon journaled for one run: entries exactly as relayed, with their seals.
message JournalTail {
  string run_id = 1;
  repeated SealedEntry entries = 2;
  repeated string ran_call_ids = 3;   // allowed calls the harness ran; any other open call is cancelled
}
message SealedEntry {
  EntrySeal seal = 1;
  bytes entry = 2;                    // canonical encoding of the transcript entry
}
// The orchestrator's answer per run: how far it accepted the tail, and why it stopped.
message MergeResult {
  string run_id = 1;
  uint64 accepted_through_seq = 2;
  uint64 rejected_from_seq = 3;       // 0 if everything offered was accepted
  string reason = 4;                  // "bad_signature" | "broken_chain" | "diverges" | ""
  repeated string cancelled_call_ids = 5;
}
message NodeHelloAck {
  repeated string discard_vm_ids = 1;   // VMs moved elsewhere meanwhile (0102)
  Capabilities capabilities = 2;        // 0116
  NodeLimits limits = 3;                // per-VM caps the machine daemon enforces (0114, RT-012)
  repeated MergeResult merged = 4;      // 0135
}

// Caps the machine daemon enforces on each VM's vsock side, before anything reaches the orchestrator.
// A VM that hits a cap gets its new streams refused and the machine reports StreamCapHit.
message NodeLimits {
  uint32 max_streams_per_vm = 1;          // open streams of all kinds; default 64
  uint32 max_stream_opens_per_sec = 2;    // per VM; default 20
  uint64 max_bytes_per_sec_per_vm = 3;    // all streams together; default 32 MiB/s
  uint32 max_frame_bytes = 4;             // larger frames close the stream; default 4 MiB (BLOB chunks fit)
  uint64 log_forward_bytes_per_min = 5;   // budget for LogBatch per machine; default 1 MiB
}

message NodeFacts {
  string arch = 1;                  // "x86_64" | "aarch64"
  string backend = 2;               // "kvm" | "hvf"
  string irqchip = 3;               // "x86" | "gicv2" | "gicv3"
  uint32 host_page_size = 4;        // 4096 or 16384 (0007)
  uint32 cpus = 5;
  uint64 memory_bytes = 6;
  uint64 disk_bytes = 7;
  repeated string hardware_labels = 8;   // e.g. "gpu", "camera" (placement affinities, 0031)
  repeated BlobRef cached_images = 9;    // kernel and erofs images already on disk (0077)
  string kernel_build = 10;
}

// ---- Heartbeats: every 5 s; 15 s missing = unreachable (0102) ----
message NodeHeartbeat {
  uint64 monotonic_ms = 1;
  uint32 vms_running = 2;
  uint64 memory_used_bytes = 3;     // after balloon reclaim (0089)
  float cpu_load = 4;               // 0..cpus
  uint64 snapshot_backlog_bytes = 5;// snapshots written locally but not yet in Garage (0091)
}

// ---- Commands (orchestrator → machine) ----
message NodeCommand {
  string command_id = 1;            // idempotency key: a repeated command is acknowledged, not re-run (0116)
  TraceContext trace = 10;
  oneof cmd {
    StartVm start = 2;
    StopVm stop = 3;
    PauseVm pause = 4;
    ResumeVm resume = 5;
    SnapshotVm snapshot = 6;
    RestoreVm restore = 7;
    DiscardVm discard = 8;          // fencing: stale VM after a move (0102)
    FetchImages fetch_images = 9;   // pre-pull kernel/erofs images by hash
  }
}

message VmSpecMsg {
  string vm_id = 1;
  string run_id = 2;
  uint32 vcpus = 3;                 // default 1 (0090)
  uint32 memory_mib = 4;            // default 512 (0090)
  BlobRef kernel = 5;
  string cmdline = 6;
  BlobRef base_image = 7;
  repeated BlobRef toolsets = 8;
  uint64 scratch_bytes = 9;
  string trust_class = 10;          // "standard" | "low_trust" (0088)
  uint32 guest_cid = 11;
}
message StartVm { VmSpecMsg spec = 1; }
message StopVm { string vm_id = 1; bool snapshot_first = 2; }
message PauseVm { string vm_id = 1; }
message ResumeVm { string vm_id = 1; }
message SnapshotVm { string vm_id = 1; string reason = 2; }     // "tool_boundary" | "hibernate" | "manual"
message RestoreVm { VmSpecMsg spec = 1; string snapshot_id = 2; }
message DiscardVm { string vm_id = 1; string reason = 2; }
message FetchImages { repeated BlobRef images = 1; }

// ---- Events (machine → orchestrator) ----
message NodeEvent {
  oneof event {
    CommandDone done = 1;
    VmStatus vm_status = 2;
    SnapshotCreated snapshot = 3;
    TripwireFired tripwire = 4;
    StreamCapHit cap_hit = 5;
  }
}
message CommandDone { string command_id = 1; Error error = 2; }

message VmStatus {
  string vm_id = 1;
  enum State { STATE_UNSPECIFIED = 0; STATE_BOOTING = 1; STATE_RUNNING = 2; STATE_PAUSED = 3; STATE_STOPPED = 4; STATE_CRASHED = 5; }
  State state = 2;
  uint64 memory_used_bytes = 3;
  string detail = 4;
}

message SnapshotCreated {
  string vm_id = 1;
  string snapshot_id = 2;
  string parent_id = 3;
  uint64 transcript_seq = 4;        // 0084
  uint64 bytes_new = 5;
  uint32 pause_ms = 6;
  bool uploaded = 7;                // false until the chunks reach Garage (0091)
}

message TripwireFired {             // 0072, 0128
  string vm_id = 1;
  string rule = 2;                  // "resource_abuse" | "egress_denial_storm" | "heartbeat_loss" | "tamper" | "egress_anomaly"
  string action = 3;                // "paused" | "killed"
  string evidence = 4;              // short summary
  bool while_offline = 5;           // fired while the orchestrator link was down; reported later
  BlobRef evidence_blob = 6;        // full evidence (logs, counters, a memory excerpt) uploaded over BLOB; kept until the incident closes
}

message StreamCapHit {              // a VM hit a NodeLimits cap; audited, and repeated hits feed resource_abuse
  string vm_id = 1;
  string cap = 2;                   // "streams" | "opens_per_sec" | "bytes_per_sec" | "frame_bytes"
  uint64 value = 3;
}

// ---- Metrics and logs (0122): machines accept no inbound connections, so they push ----
// Sent on the NODE stream in the BULK priority class (0116), every 15 s.
message NodeMetrics {
  uint64 monotonic_ms = 1;
  repeated MetricSample samples = 2;
}
// Labels are low-cardinality by design: there is no field for run, agent, session or trace ids,
// and the orchestrator drops any label key outside its allowlist before re-exporting.
message MetricSample {
  string name = 1;                  // e.g. "apz_vmm_exits_total"
  enum Kind { KIND_UNSPECIFIED = 0; KIND_COUNTER = 1; KIND_GAUGE = 2; }
  Kind kind = 2;
  double value = 3;
  map<string, string> labels = 4;   // e.g. trust_class, device, rule
}

// Warnings and above, forwarded within NodeLimits.log_forward_bytes_per_min; the rest stays on the machine.
message LogBatch {
  repeated LogRecord records = 1;
  uint64 dropped = 2;               // records dropped by the budget since the last batch
}
message LogRecord {
  int64 unix_ms = 1;
  enum Level { LEVEL_UNSPECIFIED = 0; LEVEL_WARN = 1; LEVEL_ERROR = 2; }
  Level level = 2;
  string component = 3;             // "vmm" | "daemon" | "tripwire" | "uploader"
  string msg = 4;
  string vm_id = 5;
  TraceContext trace = 6;
}

message NodeUp { oneof msg { NodeEnroll enroll = 1; NodeHello hello = 2; NodeHeartbeat heartbeat = 3; NodeEvent event = 4;
                             NodeMetrics metrics = 5; LogBatch logs = 6; } }
message NodeDown { oneof msg { NodeEnrolled enrolled = 1; NodeHelloAck hello_ack = 2; NodeCommand command = 3; Error error = 4; } }
