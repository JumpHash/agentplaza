// BLOB stream: upload or download large payloads by content hash (0021, 0026; design/protocol.md § BLOB).
// Proposed in 0114.
//
// Chunks are the same as snapshot chunks (0091): content split into 256 KiB pieces (last one shorter),
// each named by BLAKE3. The blob's own hash is BLAKE3 of the whole content. Everything dedupes against
// everything: artifacts, tool outputs, snapshots, toolset images.
// Uploads are resumable: sending BlobPutStart again for the same blob returns only the chunks still missing.
// Limits: blob ≤ 4 GiB; per-agent and per-task quotas (EDQUOT-style errors).
syntax = "proto3";
package agentplaza.v1;

import "agentplaza/v1/common.proto";

enum BlobPurpose {
  BLOB_PURPOSE_UNSPECIFIED = 0;
  BLOB_PURPOSE_TOOL_OUTPUT = 1;     // full output behind a capped ToolResult
  BLOB_PURPOSE_ARTIFACT = 2;        // plaza publish
  BLOB_PURPOSE_MODEL_CONTENT = 3;   // large message content (images, long text)
}

message BlobPutStart {
  BlobRef blob = 1;                 // hash + size + media type of the whole blob
  repeated bytes chunk_hashes = 2;  // in order; 32 bytes each
  BlobPurpose purpose = 3;
  string task_id = 4;               // quota scope
  Taint taint = 5;                  // carried onto the stored blob
}
message BlobNeed { repeated uint32 missing_chunks = 1; }        // empty = already stored, done
message BlobChunk { uint32 index = 1; bytes data = 2; }
message BlobPutDone {
  Error error = 1;                  // unset = stored and verified (every chunk hash and the blob hash)
  uint64 bytes_new = 2;             // bytes actually added after dedup
}

message BlobGet { BlobRef blob = 1; uint64 offset = 2; uint64 len = 3; }   // len 0 = to the end
message BlobRange { uint64 offset = 1; bytes data = 2; bool last = 3; }

message BlobUp { oneof msg { BlobPutStart start = 1; BlobChunk chunk = 2; BlobGet get = 3; } }
message BlobDown { oneof msg { BlobNeed need = 1; BlobPutDone done = 2; BlobRange range = 3; Error error = 4; } }
