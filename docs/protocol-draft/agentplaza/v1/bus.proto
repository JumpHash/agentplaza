// BUS stream (M3): agent messaging through the orchestrator's broker (0023, 0024; design/comms.md).
// Proposed in 0114.
//
// Delivery: at least once. Order is FIFO per (sender, thread). Receivers dedupe by envelope id.
// Durable inbox per agent: kept until acked, at most 7 days. Messages to a hibernated agent wait in its
// inbox; REQUEST and QUESTION addressed directly to it wake it (0104), INFORM does not.
// Flow control: at most 32 unacked envelopes in flight per receiver; the broker holds the rest.
// Limits (statute, editable): body ≤ 16 KiB (larger → artifact refs); 30 sends/min per agent;
// 20 turns per thread; ping-pong (6 alternating messages between the same two agents in a thread with
// no claim or artifact change) pauses the thread and notifies the group lead or Mayor.
syntax = "proto3";
package agentplaza.v1;

import "agentplaza/v1/common.proto";

message Address {
  oneof to {
    string agent = 1;               // agent id
    string group = 2;
    string topic = 3;               // capability topic, e.g. "stripe-test"
    string service = 4;             // orchestrator service: "registry", "agora", "approvals"
  }
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_REQUEST = 1;         // asks for work or an answer; wakes a hibernated recipient
  MESSAGE_KIND_INFORM = 2;          // FYI; never wakes
  MESSAGE_KIND_PROPOSE = 3;         // group invitations, plan suggestions
  MESSAGE_KIND_RESULT = 4;          // answer to a REQUEST (reply_to set)
  MESSAGE_KIND_QUESTION = 5;        // clarification; wakes
}

// What an agent sends. Sender identity, name and taint are NOT here: the orchestrator stamps them.
message Outgoing {
  string client_id = 1;             // idempotency key: resending the same id never duplicates
  Address to = 2;
  MessageKind kind = 3;
  string task_id = 4;
  string thread_id = 5;             // empty = new thread
  string reply_to = 6;
  Payload body = 7;                 // ≤ 16 KiB inline
  repeated BlobRef refs = 8;        // artifacts the sender may already read
  TraceContext trace = 9;           // 0116
}

// What an agent receives.
message Envelope {
  string id = 1;                    // ULID
  string from_agent = 2;            // stamped by the orchestrator, never self-claimed
  string from_name = 3;
  string from_role = 4;
  Address to = 5;
  MessageKind kind = 6;
  string task_id = 7;
  string group_id = 8;
  string thread_id = 9;
  uint32 thread_turn = 10;
  string reply_to = 11;
  Payload body = 12;
  repeated BlobRef refs = 13;       // access is granted to the recipient by sending
  Taint taint = 14;                 // from the sender's state; tainted bodies are shown as untrusted data
  int64 sent_unix_ms = 15;
}

// ---- Groups (comms.md § Groups) ----
message GroupPropose {
  string client_id = 1;
  string purpose = 2;
  repeated string invitees = 3;
  uint32 ttl_hours = 4;
  uint64 budget_credits = 5;        // must fit under the proposer's task budget
}
message GroupRespond { string group_id = 1; bool accept = 2; }
message GroupLeave { string group_id = 1; }
message GroupEvent {
  string group_id = 1;
  enum What { WHAT_UNSPECIFIED = 0; WHAT_CREATED = 1; WHAT_JOINED = 2; WHAT_LEFT = 3; WHAT_DISSOLVED = 4; WHAT_REJECTED = 5; }
  What what = 2;
  string agent = 3;
  string reason = 4;                // e.g. policy rejection, TTL expiry, task done
}

// ---- Claims board (0024) ----
message ClaimUpdate {
  string group_id = 1;
  string claim_id = 2;              // empty = new claim
  string summary = 3;
  enum Status { STATUS_UNSPECIFIED = 0; STATUS_OPEN = 1; STATUS_IN_PROGRESS = 2; STATUS_BLOCKED = 3; STATUS_DONE = 4; STATUS_DROPPED = 5; }
  Status status = 4;
  string blocker = 5;
  repeated BlobRef outputs = 6;
}
message Claim {
  string claim_id = 1;
  string owner_agent = 2;
  ClaimUpdate state = 3;
  int64 updated_unix_ms = 4;
}
message ClaimsRequest { string group_id = 1; }
message ClaimsSnapshot { string group_id = 1; repeated Claim claims = 2; }

// ---- Topic subscriptions (Cedar-checked) ----
message Subscribe { string topic = 1; }
message Unsubscribe { string topic = 1; }

// ---- Stream messages ----
message BusUp {
  oneof msg {
    Outgoing send = 1;
    string ack = 2;                 // envelope id processed; removes it from the durable inbox
    GroupPropose group_propose = 3;
    GroupRespond group_respond = 4;
    GroupLeave group_leave = 5;
    ClaimUpdate claim = 6;
    ClaimsRequest claims_request = 7;
    Subscribe subscribe = 8;
    Unsubscribe unsubscribe = 9;
  }
}

message BusDown {
  oneof msg {
    Envelope deliver = 1;
    Accepted accepted = 2;
    Rejected rejected = 3;
    GroupEvent group_event = 4;
    ClaimsSnapshot claims = 5;
    ThreadPaused thread_paused = 6;
  }
}

message Accepted { string client_id = 1; string envelope_id = 2; uint32 recipients = 3; }
message Rejected {
  string client_id = 1;
  enum Reason {
    REASON_UNSPECIFIED = 0; REASON_DENIED = 1; REASON_RATE_LIMITED = 2; REASON_TURN_CAP = 3;
    REASON_PING_PONG = 4; REASON_TOO_LARGE = 5; REASON_UNKNOWN_RECIPIENT = 6; REASON_BUDGET = 7;
  }
  Reason reason = 2;
  Error error = 3;                  // law_id on DENIED
}
message ThreadPaused { string thread_id = 1; string reason = 2; string escalated_to = 3; }
