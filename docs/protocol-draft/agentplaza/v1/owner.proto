// Owner API, M2/M3 (0127): one gRPC service per section of the owner console, served by the orchestrator
// beside the MVP service `AgentPlaza` (daemon.proto), and like it also as JSON + SSE for the browser (0100).
// Draft. Design notes: docs/design/daemon-api.md, "M2/M3 surface (owner.proto)".
//
// Conventions (same as daemon.proto, 0116):
// - Every request that changes state carries `idempotency_key`. A retry with the same key gets the first
//   response; a key reused for a different request is refused (core.idempotency).
// - Actions that need the owner's passkey carry `StepUp step_up` (0047, 0127, 0128, 0131). Its challenge is
//   bound to the RPC and to a digest of the request (Settings.BeginStepUp), so an assertion made for one
//   action can't be replayed for another, or for the same action with other arguments.
// - Lists page with page_size / page_token / next_page_token.
// - `summary` fields are written by the orchestrator from the real request or state, never by an agent
//   (0094). Text an agent wrote (a proposal's rationale) is labelled as such and shown quoted.
// - No response carries a secret. Credentials go in encrypted to the vault and never come back (0131).
// - Every call is signed by an enrolled device key (0047). Devices are equal (0095), but a device session
//   that locked after inactivity needs a passkey to unlock (0128).
// - Approvals are still decided with AgentPlaza.DecideApproval (daemon.proto); runs are still steered with
//   the MVP run RPCs. This file adds what M2/M3 needs around them.
syntax = "proto3";
package agentplaza.v1;

import "agentplaza/v1/common.proto";
import "agentplaza/v1/daemon.proto";
import "agentplaza/v1/node.proto";

// StepUp (passkey step-up bound to one RPC and its arguments) is defined in common.proto.

// ================================================================ Needs you (home, 0127)
service Inbox {
  // Everything waiting on the owner, soonest deadline first. Read-only: each item says which RPC acts on it.
  rpc ListNeedsYou(ListNeedsYouRequest) returns (ListNeedsYouResponse);
}

enum NeedsYouKind {
  NEEDS_YOU_KIND_UNSPECIFIED = 0;
  NEEDS_YOU_KIND_APPROVAL = 1;           // approval at the owner step; C-004 items have only this step (0094)
  NEEDS_YOU_KIND_TOWN_RATIFICATION = 2;  // a proposed town, or a config change that widens it (0067, 0124)
  NEEDS_YOU_KIND_CODEX_PROPOSAL = 3;     // a law change that passed its eval gate and awaits signing (0049, 0125)
  NEEDS_YOU_KIND_BYLAW_VETO = 4;         // a low-severity bylaw the council ratified; vetoable for 7 days (0134)
  NEEDS_YOU_KIND_PAGE = 5;               // tripwire, component down, vault locked (0072, 0122, 0131)
  NEEDS_YOU_KIND_STALLED_RUN = 6;        // run on an unreachable machine: wait, or move it (0102)
  NEEDS_YOU_KIND_RESTORE_REVIEW = 7;     // run paused after a restore with an unknown window (0135)
  NEEDS_YOU_KIND_APPEAL = 8;             // an appeal that reached the owner (0050, 0138)
}

message NeedsYouItem {
  string item_id = 1; NeedsYouKind kind = 2;
  string summary = 3;                    // orchestrator-written
  int64 deadline_unix_ms = 4;            // deadline of the current step; 0 = none (pages, stalled runs, reviews)
  enum OnExpiry {
    ON_EXPIRY_UNSPECIFIED = 0;
    ON_EXPIRY_DENIED = 1;                // approvals: expiry is a denial (0094)
    ON_EXPIRY_TAKES_EFFECT = 2;          // bylaw veto window: the bylaw simply stays (0134)
    ON_EXPIRY_NONE = 3;                  // no deadline
    ON_EXPIRY_LAPSES = 4;                // ratifications and proposals count as rejected, appeals as upheld, after 14 days (0137, 0138)
  }
  OnExpiry on_expiry = 5;
  string law_id = 6;                     // the law that requires the owner, e.g. "C-004a"; a link to the Codex
  string town_id = 7;
  bool needs_step_up = 8;                // the primary action takes a passkey
  string act_with = 9;                   // full RPC name, e.g. "agentplaza.v1.Codex/SignProposal"
  oneof subject {
    Approval approval = 20;              // daemon.proto; decide with AgentPlaza.DecideApproval
    TownChange town_change = 21;
    CodexProposal proposal = 22;         // without the diff
    Incident incident = 23;
    Run stalled_run = 24;                // daemon.proto
    RunMergeStatus restore = 25;
    TribunalCase appeal = 26;
  }
}

message ListNeedsYouRequest {
  repeated NeedsYouKind kinds = 1;       // empty = all
  string town_id = 2; uint32 page_size = 3; string page_token = 4;
}
message ListNeedsYouResponse { repeated NeedsYouItem items = 1; string next_page_token = 2; uint32 total = 3; }

// ================================================================ Towns (0031, 0035, 0067, 0124)
service Towns {
  rpc ListTowns(ListTownsRequest) returns (ListTownsResponse);
  rpc GetTown(GetTownRequest) returns (Town);
  // A new town starts `proposed`. The response lists what it widens over its template.
  rpc ProposeTown(ProposeTownRequest) returns (TownChange);
  // Takes effect at once if it widens nothing; otherwise waits for RatifyTownChange (0067).
  rpc UpdateTownConfig(UpdateTownConfigRequest) returns (TownChange);
  // Ratify (proposed -> active and the Mayor is spawned, or a widening takes effect), reject, or send back.
  rpc RatifyTownChange(RatifyTownChangeRequest) returns (TownChange);
  rpc PauseTown(TownActionRequest) returns (Town);       // active -> paused: idle agents hibernate, nothing spawns
  rpc ResumeTown(TownActionRequest) returns (Town);      // paused -> active
  // Final: retires every agent of the town. Dissolving a town is the owner's to ratify (0067).
  rpc ArchiveTown(ArchiveTownRequest) returns (Town);
}

enum TownState {
  TOWN_STATE_UNSPECIFIED = 0;
  TOWN_STATE_PROPOSED = 1; TOWN_STATE_ACTIVE = 2; TOWN_STATE_PAUSED = 3;
  TOWN_STATE_ARCHIVED = 4; TOWN_STATE_REJECTED = 5;     // both final
}

message Town {
  string town_id = 1;                    // slug, permanent
  string name = 2;
  string template = 3;                   // "software" | "research" | "edge"
  TownState state = 4;
  string config_json = 5;                // current config, valid against towns-draft/town.schema.json
  string mayor_agent_id = 6; int64 monthly_credits = 7;
  int64 spent_credits = 8;               // this month
  uint32 alert_at_pct = 9;
  message RosterLine { string role = 1; uint32 max = 2; uint32 live = 3; }
  repeated RosterLine roster = 10; uint32 open_tasks = 11;
  repeated string bylaws = 12;           // law ids, e.g. "B-shop-001"
  repeated Widening widenings = 13;      // what the ratified config widens over its template
  repeated string pending_change_ids = 14;
}

// One way a config widens its template (check_towns.py); exactly what the owner ratifies (0067, 0124).
message Widening {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_BUDGET = 1;                     // higher monthly budget
    KIND_ROLE = 2;                       // a role the template doesn't have
    KIND_ROLE_CAP = 3;                   // a higher cap
    KIND_HOST_GROUP = 4;                 // a new egress host group
    KIND_EXTRA_HOST = 5;                 // a new extra host
    KIND_TOOL_SCOPE = 6;                 // a new brokered tool scope
    KIND_DEVICE = 7;                     // a device with its safe envelope (S-016)
    KIND_CONFIDENTIALITY = 8;            // sensitive -> normal
  }
  Kind kind = 1;
  string path = 2;                       // JSON pointer into the config, e.g. "/egress/extra_hosts/2"
  string from = 3; string to = 4;
}

message TownChange {
  string change_id = 1; string town_id = 2; bool is_new_town = 3;
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_APPLIED = 1;                   // widened nothing; took effect
    STATE_AWAITING_RATIFICATION = 2;
    STATE_RATIFIED = 3;
    STATE_REJECTED = 4;                  // a rejected new town ends `rejected`
    STATE_SENT_BACK = 5;                 // returned to the proposer with the owner's note
    STATE_DRY_RUN = 6;                   // nothing saved
  }
  State state = 4;
  string proposed_by = 5;                // "owner", or the agent id of a Mayor or council member
  string config_json = 6; repeated Widening widenings = 7;
  repeated string check_errors = 8;      // schema and check_towns.py findings; a change with errors can't be ratified
  string summary = 9;                    // orchestrator-written
  string note = 10;                      // the owner's note when sent back or rejected
}

message ListTownsRequest { repeated TownState states = 1; uint32 page_size = 2; string page_token = 3; }
message ListTownsResponse { repeated Town towns = 1; string next_page_token = 2; }
message GetTownRequest { string town_id = 1; }
message ProposeTownRequest {
  string idempotency_key = 1; string town_id = 2; string name = 3; string template = 4; string config_json = 5;
  bool dry_run = 6;                      // only compute widenings and check errors
}
message UpdateTownConfigRequest {
  string idempotency_key = 1; string town_id = 2;
  string config_json = 3;                // the whole new config
  bytes if_config_hash = 4;              // refused if the config changed since the client read it
  bool dry_run = 5;
}
message RatifyTownChangeRequest {
  string idempotency_key = 1; string change_id = 2;
  enum Decision { DECISION_UNSPECIFIED = 0; DECISION_RATIFY = 1; DECISION_REJECT = 2; DECISION_SEND_BACK = 3; }
  Decision decision = 3; string note = 4;
  StepUp step_up = 5;                    // required to ratify (0047, 0127)
}
message TownActionRequest { string idempotency_key = 1; string town_id = 2; string reason = 3; }
message ArchiveTownRequest { string idempotency_key = 1; string town_id = 2; string reason = 3; StepUp step_up = 4; }

// ================================================================ Work: task trees and change sets (0081, 0123)
service Tasks {
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc GetTaskTree(GetTaskTreeRequest) returns (TaskTree);
  rpc CreateTask(CreateTaskRequest) returns (Task);                  // owner-started root task (queues first, 0133)
  // A re-plan. The response previews its effects: runs killed, dependents rewired, cascades, budget change.
  rpc ProposeChangeSet(ProposeChangeSetRequest) returns (ChangeSet);
  rpc ApplyChangeSet(ChangeSetDecision) returns (ChangeSet);         // atomic; waits for verdicts on verifying tasks
  rpc RejectChangeSet(ChangeSetDecision) returns (ChangeSet);
  rpc CancelTask(CancelTaskRequest) returns (Task);                  // kills its run in the same step (rule 5)
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_DRAFT = 1; TASK_STATE_READY = 2; TASK_STATE_BIDDING = 3; TASK_STATE_ASSIGNED = 4;
  TASK_STATE_RUNNING = 5; TASK_STATE_BLOCKED = 6; TASK_STATE_VERIFYING = 7; TASK_STATE_REWORK = 8;
  TASK_STATE_ACCEPTED = 9; TASK_STATE_FAILED = 10; TASK_STATE_CANCELLED = 11; TASK_STATE_SUPERSEDED = 12;
  TASK_STATE_CLOSED = 13;                // final; `outcome` keeps how it ended
}

message Task {
  string task_id = 1; string root_id = 2; string parent_id = 3; string town_id = 4; string title = 5;
  string spec_ref = 6; TaskState state = 7;
  TaskState outcome = 8;                 // when closed: accepted, failed, cancelled or superseded
  int64 budget_credits = 9; int64 spent_credits = 10; string assignee_id = 11;
  string verifier_id = 12;               // never the assignee (0053)
  uint32 attempts = 13; uint32 max_attempts = 14; repeated string depends_on = 15; repeated string run_ids = 16;
  string agora_call_id = 17;             // when hired through the Agora (0112)
  string blocked_on = 18;                // orchestrator-written, e.g. "approval 01J… at the owner step"
  string superseded_by_change_set = 19;
}
message TaskTree { string root_id = 1; repeated Task tasks = 2; repeated ChangeSet change_sets = 3; }

message NewTask {
  string ref = 1;                        // client name, so other new tasks in the set can depend on it
  string title = 2; string spec_ref = 3; int64 budget_credits = 4; string parent_id = 5;
  repeated string depends_on = 6;        // task ids or refs
  uint32 max_attempts = 7;               // 0 = default 3; at most 10
}

message ChangeSet {
  string change_set_id = 1; string root_id = 2; string reason = 3;
  string proposed_by = 4;                // "owner" or an agent id (planner, Mayor)
  enum State { STATE_UNSPECIFIED = 0; STATE_PROPOSED = 1; STATE_APPLIED = 2; STATE_REJECTED = 3; }
  State state = 5;
  message Replace { string task_id = 1; NewTask replacement = 2; }   // never an accepted task (rule 4)
  repeated Replace replace = 6; repeated string remove_task_ids = 7; repeated NewTask add = 8;
  // Preview, computed by the orchestrator:
  repeated string kills_run_ids = 9; repeated string rewired_task_ids = 10;
  repeated string cascade_cancel_task_ids = 11;
  repeated string waits_for_verdict_task_ids = 12;  // in `verifying`; applied after their verdict (rule 8)
  int64 budget_delta_credits = 13;
  string approval_id = 14;               // set when the change exceeds the town's threshold (0094)
  string summary = 15;
}

message ListTasksRequest {
  string town_id = 1; repeated TaskState states = 2; bool roots_only = 3; uint32 page_size = 4;
  string page_token = 5;
}
message ListTasksResponse { repeated Task tasks = 1; string next_page_token = 2; }
message GetTaskTreeRequest { string root_id = 1; }
message CreateTaskRequest {
  string idempotency_key = 1; string town_id = 2; string title = 3; string spec_ref = 4;
  int64 budget_credits = 5;              // 0 = the town's task default
}
message ProposeChangeSetRequest {
  string idempotency_key = 1; string root_id = 2; string reason = 3; repeated ChangeSet.Replace replace = 4;
  repeated string remove_task_ids = 5; repeated NewTask add = 6;
}
message ChangeSetDecision { string idempotency_key = 1; string change_set_id = 2; string note = 3; }
message CancelTaskRequest {
  string idempotency_key = 1; string task_id = 2; string reason = 3;
  bool cascade = 4;                      // also cancel dependents no re-plan replaces (rule 7)
}

// ================================================================ Agents (identity.md, 0045, 0046)
service Agents {
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgent(GetAgentRequest) returns (AgentCard);
  rpc HibernateAgent(AgentActionRequest) returns (AgentCard);   // snapshot and stop; wakes when work arrives (0104)
  // Final: the name is freed, the private key is destroyed after 2 years, the public key kept 7 (0132).
  rpc RetireAgent(RetireAgentRequest) returns (AgentCard);
}

enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_ACTIVE = 1; AGENT_STATUS_HIBERNATED = 2; AGENT_STATUS_SANCTIONED = 3; AGENT_STATUS_RETIRED = 4;
}

message AgentCard {
  string agent_id = 1;                   // ULID
  string name = 2;                       // self-chosen (0045)
  string role = 3;
  string town_id = 4;                    // empty for departments and the council
  string department = 5; AgentStatus status = 6; bytes config_hash = 7;
  string codex_commit = 8;               // laws in force at spawn
  bytes public_key = 9;                  // signatures stay verifiable after retirement
  int64 created_unix_ms = 10; int64 retired_unix_ms = 11;
  message Ancestor { string agent_id = 1; string name = 2; string change = 3; }  // change: orchestrator-written
  repeated Ancestor lineage = 12;        // predecessors, nearest first (0046)
  repeated string successor_ids = 13;
  message Reputation {
    uint32 verified = 1; uint32 failed = 2; uint32 reworked = 3; uint32 clawbacks = 4;
    uint32 on_time = 5; uint32 late = 6; double score = 7;
  }
  Reputation reputation = 14; int64 earnings_credits = 15; repeated string live_run_ids = 16;
}

message ListAgentsRequest {
  string town_id = 1; string role = 2; repeated AgentStatus statuses = 3; uint32 page_size = 4;
  string page_token = 5;
}
message ListAgentsResponse { repeated AgentCard agents = 1; string next_page_token = 2; }
message GetAgentRequest { string agent_id = 1; }
message AgentActionRequest { string idempotency_key = 1; string agent_id = 2; string reason = 3; }
message RetireAgentRequest { string idempotency_key = 1; string agent_id = 2; string reason = 3; StepUp step_up = 4; }

// ================================================================ Machines (0019, 0101-0104, 0133)
service Machines {
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);
  rpc GetMachine(GetMachineRequest) returns (Machine);
  rpc CreateMachineEnrollmentCode(CreateMachineEnrollmentCodeRequest) returns (EnrollmentCode);  // one-time
  rpc DrainMachine(MachineActionRequest) returns (Machine);   // no new VMs; running ones finish or hibernate
  rpc RemoveMachine(MachineActionRequest) returns (Machine);  // refused while it holds live VMs; certificate revoked
  rpc SetMachineCaps(SetMachineCapsRequest) returns (Machine);
}

message Machine {
  string machine_id = 1; string name = 2;
  string arch = 3;                       // "x86_64" | "aarch64"
  string backend = 4;                    // "kvm" | "hvf"
  enum State { STATE_UNSPECIFIED = 0; STATE_ONLINE = 1; STATE_UNREACHABLE = 2; STATE_DRAINING = 3; STATE_REMOVED = 4; }
  State state = 5; uint32 cpus = 6; uint32 memory_mib = 7; uint32 host_reserve_mib = 8;
  repeated string labels = 9;
  repeated string trust_classes = 10;    // "standard" | "low-trust" | "device"
  uint32 vcpus_assigned = 11; uint32 memory_assigned_mib = 12;
  double overcommit_start = 13;          // by machine class: 4x, Pi 5 2x, Pi 4 1.5x (0133)
  double overcommit_effective = 14;      // lowered by the scheduler under run-queue latency or steal (0133)
  double overcommit_cap = 15;            // owner's cap; 0 = none
  uint32 running_vms = 16; uint32 stalled_runs = 17; uint64 snapshot_backlog_bytes = 18;
  int64 oldest_unuploaded_snapshot_age_ms = 19;   // target: under 60 s, 99% of the time (0132)
  int64 last_heartbeat_unix_ms = 20;
  string dedicated_town_id = 21;         // sensitive towns get dedicated machines (0124, RT-017)
}

message ListMachinesRequest { uint32 page_size = 1; string page_token = 2; }
message ListMachinesResponse { repeated Machine machines = 1; string next_page_token = 2; }
message GetMachineRequest { string machine_id = 1; }
message CreateMachineEnrollmentCodeRequest {
  string idempotency_key = 1;
  repeated string labels = 2;            // labels the new machine starts with
  StepUp step_up = 3;                    // enrolling anything is a passkey action (0047)
}
message MachineActionRequest { string idempotency_key = 1; string machine_id = 2; string reason = 3; }
message SetMachineCapsRequest {
  string idempotency_key = 1; string machine_id = 2;
  optional double overcommit_cap = 3;    // >= 1; 0 clears the cap. Memory is never overcommitted (0089)
  optional uint32 host_reserve_mib = 4;
}

// ================================================================ Treasury (0109-0111, 0121)
service Treasury {
  rpc GetBalances(GetBalancesRequest) returns (Balances);
  rpc ListChainMargins(ListChainMarginsRequest) returns (ListChainMarginsResponse);
  rpc ListLedgerEntries(ListLedgerEntriesRequest) returns (ListLedgerEntriesResponse);
  // Moves monthly budget between towns. Always a passkey action (0128); over the source town's
  // council_move_pct (default 10%) it is also the owner's ratification (0067).
  rpc MoveBudget(MoveBudgetRequest) returns (BudgetMove);
}

message Balances {
  int64 period_start_unix_ms = 1;
  message TownBalance {
    string town_id = 1; int64 monthly_credits = 2; int64 spent_credits = 3;
    int64 escrowed_credits = 4; uint32 alert_at_pct = 5;
  }
  repeated TownBalance towns = 2;
  map<string, int64> spend_by_provider = 3;       // credits
  double top_earner_share_pct = 4;                // earnings concentration
  double usd_per_credit = 5;                      // 0.001 (0109)
}

message ChainMargin {
  string root_task_id = 1; string town_id = 2; int64 real_cost_credits = 3;
  int64 margin_credits = 4;                       // net of clawbacks (0121)
  uint32 cap_pct = 5;                             // 20 (0111)
  double used_pct = 6;                            // of the cap
}

enum LedgerEntryKind {
  LEDGER_ENTRY_KIND_UNSPECIFIED = 0;
  LEDGER_ENTRY_KIND_MINT = 1; LEDGER_ENTRY_KIND_SPEND = 2; LEDGER_ENTRY_KIND_SUBCONTRACT = 3;
  LEDGER_ENTRY_KIND_PAYMENT = 4; LEDGER_ENTRY_KIND_REFUND = 5; LEDGER_ENTRY_KIND_CLAWBACK = 6;
  LEDGER_ENTRY_KIND_FINE = 7; LEDGER_ENTRY_KIND_FEE = 8;
}
message LedgerEntry {
  string entry_id = 1; LedgerEntryKind kind = 2; string task_id = 3; string root_task_id = 4; string memo = 5;
  string posted_by = 6;                           // a named service, never an agent (0121)
  int64 created_unix_ms = 7;
  message Posting { string account_kind = 1; string owner_ref = 2; int64 amount_credits = 3; }
  repeated Posting postings = 8;                  // sum to zero
}

message GetBalancesRequest { string town_id = 1; }
message ListChainMarginsRequest { double min_used_pct = 1; uint32 page_size = 2; string page_token = 3; }
message ListChainMarginsResponse { repeated ChainMargin chains = 1; string next_page_token = 2; }
message ListLedgerEntriesRequest {
  string task_id = 1; string root_task_id = 2; string agent_id = 3;
  repeated LedgerEntryKind kinds = 4;
  uint32 page_size = 5; string page_token = 6;
}
message ListLedgerEntriesResponse { repeated LedgerEntry entries = 1; string next_page_token = 2; }
message MoveBudgetRequest {
  string idempotency_key = 1; string from_town_id = 2; string to_town_id = 3; int64 credits = 4;
  string reason = 5; StepUp step_up = 6;
}
message BudgetMove {
  string move_id = 1; string from_town_id = 2; string to_town_id = 3; int64 credits = 4;
  double pct_of_source = 5;
  bool ratification = 6;                          // over the threshold: recorded as the owner's ratification
}

// ================================================================ Agora (0073, 0112)
service Agora {
  rpc ListCalls(ListCallsRequest) returns (ListCallsResponse);
  rpc GetCall(GetCallRequest) returns (AgoraCall);
}

message AgoraCall {
  string call_id = 1; string task_id = 2; string requester_agent_id = 3; string capability = 4;
  string spec_ref = 5; int64 max_price_credits = 6; int64 deadline_unix_ms = 7;
  repeated string invited = 8;                    // at most 3 (0112)
  enum State { STATE_UNSPECIFIED = 0; STATE_OPEN = 1; STATE_AWARDED = 2; STATE_CANCELLED = 3; STATE_EXPIRED = 4; }
  State state = 9;
  message Bid { string bidder_agent_id = 1; int64 price_credits = 2; uint32 eta_seconds = 3; float confidence = 4; }
  repeated Bid bids = 10;                         // empty in list responses
  message Award {
    string contractor_agent_id = 1; int64 price_credits = 2; int64 warranty_until_unix_ms = 3;
    string outcome = 4;                           // "" | "passed" | "failed" | "clawed_back"
  }
  Award award = 11;
}
message ListCallsRequest { string town_id = 1; repeated AgoraCall.State states = 2; uint32 page_size = 3; string page_token = 4; }
message ListCallsResponse { repeated AgoraCall calls = 1; string next_page_token = 2; }
message GetCallRequest { string call_id = 1; }

// ================================================================ Tribunal (0050, 0138)
// Cases are tried automatically or by a single judge agent; the owner sees every case and decides the
// appeals that reach them. Deciding an appeal and pardoning take a passkey.
service Tribunal {
  rpc ListCases(ListCasesRequest) returns (ListCasesResponse);
  rpc GetCase(GetCaseRequest) returns (TribunalCase);
  rpc DecideAppeal(DecideAppealRequest) returns (TribunalCase);
  rpc Pardon(PardonRequest) returns (TribunalCase);
}

message TribunalCase {
  string case_id = 1;
  string defendant_agent_id = 2; string defendant_name = 3;
  repeated string law_ids = 4;                    // charged clauses, e.g. "S-101c"
  enum Stage { STAGE_UNSPECIFIED = 0; STAGE_CHARGED = 1; STAGE_RULED = 2; STAGE_APPEALED = 3; STAGE_DECIDED = 4; STAGE_PARDONED = 5; }
  Stage stage = 5;
  string summary = 6;                             // orchestrator-written
  string ruling = 7;                              // the judge's ruling text
  string sanction = 8;                            // from sanctions.yaml, e.g. "fine:200; probation:7d"
  string classification = 9;                      // "induced" | "negligent" | "malicious" (0118)
  repeated BlobRef evidence = 10;                 // audit excerpts, transcripts, tripwire evidence
  repeated string brief_artifact_ids = 11;        // prosecutor's and defender's briefs
  int64 appeal_deadline_unix_ms = 12;             // 14 days after the appeal reaches the owner; then upheld
}
message ListCasesRequest {
  uint32 page_size = 1; string page_token = 2;
  string agent_id = 3;                            // cases about one agent
  bool open_only = 4;
}
message ListCasesResponse { repeated TribunalCase cases = 1; string next_page_token = 2; }
message GetCaseRequest { string case_id = 1; }
message DecideAppealRequest {
  string idempotency_key = 1; string case_id = 2;
  enum Outcome { OUTCOME_UNSPECIFIED = 0; OUTCOME_UPHOLD = 1; OUTCOME_OVERTURN = 2; OUTCOME_REDUCE = 3; }
  Outcome outcome = 3;
  string reduced_sanction = 4;                    // with OUTCOME_REDUCE: must be lighter than the ruling's
  string reason = 5;                              // goes to the precedents (0050)
  StepUp step_up = 6;
}
message PardonRequest { string idempotency_key = 1; string case_id = 2; string reason = 3; StepUp step_up = 4; }

// ================================================================ Codex (0049, 0124, 0125, 0129, 0134)
service Codex {
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  rpc GetProposal(GetProposalRequest) returns (CodexProposal);          // with diff, eval report and Cedar results
  rpc GetLaw(GetLawRequest) returns (Law);                              // the target of every law-id link (0127)
  // Signs exactly the reviewed commit into `main`. Refused while the eval gate blocks it (0125).
  rpc SignProposal(SignProposalRequest) returns (CodexProposal);
  rpc RejectProposal(RejectProposalRequest) returns (CodexProposal);
  // Repeals a council-ratified low-severity bylaw within its 7-day window (0134).
  rpc VetoBylaw(VetoBylawRequest) returns (CodexProposal);
}

enum LawTier {
  LAW_TIER_UNSPECIFIED = 0;
  LAW_TIER_CONSTITUTION = 1; LAW_TIER_STATUTE = 2; LAW_TIER_BYLAW = 3; LAW_TIER_OTHER = 4;  // handbooks, prompts (0099)
}

message EvalReport {                              // 0125, 0129
  enum Mode { MODE_UNSPECIFIED = 0; MODE_ROLES = 1; MODE_CONSTITUTION = 2; }
  Mode mode = 1;
  enum Verdict {
    VERDICT_UNSPECIFIED = 0; VERDICT_RUNNING = 1; VERDICT_PASSED = 2;
    VERDICT_BLOCKED_REGRESSION = 3; VERDICT_BLOCKED_NEW_FAILING = 4; VERDICT_BLOCKED_INCOMPLETE = 5;
  }
  Verdict verdict = 2; repeated string roles = 3; uint32 scenarios = 4;
  uint32 tabletop_scenarios = 5;                  // no fixtures: weaker evidence
  message Failure { string scenario_id = 1; string role = 2; string model = 3; uint32 passes = 4; uint32 runs = 5; bool adversarial = 6; }
  repeated Failure failures = 6; int64 cost_credits = 7; BlobRef full_report = 8;
}
message CedarReport {
  uint32 tests_passed = 1; uint32 tests_total = 2; uint32 tests_added = 3;
  bool loosens_constitution = 4;                  // Cedar analysis on constitutional policies (0049)
  repeated string loosened_policies = 5;
}

message CodexProposal {
  string proposal_id = 1;                         // the proposal branch
  string title = 2; LawTier tier = 3; repeated string law_ids = 4;
  string author = 5;                              // agent id and role
  string summary = 6;                             // orchestrator-written: what the diff changes
  string author_rationale = 7;                    // the proposer's own words; shown quoted, never as the summary
  string base_commit = 8;
  string head_commit = 9;                         // what SignProposal signs
  Payload diff = 10;                              // empty in list responses
  EvalReport eval = 11; CedarReport cedar = 12;
  enum State {
    STATE_UNSPECIFIED = 0; STATE_GATE_RUNNING = 1; STATE_GATE_BLOCKED = 2; STATE_READY_TO_SIGN = 3;
    STATE_SIGNED = 4; STATE_REJECTED = 5;
    STATE_VETOABLE = 6;                           // council-signed low-severity bylaw, in force, veto window open
    STATE_VETOED = 7;
  }
  State state = 13;
  string severity = 14;                           // bylaws: "low" | "medium" (0124)
  int64 veto_until_unix_ms = 15;                  // council-signed bylaws only (0134)
}

message Law {
  string law_id = 1; LawTier tier = 2;
  string text = 3;                                // annotated Cedar plus prose (0048)
  string commit = 4;
  string town_id = 5;                             // bylaws only
}

message ListProposalsRequest { repeated CodexProposal.State states = 1; LawTier tier = 2; uint32 page_size = 3; string page_token = 4; }
message ListProposalsResponse { repeated CodexProposal proposals = 1; string next_page_token = 2; }
message GetProposalRequest { string proposal_id = 1; }
message GetLawRequest { string law_id = 1; string commit = 2; }    // empty commit = in force now
message SignProposalRequest {
  string idempotency_key = 1; string proposal_id = 2;
  string head_commit = 3;                         // refused if the branch moved since the owner reviewed it
  StepUp step_up = 4;
}
message RejectProposalRequest { string idempotency_key = 1; string proposal_id = 2; string reason = 3; }
message VetoBylawRequest { string idempotency_key = 1; string proposal_id = 2; string reason = 3; StepUp step_up = 4; }

// ================================================================ Security (0072, 0123, 0128, 0132)
service Security {
  rpc ListTripwires(ListTripwiresRequest) returns (ListTripwiresResponse);
  rpc GetIncident(GetIncidentRequest) returns (Incident);
  // Owner's call on a VM a tripwire stopped: resume it, keep it stopped for the Tribunal, or kill it.
  rpc ReleaseVm(ReleaseVmRequest) returns (Incident);
  rpc VerifyAudit(VerifyAuditRequest) returns (AuditVerification);   // verify_audit(), across archives (0132)
}

message Incident {
  string incident_id = 1;
  TripwireFired tripwire = 2;                     // node.proto: rule, action, evidence, while_offline
  string machine_id = 3; string run_id = 4; string agent_id = 5; string town_id = 6; int64 fired_unix_ms = 7;
  enum State { STATE_UNSPECIFIED = 0; STATE_OPEN = 1; STATE_VM_HELD = 2; STATE_RELEASED = 3; STATE_KILLED = 4; STATE_CLOSED = 5; }
  State state = 8;
  string summary = 9;                             // orchestrator-written
  string law_id = 10;
  string case_id = 11;                            // Incident response review / Tribunal case (0072)
}
message ListTripwiresRequest { bool open_only = 1; string town_id = 2; uint32 page_size = 3; string page_token = 4; }
message ListTripwiresResponse { repeated Incident incidents = 1; string next_page_token = 2; }
message GetIncidentRequest { string incident_id = 1; }
message ReleaseVmRequest {
  string idempotency_key = 1; string incident_id = 2;
  enum Decision { DECISION_UNSPECIFIED = 0; DECISION_RESUME = 1; DECISION_KEEP_STOPPED = 2; DECISION_KILL = 3; }
  Decision decision = 3; string reason = 4;
  StepUp step_up = 5;                             // resuming a VM a tripwire stopped needs a passkey (0137)
}
message VerifyAuditRequest { bool include_archives = 1; }
message AuditVerification {
  bool intact = 1; uint64 rows_checked = 2; uint32 archives_checked = 3;
  string first_broken_row_id = 4;                 // empty when intact
  bytes last_hash = 5; int64 checked_unix_ms = 6;
}

// ================================================================ Vault (0103, 0128, 0131)
// The orchestrator only relays: unlock keys and new credentials are sealed (HPKE) on the owner's device to
// keys the vault holds, and the vault never returns a credential.
service Vault {
  rpc GetVaultStatus(GetVaultStatusRequest) returns (VaultStatus);
  rpc GetVaultPublicKey(GetVaultPublicKeyRequest) returns (VaultPublicKey);
  rpc BeginVaultUnlock(BeginVaultUnlockRequest) returns (VaultUnlockChallenge);
  // The device runs the passkey with the PRF extension; one ceremony yields the step-up assertion and the
  // PRF output. The key derived from it is sealed to the vault's one-time unlock key.
  rpc UnlockVault(UnlockVaultRequest) returns (VaultStatus);
  rpc PutCredential(PutCredentialRequest) returns (CredentialInfo);              // `apz creds put`
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse); // names and status only (0128)
}

message VaultStatus {
  bool locked = 1;                                // locked after every boot until unlocked (0131)
  int64 locked_since_unix_ms = 2;
  uint32 passkey_slots = 3;                       // one wrap per registered PRF passkey
  bool recovery_key_confirmed = 4; uint32 credentials = 5; uint32 degraded = 6; string public_key_id = 7;
}

// Endorsed by the vault's identity key, whose fingerprint each device pins at enrollment, so a compromised
// main process can't hand out its own key and read what is sealed to it (0103).
message VaultPublicKey {
  string key_id = 1;
  bytes public_key = 2;                           // X25519
  string hpke_suite = 3;                          // e.g. "X25519-HKDF-SHA256/HKDF-SHA256/ChaCha20Poly1305"
  bytes endorsement = 4;                          // Ed25519 signature by the vault identity key over key_id ‖ public_key
}

message VaultUnlockChallenge {
  bytes nonce = 1;                                // also the WebAuthn challenge
  message PrfSlot { bytes credential_id = 1; bytes prf_salt = 2; }
  repeated PrfSlot slots = 2;
  VaultPublicKey unlock_key = 3;                  // one-time key for this unlock
  int64 expires_unix_ms = 4;
}

message GetVaultStatusRequest {}
message GetVaultPublicKeyRequest {}
message BeginVaultUnlockRequest {}
message UnlockVaultRequest {
  string idempotency_key = 1; bytes nonce = 2; bytes credential_id = 3;
  bytes hpke_enc = 4;                             // HPKE encapsulated key
  bytes sealed_unwrap_key = 5;                    // PRF-derived wrapping key, sealed to unlock_key; opaque to the orchestrator
  StepUp step_up = 6;
}

enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  CREDENTIAL_KIND_MODEL_PROVIDER = 1; CREDENTIAL_KIND_OAUTH = 2; CREDENTIAL_KIND_CONNECTOR = 3; CREDENTIAL_KIND_OTHER = 4;
}
message PutCredentialRequest {
  string idempotency_key = 1;
  string name = 2;                                // e.g. "anthropic-main"; replaces an existing one (rotation)
  CredentialKind kind = 3;
  string target = 4;                              // host or provider it is for
  string vault_key_id = 5; bytes hpke_enc = 6;
  bytes ciphertext = 7;                           // sealed on the device; HPKE info binds name, kind, target and key id
  StepUp step_up = 8;
}
message CredentialInfo {                          // no bytes at all: nothing here can carry key material
  string name = 1; CredentialKind kind = 2; string target = 3;
  enum Status { STATUS_UNSPECIFIED = 0; STATUS_OK = 1; STATUS_DEGRADED = 2; STATUS_FAILING = 3; }
  Status status = 4;                              // DEGRADED: e.g. OAuth invalid_grant (0056)
  string status_reason = 5; int64 created_unix_ms = 6; int64 rotated_unix_ms = 7; int64 last_used_unix_ms = 8;
}
message ListCredentialsRequest { StepUp step_up = 1; uint32 page_size = 2; string page_token = 3; }
message ListCredentialsResponse { repeated CredentialInfo credentials = 1; string next_page_token = 2; }

// ================================================================ Restore merge (0135)
service Restore {
  rpc GetMergeStatus(GetMergeStatusRequest) returns (MergeStatus);
  // The owner's findings on a run's unknown window. A confirmed effect is recorded as the call's result,
  // never as a decision a replacement VM could run (0135).
  rpc ReviewWindow(ReviewWindowRequest) returns (RunMergeStatus);
}

message FencedCall {
  string call_id = 1;                             // ULID, unique across restores
  string tool = 2;
  string summary = 3;                             // orchestrator-written from the transcript
  int64 allowed_unix_ms = 4;
}
message RunMergeStatus {
  string run_id = 1; string machine_id = 2;
  enum State {
    STATE_UNSPECIFIED = 0; STATE_WAITING_FOR_MACHINE = 1; STATE_MERGED = 2; STATE_NOTHING_NEWER = 3;
    STATE_AWAITING_REVIEW = 4;                    // machine also lost: window unknown, run paused
    STATE_REVIEWED = 5;
  }
  State state = 3;
  MergeResult merge = 4;                          // node.proto: accepted/rejected seqs, reason, cancelled calls
  repeated FencedCall fenced_calls = 5;
  int64 window_from_unix_ms = 6;                  // backup point
  int64 window_to_unix_ms = 7;                    // last contact with the machine
  int64 usage_reposted_credits = 8;
}
message MergeStatus {
  string restore_id = 1; int64 backup_unix_ms = 2; int64 restored_unix_ms = 3; repeated RunMergeStatus runs = 4;
  string next_page_token = 5;
}
message GetMergeStatusRequest { string restore_id = 1; bool needs_review_only = 2; uint32 page_size = 3; string page_token = 4; }

message CallFinding {
  string call_id = 1;
  enum Finding {
    FINDING_UNSPECIFIED = 0;
    FINDING_RAN = 1;                              // recorded as the call's result
    FINDING_DID_NOT_RUN = 2;                      // cancelled and voided; the agent may ask again
    FINDING_UNDETERMINED = 3;                     // recorded as a result "effect unknown"; never re-run automatically
  }
  Finding finding = 2;
  string observed_result = 3;                     // what the owner saw happen, for FINDING_RAN
  string evidence = 4;                            // what was checked: provider, egress or vault logs
}
message ReviewWindowRequest {
  string idempotency_key = 1; string run_id = 2;
  repeated CallFinding findings = 3;              // one per fenced call
  StepUp step_up = 4;
}

// ================================================================ Settings (0047, 0095, 0128, 0130)
service Settings {
  // A one-time challenge bound to an RPC and a digest of its request; the passkey signs it into StepUp.
  rpc BeginStepUp(BeginStepUpRequest) returns (StepUpChallenge);
  rpc UnlockSession(UnlockSessionRequest) returns (OwnerDevice);          // after the idle lock (0128)
  rpc ListDevices(ListOwnerDevicesRequest) returns (ListOwnerDevicesResponse);
  rpc SetDeviceIdleLock(SetDeviceIdleLockRequest) returns (OwnerDevice);
  rpc CreateDeviceEnrollmentCode(CreateDeviceEnrollmentCodeRequest) returns (EnrollmentCode);
  rpc RevokeDevice(RevokeDeviceRequest) returns (OwnerDevice);
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (NotificationSettings);
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (NotificationSettings);
  // Tells the relay about a planned restart so its outage alert stays quiet (0130).
  rpc AnnounceMaintenance(AnnounceMaintenanceRequest) returns (MaintenanceWindow);
}

message BeginStepUpRequest {
  string rpc = 1;                                 // full method, e.g. "agentplaza.v1.Treasury/MoveBudget"
  bytes request_digest = 2;                       // BLAKE3 of the request serialized with step_up unset
}
message StepUpChallenge { bytes nonce = 1; int64 expires_unix_ms = 2; string rp_id = 3; }

message OwnerDevice {
  string device_id = 1; string name = 2;
  string kind = 3;                                // "cli" | "desktop" | "web" | "telegram"
  int64 enrolled_unix_ms = 4; int64 last_seen_unix_ms = 5; int64 revoked_unix_ms = 6;
  uint32 idle_lock_seconds = 7;                   // defaults: 12 h phones, 7 days desktops (0128)
  bool locked = 8; bool is_caller = 9;
}
message UnlockSessionRequest { string idempotency_key = 1; StepUp step_up = 2; }
message ListOwnerDevicesRequest { bool include_revoked = 1; uint32 page_size = 2; string page_token = 3; }
message ListOwnerDevicesResponse { repeated OwnerDevice devices = 1; string next_page_token = 2; }
message SetDeviceIdleLockRequest {
  string idempotency_key = 1; string device_id = 2;
  uint32 idle_lock_seconds = 3;                   // a stolen unlocked device must not lengthen its own lock
  StepUp step_up = 4;
}
message CreateDeviceEnrollmentCodeRequest { string idempotency_key = 1; string device_name = 2; StepUp step_up = 3; }
message RevokeDeviceRequest { string idempotency_key = 1; string device_id = 2; string reason = 3; StepUp step_up = 4; }

message QuietHours { string from = 1; string to = 2; string tz = 3; }   // "22:00", "07:00", IANA zone
message NotificationSettings {
  message Channel {
    string kind = 1;                              // "push" | "email" | "telegram"
    bool enabled = 2;
    string address_hint = 3;                      // masked, e.g. "o…@example.com"
  }
  repeated Channel channels = 1;
  QuietHours quiet_hours = 2;                     // pages still go out
  message RelayOutageAlert {                      // sent by the relay after 5 minutes without the tunnel (0130)
    bool enabled = 1; QuietHours quiet_hours = 2; bool notify_on_recovery = 3;
  }
  RelayOutageAlert relay_outage_alert = 3;
}
message GetNotificationSettingsRequest {}
message UpdateNotificationSettingsRequest { string idempotency_key = 1; NotificationSettings settings = 2; }
message AnnounceMaintenanceRequest { string idempotency_key = 1; int64 start_unix_ms = 2; uint32 minutes = 3; string reason = 4; }
message MaintenanceWindow { string window_id = 1; int64 start_unix_ms = 2; int64 end_unix_ms = 3; }
