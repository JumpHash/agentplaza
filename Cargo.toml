[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop", "apps/cli"]
# `cargo build` / `cargo test` without -p skip the desktop app (iced + wgpu is
# a heavy build); build it with `cargo build -p agentplaza-desktop`.
default-members = ["crates/*", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
kvm-ioctls = "0.25"
linux-loader = { version = "0.14", features = ["bzimage"] }
vm-fdt = "0.3"
vm-memory = { version = "0.18", default-features = false, features = ["backend-mmap"] }
vm-superio = "0.8"
vmm-sys-util = "0.15"
zerocopy = { version = "0.8", features = ["derive"] }
acpi_tables = { path = "crates/acpi-tables" }
apz-proto = { path = "crates/apz-proto" }
apz-http = { path = "crates/apz-http" }
apz-uds = { path = "crates/apz-uds" }
windows-sys = "0.61"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
blake2 = "0.10"
hmac = "0.12"
# The vault (crates/apid/src/vault): RustCrypto AEAD, KDF, key derivation, zeroed secrets.
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
zeroize = "1"
secrecy = "0.10"
base64 = "0.22"

# Debug builds keep line tables only (backtraces still name file:line) and
# drop debug info for dependencies entirely: this is most of target/'s size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# Dependencies optimised in dev too (wgpu, iced, glam, ring, …): built once, fast at run time.
opt-level = 2

[profile.release]
debug = false
strip = "debuginfo"
# No LTO: CI builds every release on 2–4 cores within minutes, and link-time optimisation would
# double that for little speed at run time.
lto = false

# The desktop app draws every frame on the CPU side too (scene walk, batching): its dev builds
# stay fast with the app itself optimised (dependencies are, below).
[profile.dev.package.agentplaza-desktop]
opt-level = 2
