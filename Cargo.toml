[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
kvm-ioctls = "0.25"
linux-loader = { version = "0.14", features = ["bzimage"] }
vm-fdt = "0.3"
vm-memory = { version = "0.18", features = ["backend-mmap"] }
vm-superio = "0.8"
vmm-sys-util = "0.15"
